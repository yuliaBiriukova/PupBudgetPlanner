name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; pushes to develop and main always run to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pup_budget_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database of this job only, not a secret.
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=pup_budget_planner;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build API
        working-directory: backend
        run: dotnet build src/PupBudgetPlanner.Api --configuration Release

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Playwright starts the API (which applies the migrations) and `vite preview`, see playwright.config.ts.
      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # Builds the production image (the one Render runs) and checks it serves the app and the API.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pup_budget_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag pup-budget-planner:ci .

      # Same settings as on Render (incl. the free instance's 512 MB), except the database: the throwaway one of this job.
      - name: Start container
        run: >-
          docker run --detach --name app --network host --memory 512m
          --env ASPNETCORE_ENVIRONMENT=Production
          --env "ConnectionStrings__Database=Host=localhost;Port=5432;Database=pup_budget_planner;Username=postgres;Password=postgres"
          pup-budget-planner:ci

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:8080
          # The API answers /api/health only after the migrations ran.
          for i in $(seq 1 60); do curl --silent --fail "$base/api/health" > /dev/null && break; sleep 1; done
          curl --silent --fail "$base/api/health" | grep --quiet '"Healthy"'
          curl --silent --fail "$base/" | grep --quiet '<div id="root">'
          curl --silent --fail "$base/some/client/route" | grep --quiet '<div id="root">'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/api/no-such-endpoint")" = 404
          echo "Image OK: $(docker image inspect pup-budget-planner:ci --format '{{.Size}}') bytes"

      # Render's free plan has no metrics, so memory is measured here (shown in the job summary).
      - name: Memory use
        run: |
          set -euo pipefail
          base=http://localhost:8080
          memory() { docker stats --no-stream --format '{{.MemUsage}} ({{.MemPerc}})' app; }
          after_start=$(memory)
          for i in $(seq 1 200); do curl --silent --output /dev/null "$base/"; curl --silent --output /dev/null "$base/api/health"; done
          after_requests=$(memory)
          {
            echo "### Container memory (limit 512 MB)"
            echo "- After start-up and the smoke test: $after_start"
            echo "- After 400 more requests: $after_requests"
            echo "- Image size: $(docker image inspect pup-budget-planner:ci --format '{{.Size}}') bytes"
          } | tee --append "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs app
