<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-011 · Variant 1 · Ledger page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Unbounded:wght@300&display=swap">
<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.pv-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.pv-bar button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pv-bar button:hover { background: #363c47; }
.pv-bar button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(460px, calc(100vw - 32px)); background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.pv-notes ul { margin: 6px 0 0; padding-left: 18px; }
.pv-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='tablet'] .frame { width: 834px; height: min(1050px, 100%); border: 12px solid #16181d; border-radius: 28px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
}

/* ---------- Tokens: the F-010 theme (charcoal and sky), plus error red and input borders ---------- */
.app {
  --bg: #f5f6f7; --panel: #ebedf0; --surface: #fcfcfd; --text: #1c1e21; --muted: #57585b; --rule: #d7d8d9;
  --field-border: #7c828a; --hover: #e8e9ea;
  --primary: #26292e; --primary-hover: #363a40; --on-primary: #f5f6f7;
  --accent: #2a62a3; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --error: #b3261e; --error-bg: #fbeceb; --error-text: #8c1d18; --income: #17693f;
  --pill: #1c1e21; --on-pill: #f5f6f7; --focus: #2a62a3;
  --font-display: 'Unbounded', system-ui, sans-serif; --font-text: 'Manrope', system-ui, sans-serif;
  --r-sm: 12px; --r-lg: 24px;
}
.app[data-scheme='dark'] {
  --bg: #121315; --panel: #18191b; --surface: #1b1c1e; --text: #e9eaec; --muted: #a4a5a7; --rule: #37383a;
  --field-border: #71747b; --hover: #212224;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --logo: #8ec1ec; --logo-mark: #121315;
  --error: #f2958c; --error-bg: #3a1d1b; --error-text: #f6b8b2; --income: #6fcf97;
  --pill: #e9eaec; --on-pill: #121315; --focus: #8ec1ec;
}

/* ---------- Structure ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, p) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.amt { font-variant-numeric: tabular-nums; white-space: nowrap; }

.layout { height: 100%; overflow: hidden auto; display: grid; grid-template-columns: minmax(0, 1fr); }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 32px; height: 32px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.brand-name { font-family: var(--font-display); font-weight: 300; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }

/* The ledger panel: what the app gives you, as a page of the yearly report (desktop only) */
.ledger { display: none; }

.form-side { display: flex; flex-direction: column; padding: 16px 16px 32px; min-height: 100%; }
.form-side > .brand { height: 44px; margin-bottom: 24px; }
.form-wrap { width: 100%; max-width: 400px; margin: 0 auto; }
.form-wrap h1 { font-family: var(--font-display); font-weight: 300; font-size: 26px; line-height: 1.2; letter-spacing: -.005em; }
.lead { color: var(--muted); margin-top: 8px; }

/* Form */
form { margin-top: 28px; display: grid; gap: 20px; }
.field label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
.control { position: relative; display: flex; }
.control input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-size: 16px; }
.control input:focus { outline: 1px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.control.has-toggle input { padding-right: 52px; }
.toggle { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 10px; color: var(--muted); cursor: pointer; }
.toggle:hover { color: var(--text); background: var(--hover); }
.msg { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.field[data-invalid] .control input { border-color: var(--error); box-shadow: 0 0 0 1px var(--error); }
.field[data-invalid] .msg { color: var(--error); }
.text-link { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.field .text-link { margin-top: -4px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--error-bg); color: var(--error-text); }
.banner .ic { margin-top: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: var(--r-sm); border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 15px; width: 100%; text-decoration: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary[aria-busy='true'] { cursor: progress; }
.btn-google { background: var(--surface); color: var(--text); border-color: var(--field-border); }
.btn-google:hover { background: var(--hover); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ''; flex: 1; border-top: 1px solid var(--rule); }
.switch { margin-top: 20px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }

/* Waking up: in the form, right above the button it delays (a floating pill would cover the logo row) */
.wake { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--panel); color: var(--text); font-size: 14px; }
.wake .ic { margin-top: 1px; color: var(--accent); }
.wake .amt { color: var(--muted); }
/* Out of the grid while empty, so it adds no gap; it stays in the page so it is announced when it fills */
.live:empty { position: absolute; }
.toast { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 14px; z-index: 6; }

/* ---------- Desktop: the ledger page beside the form ---------- */
@container app (min-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .ledger { display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--rule); padding: 32px 56px 40px; min-height: 100%; }
  .ledger .brand { height: 44px; }
  .ledger-body { margin: auto 0; padding: 40px 0; max-width: 620px; }
  .ledger h2 { font-family: var(--font-display); font-weight: 300; font-size: 38px; line-height: 1.15; letter-spacing: -.01em; }
  .ledger .lead { max-width: 460px; margin-top: 14px; font-size: 16px; }
  .form-side { justify-content: center; padding: 32px 48px; }
  .form-side > .brand { display: none; }
  .form-wrap h1 { font-size: 30px; }
}

/* The report excerpt: the spreadsheet heritage, set like a ledger */
.sheet-wrap { margin-top: 40px; overflow-x: auto; }
.sheet { width: 100%; border-collapse: collapse; font-size: 13px; }
.sheet caption { text-align: left; color: var(--muted); font-size: 13px; padding-bottom: 10px; caption-side: top; }
.sheet th, .sheet td { padding: 7px 0 7px 16px; text-align: right; white-space: nowrap; }
.sheet th:first-child, .sheet td:first-child { text-align: left; padding-left: 0; }
.sheet thead th { font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--text); }
.sheet .group td { padding-top: 14px; font-weight: 500; }
.sheet tbody td { border-bottom: 1px solid var(--rule); }
.sheet .sum td { border-bottom: 0; }
.sheet .sum:first-of-type td { border-top: 1px solid var(--text); }
.sheet .net td { border-top: 3px double var(--text); font-family: var(--font-display); font-weight: 300; font-size: 14px; padding-top: 10px; }
.sheet .net .amt { color: var(--income); }
.sheet .total { font-weight: 500; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame">
    <div class="app" id="app" data-scheme="light">
      <div class="layout" data-scroll>
        <aside class="ledger" aria-label="About Pup Budget">
          <div class="brand"><span class="logo" data-logo aria-hidden="true"></span><span class="brand-name">Pup Budget</span></div>
          <div class="ledger-body">
            <h2>Your year at a glance</h2>
            <p class="lead">Add an expense on your phone in a few seconds. The monthly and yearly report fills itself in, for you and for your family.</p>
            <div class="sheet-wrap" id="sheet"></div>
          </div>
        </aside>
        <main class="form-side">
          <div class="brand"><span class="logo" data-logo aria-hidden="true"></span><span class="brand-name">Pup Budget</span></div>
          <div class="form-wrap" id="form"></div>
        </main>
      </div>
    </div>
  </div>
</div>

<script>
const DIRECTION = {
  name: 'Variant 1 · Ledger page',
  thesis: 'Show what you get: on a desktop the sign-in sits beside a page of the yearly report, set like the family spreadsheet. On the phone it is just the form.',
  notes: [
    'Desktop (from 1080 px): left, the sidebar-tinted panel with a sample of the yearly report — fine rules, a double rule above NET, numbers in tabular figures. Right, the form on the page color.',
    'Phone and tablet: logo row, heading, form. Nothing between the person and the fields.',
    'Fields 48 px tall with labels above; the password has a show / hide button. Errors under the field, a wrong password as a banner above the form (it never says which of the two was wrong).',
    'Continue with Google is drawn here so the layout leaves room for it; it is built in F-012.',
    'No "Forgot password?" yet: password reset needs email (after the MVP).',
    'Simulate cold start: at night the sign-in is often the first request. A note right above the button says the server is waking up, with the seconds (the shell’s floating pill would cover the logo row here).',
  ],
};

const ICONS = {
  stack: ['M9 14c0 1.657 2.686 3 6 3s6 -1.343 6 -3s-2.686 -3 -6 -3s-6 1.343 -6 3z', 'M9 14v4c0 1.656 2.686 3 6 3s6 -1.344 6 -3v-4', 'M3 6c0 1.072 1.144 2.062 3 2.598s4.144 .536 6 0c1.856 -.536 3 -1.526 3 -2.598c0 -1.072 -1.144 -2.062 -3 -2.598s-4.144 -.536 -6 0c-1.856 .536 -3 1.526 -3 2.598z', 'M3 6v10c0 .888 .772 1.45 2 2', 'M3 11c0 .888 .772 1.45 2 2'],
  eye: ['M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0', 'M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6'],
  eyeOff: ['M10.585 10.587a2 2 0 0 0 2.829 2.828', 'M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87', 'M3 3l18 18'],
  alert: ['M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0', 'M12 8v4', 'M12 16h.01'],
  zzz: ['M4 12h6l-6 8h6', 'M14 4h6l-6 8h6'],
};
const icon = (n, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n].map((d) => `<path d="${d}"/>`).join('')}</svg>`;
const GOOGLE = `<svg class="ic" width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;

const PAGES = [
  { id: 'signin', label: 'Sign in' },
  { id: 'signup', label: 'Create account' },
  { id: 'signin-error', label: 'Sign in: wrong password' },
  { id: 'signup-error', label: 'Create account: errors' },
];

const app = document.getElementById('app');
const stage = document.getElementById('stage');
const mq = matchMedia('(prefers-color-scheme: dark)');
const state = { page: 'signin', schemePref: 'light', waking: false, elapsed: 0, busy: false };

function applyScheme() {
  const scheme = state.schemePref === 'system' ? (mq.matches ? 'dark' : 'light') : state.schemePref;
  app.dataset.scheme = scheme;
  document.querySelectorAll('[data-scheme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.schemeSet === state.schemePref)));
}
mq.addEventListener('change', applyScheme);

// ---------- Form markup (the same fields in every variant) ----------
function field({ id, label, type = 'text', autocomplete, inputmode, value = '', hint, error, extra = '' }) {
  const pw = type === 'password';
  const msg = error || hint;
  return `<div class="field"${error ? ' data-invalid' : ''}>
    <label for="${id}">${label}</label>
    <div class="control${pw ? ' has-toggle' : ''}">
      <input id="${id}" name="${id}" type="${type}" autocomplete="${autocomplete}"${inputmode ? ` inputmode="${inputmode}"` : ''} value="${value}"${msg ? ` aria-describedby="${id}-msg"` : ''}${error ? ' aria-invalid="true"' : ''} required>
      ${pw ? `<button type="button" class="toggle" data-action="toggle-pw" aria-label="Show password" aria-pressed="false" aria-controls="${id}">${icon('eye')}</button>` : ''}
    </div>
    ${msg ? `<p class="msg" id="${id}-msg">${error ? icon('alert', 16) : ''}${msg}</p>` : ''}${extra}
  </div>`;
}

function formHtml(page) {
  const signup = page.startsWith('signup');
  const err = page.endsWith('error');
  const busy = state.busy;
  const title = signup ? 'Create your account' : 'Welcome back';
  const lead = signup ? 'Track every hryvnia in one place. It takes a minute.' : 'Sign in to add today’s expenses.';
  const fields = signup
    ? field({ id: 'name', label: 'Your name', autocomplete: 'name', value: err ? 'Olena' : '', hint: 'Your family sees this name.' })
      + field({ id: 'email', label: 'Email', type: 'email', autocomplete: 'email', inputmode: 'email', value: err ? 'olena@example.com' : '', error: err ? 'This email already has an account.' : '', extra: err ? '<a href="#signin" class="text-link" data-nav="signin">Sign in instead</a>' : '' })
      + field({ id: 'password', label: 'Password', type: 'password', autocomplete: 'new-password', value: err ? 'abc' : '', hint: 'At least 8 characters.', error: err ? 'Use at least 8 characters.' : '' })
    : field({ id: 'email', label: 'Email', type: 'email', autocomplete: 'email', inputmode: 'email', value: err ? 'olena@example.com' : '' })
      + field({ id: 'password', label: 'Password', type: 'password', autocomplete: 'current-password' });
  const submit = signup ? 'Create account' : 'Sign in';
  const busyLabel = signup ? 'Creating your account…' : 'Signing in…';
  return `<h1>${title}</h1><p class="lead">${lead}</p>
    <form novalidate data-form="${signup ? 'signup' : 'signin'}">
      ${err && !signup ? `<div class="banner" role="alert">${icon('alert')}<span>That email and password don’t match. Check both and try again.</span></div>` : ''}
      ${fields}
      <div class="live" role="status" aria-live="polite">${state.waking ? `<p class="wake">${icon('zzz', 16)}<span>Waking up the server… <span class="amt" data-elapsed>${state.elapsed} s</span><br>It sleeps at night; this takes up to a minute.</span></p>` : ''}</div>
      <button class="btn btn-primary" type="submit" ${busy ? 'aria-busy="true" aria-disabled="true"' : ''}>${busy ? `<span class="spinner" aria-hidden="true"></span>${busyLabel}` : submit}</button>
      <div class="or">or</div>
      <button class="btn btn-google" type="button" data-action="google">${GOOGLE}Continue with Google</button>
    </form>
    <p class="switch">${signup ? 'Already have an account?' : 'New to Pup Budget?'} <a href="#${signup ? 'signin' : 'signup'}" class="text-link" data-nav="${signup ? 'signin' : 'signup'}">${signup ? 'Sign in' : 'Create an account'}</a></p>`;
}

// Sample report: three months of one group and the totals (sample numbers, UAH)
const fmt = (n, sign = '') => `${sign}${Math.abs(n).toLocaleString('uk-UA').replace(/ /g, ' ')} ₴`;
const ROWS = [['Groceries', 8412, 7960, 9105], ['Eating out', 2130, 1845, 2410], ['Transportation', 960, 1120, 1035]];
const INCOME = [62000, 62000, 64500];
const EXPENSES = [41870, 39905, 44210];
const sum = (a) => a.reduce((x, y) => x + y, 0);
document.getElementById('sheet').innerHTML = `<table class="sheet"><caption>Sample of the yearly report</caption>
  <thead><tr><th scope="col">Category</th><th scope="col">Aug</th><th scope="col">Sep</th><th scope="col">Oct</th><th scope="col">Total</th></tr></thead>
  <tbody><tr class="group"><td colspan="5">Daily living</td></tr>
  ${ROWS.map(([c, ...m]) => `<tr><td>${c}</td>${m.map((v) => `<td class="amt">${fmt(v)}</td>`).join('')}<td class="amt total">${fmt(sum(m))}</td></tr>`).join('')}
  <tr class="sum"><td>Total income</td>${INCOME.map((v) => `<td class="amt">${fmt(v)}</td>`).join('')}<td class="amt total">${fmt(sum(INCOME))}</td></tr>
  <tr class="sum"><td>Total expenses</td>${EXPENSES.map((v) => `<td class="amt">${fmt(v)}</td>`).join('')}<td class="amt total">${fmt(sum(EXPENSES))}</td></tr>
  <tr class="sum net"><td>NET</td>${INCOME.map((v, i) => `<td class="amt">${fmt(v - EXPENSES[i], '+')}</td>`).join('')}<td class="amt">${fmt(sum(INCOME) - sum(EXPENSES), '+')}</td></tr>
  </tbody></table>`;

function render() {
  app.dataset.page = state.page;
  document.getElementById('form').innerHTML = formHtml(state.page);
  document.querySelectorAll('[data-page-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pageSet === state.page)));
}
function go(id) { state.page = id; state.busy = false; render(); }

// Waking up (the app shows it after ~3 s without an answer; here at once)
let wakeTimer;
function coldStart() {
  clearInterval(wakeTimer);
  const start = Date.now();
  state.waking = true; state.elapsed = 0; render();
  wakeTimer = setInterval(() => {
    state.elapsed = Math.floor((Date.now() - start) / 1000);
    document.querySelectorAll('[data-elapsed]').forEach((el) => { el.textContent = `${state.elapsed} s`; });
    if (state.elapsed >= 9) endColdStart(true);
  }, 250);
}
function endColdStart(announce = false) {
  clearInterval(wakeTimer);
  state.waking = false; render();
  if (announce) toast('Connected');
}
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  app.appendChild(t); setTimeout(() => t.remove(), 2200);
}

document.querySelectorAll('[data-logo]').forEach((el) => { el.innerHTML = icon('stack'); });

// Preview bar (review aid)
document.body.insertAdjacentHTML('afterbegin', `<div class="pv-bar"><b>F-011 · ${DIRECTION.name}</b>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="tablet">Tablet</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Screen</span>${PAGES.map((p) => `<button data-page-set="${p.id}">${p.label}</button>`).join('')}</div>
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="cold">Simulate cold start</button><button data-action="notes" aria-expanded="false">About this direction</button>
  <div class="pv-notes" id="notes" hidden><b>${DIRECTION.name}</b><p style="margin:4px 0 0">${DIRECTION.thesis}</p><ul>${DIRECTION.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
setView(innerWidth >= 1200 ? 'desktop' : 'phone');

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const p = e.target.closest('[data-page-set]');
  if (p) { go(p.dataset.pageSet); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { state.schemePref = s.dataset.schemeSet; applyScheme(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  ({
    'toggle-pw': () => {
      const input = document.getElementById(a.getAttribute('aria-controls'));
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      a.setAttribute('aria-pressed', String(show));
      a.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      a.innerHTML = icon(show ? 'eyeOff' : 'eye');
    },
    google: () => toast('Google sign-in comes in F-012'),
    cold: coldStart,
    notes: () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; a.setAttribute('aria-expanded', String(!n.hidden)); },
  })[a.dataset.action]?.();
});
// Submitting shows the busy button, then goes on as the app would
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (state.busy) return;
  const kind = e.target.dataset.form;
  state.busy = true; render();
  setTimeout(() => { state.busy = false; render(); toast(kind === 'signup' ? 'Account created' : 'Signed in'); }, 1400);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('notes').hidden = true; });
applyScheme();
render();
</script>
</body>
</html>
