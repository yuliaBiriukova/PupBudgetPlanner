<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F-010 · Shell blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500&family=Manrope:wght@400;500&family=Rubik:wght@400;500&family=Spectral:wght@300;400&family=Unbounded:wght@300&display=swap">
<style>
/* ---------- Preview bar, block panel and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.proto-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.proto-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.proto-bar button, .proto-panel button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.proto-bar button:hover, .proto-panel button:hover { background: #363c47; }
.proto-bar button[aria-pressed='true'], .proto-panel button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.proto-bar button:focus-visible, .proto-panel button:focus-visible, .proto-panel textarea:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
.proto-wrap { flex: 1; min-height: 0; display: flex; position: relative; }
.proto-panel { flex: none; width: 330px; overflow-y: auto; background: #22262d; color: #e9ecef; font-size: 13px; line-height: 1.45; padding: 14px 16px 24px; }
.proto-panel h2 { font-size: 12px; font-weight: 600; color: #9aa1ab; margin: 18px 0 6px; }
.proto-panel h2:first-of-type { margin-top: 6px; }
.pp-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.pp-intro { color: #b9bfc8; margin: 0 0 10px; }
.pp-block { border: 0; margin: 0 0 12px; padding: 0; }
.pp-block legend { font-weight: 600; padding: 0; margin-bottom: 5px; }
.pp-opts { display: flex; flex-wrap: wrap; gap: 4px; }
.pp-opts button { padding: 3px 8px; font-size: 12px; }
.pp-desc { margin: 5px 0 0; color: #b9bfc8; font-size: 12px; }
.pp-sw { display: inline-flex; margin-right: 6px; vertical-align: -2px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.pp-sw i { width: 8px; height: 12px; }
.pp-mix textarea { width: 100%; height: 150px; margin: 6px 0; background: #1b1e24; color: #e9ecef; border: 1px solid #3d434d; border-radius: 6px; font: 12px/1.5 system-ui, sans-serif; padding: 8px; resize: vertical; }
.proto-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(480px, calc(100vw - 32px)); background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.proto-notes ul { margin: 6px 0 0; padding-left: 18px; }
.proto-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='tablet'] .frame { width: 834px; height: min(1050px, 100%); border: 12px solid #16181d; border-radius: 28px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
@media (max-width: 1100px) {
  .proto-panel { position: absolute; left: 0; top: 0; bottom: 0; z-index: 9; box-shadow: 8px 0 30px rgba(0,0,0,.3); }
  .proto-panel:not(.open) { display: none; }
}
@media (min-width: 1101px) { .pv-blocks { display: none; } }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
  .proto-panel { width: 100%; }
}

/* ---------- Shell structure ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
:where(.app) :where(button, input, select) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.amt { font-variant-numeric: tabular-nums; white-space: nowrap; }

.side { display: none; }
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 16px; background: var(--bg); }
.top > :first-child { margin-right: auto; }
.top[hidden] { display: none; }
.top-title { font-family: var(--font-head); font-weight: var(--head-w); font-size: 20px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-name { font-family: var(--font-head); font-size: var(--brand-size); font-weight: var(--brand-w); letter-spacing: var(--brand-track); }
.logo { width: 32px; height: 32px; display: grid; place-items: center; flex: none; background: var(--logo-bg); color: var(--logo-fg); border-radius: calc(var(--r-sm) + 4px); }
.scroll { flex: 1; overflow: hidden auto; }
.content { padding: 8px 16px 32px; max-width: 880px; margin: 0 auto; }
.app[data-page='reports'] .content { max-width: 1180px; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; flex: none; border: 0; background: none; border-radius: var(--r-sm); cursor: pointer; color: var(--text); text-decoration: none; }
.icon-btn:hover { background: var(--hover); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-size: 13px; font-weight: 500; background: var(--hover); color: var(--text); }

/* Whose money: Me / Vlad / Family */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-sm); background: var(--hover); }
.seg button { min-height: 44px; padding: 0 14px; border: 0; background: none; border-radius: max(2px, calc(var(--r-sm) - 2px)); cursor: pointer; color: var(--muted); }
.seg button[aria-pressed='true'] { background: var(--surface); color: var(--text); }
.scope-phone { display: none; flex: none; padding: 4px 16px 8px; }
.scope-phone .seg { display: flex; }
.scope-phone .seg button { flex: 1; }
@container app (max-width: 767px) { .app[data-b-scope='shell'] .scope-phone { display: block; } }

/* Phone tab bar: shared parts */
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--rule); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; min-height: 52px; border: 0; background: none; cursor: pointer; text-decoration: none; color: var(--muted); font-size: 11px; line-height: 1; }
.tab[aria-current], .app:is([data-page='family'], [data-page='settings']) .tab-more { color: var(--active-text); font-weight: 500; }
.tab-add { display: grid; place-items: center; }
.tab-add button, .tab-add-end, .pfab, .dfab { display: grid; place-items: center; border: 0; cursor: pointer; background: var(--primary); color: var(--on-primary); }
.tab-add button:hover, .tab-add-end:hover, .pfab:hover, .dfab:hover { background: var(--primary-hover); }
.tab-add button { width: 52px; height: 52px; border-radius: var(--r-lg); }
.pfab, .dfab, .tab-add-end { display: none; }

@container app (max-width: 767px) {
/* A — classic bar, the Add button raised out of it */
.app[data-b-tabbar='classic'] .tab-add button { margin-top: -22px; box-shadow: 0 0 0 5px var(--bg); }
/* B — floating bar */
.app[data-b-tabbar='floating'] .tabs { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; background: var(--raised); border: 1px solid var(--rule-soft); border-radius: calc(var(--r-lg) + 8px); padding: 6px 4px; box-shadow: var(--float-shadow); }
.app[data-b-tabbar='floating'] .tab-add button { width: 48px; height: 48px; }
.app[data-b-tabbar='floating'] .content { padding-bottom: 112px; }
/* C — four tabs and a separate Add button above the bar, under the right thumb */
.app[data-b-tabbar='fab'] .tabs { grid-template-columns: repeat(4, 1fr); }
.app[data-b-tabbar='fab'] .pfab { display: flex; position: absolute; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 5; height: 56px; gap: 8px; padding: 0 20px 0 16px; border-radius: var(--r-lg); box-shadow: var(--float-shadow); font-weight: 500; align-items: center; }
.app[data-b-tabbar='fab'] .content { padding-bottom: 104px; }
/* D — icon tabs, the open section spells its name, Add at the thumb end */
.app[data-b-tabbar='pill'] .tabs { display: flex; gap: 2px; padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); }
.app[data-b-tabbar='pill'] .tab { flex: none; flex-direction: row; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; font-size: 13px; }
.app[data-b-tabbar='pill'] .tab:not([aria-current]) .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.app[data-b-tabbar='pill'] .tab[aria-current] { flex: 0 1 auto; min-width: 0; width: auto; padding: 0 14px 0 12px; background: var(--active-bg); }
.app[data-b-tabbar='pill'] .tab[aria-current] .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app[data-b-tabbar='pill'] .tab-add-end { display: grid; flex: none; width: 52px; height: 52px; margin-left: auto; border-radius: var(--r-lg); }
}

/* ---------- Desktop: sidebar, expanded (resizable) or collapsed to an icon rail ---------- */
@container app (min-width: 768px) {
  .app { grid-template-columns: var(--side-w, 248px) minmax(0, 1fr); }
  /* Collapsing animates only the width: every icon keeps its place on one vertical axis (36 px from the edge,
     the middle of the 72 px rail), labels fade and get clipped, controls near the edge fade out */
  .app:not([data-resizing]) { transition: grid-template-columns .24s cubic-bezier(.2, 0, 0, 1); }
  .app .top, .app .tabs, .app .pfab, .app .scope-phone { display: none; }
  .side { display: flex; flex-direction: column; gap: 2px; position: relative; z-index: 4; min-width: 0; padding: 12px; background: var(--side); color: var(--text); }
  .side-head { position: relative; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 0 0 8px; margin-bottom: 12px; }
  .app:is([data-b-collapse='head'], [data-b-collapse='logo']) .side-head { padding-right: 54px; }
  .app[data-b-collapse='logo'] .side-head { padding-left: 2px; }
  .side-head .brand-name { margin-right: auto; white-space: nowrap; }
  .side-toggle { position: absolute; top: 0; right: 0; }
  .side :is(.lbl, .add-lbl, .brand-name) { min-width: 0; overflow: hidden; text-overflow: ellipsis; transition: opacity .16s ease .06s; }
  .app[data-collapsed] .side :is(.lbl, .add-lbl, .brand-name) { opacity: 0; transition-delay: 0s; }
  .side-fade { transition: opacity .16s ease .06s, visibility 0s; }
  .app[data-collapsed] .side-fade { opacity: 0; visibility: hidden; transition: opacity .12s ease, visibility 0s .12s; }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 0; border-radius: var(--r-sm); cursor: pointer; background: var(--primary); color: var(--on-primary); white-space: nowrap; font-weight: 500; transition: gap .24s; }
  .side-add:hover { background: var(--primary-hover); }
  .app[data-collapsed] .side-add { gap: 0; }
  .add-group { display: flex; gap: 4px; margin-bottom: 14px; }
  .add-group > .side-add { flex: 1; min-width: 0; }
  .add-group > .side-add:not(:only-child) { padding: 0 10px; }
  .add-alt { width: 36px; height: 40px; display: grid; place-items: center; flex: none; border: 1px solid var(--rule); border-radius: var(--r-sm); background: transparent; color: var(--text); cursor: pointer; }
  .add-alt:hover { background: var(--hover); }
  .side-link { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; text-decoration: none; color: var(--text); white-space: nowrap; width: 100%; text-align: left; line-height: 1; font-size: 14px; }
  .side-link:hover { background: var(--hover); }
  .side-scope { margin-bottom: 14px; }
  .side-scope .seg { display: flex; }
  .side-scope .seg button { flex: 1; min-height: 32px; padding: 0 6px; font-size: 13px; }
  .scope-rail { display: none; }
  .side-foot { margin-top: auto; display: grid; gap: 2px; padding-top: 10px; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 6px 8px; white-space: nowrap; min-width: 0; }
  .side-user small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .foot-compact { position: relative; display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 80px 0 8px; min-width: 0; }
  .foot-compact .user-name { font-size: 14px; white-space: nowrap; }
  .foot-tools { position: absolute; right: 0; top: 2px; display: flex; gap: 4px; }
  .icon-btn.sm { width: 36px; height: 36px; }
  .theme-seg { display: flex; gap: 2px; padding: 3px; margin: 0 4px 4px; border-radius: var(--r-sm); background: var(--hover); }
  .theme-seg button { flex: 1; height: 32px; display: grid; place-items: center; border: 0; background: none; border-radius: max(2px, calc(var(--r-sm) - 2px)); cursor: pointer; color: var(--muted); }
  .theme-seg button[aria-pressed='true'] { background: var(--surface); color: var(--text); }
  .theme-one { display: none; margin-left: 2px; }
  .side-resize { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 3; touch-action: none; }
  .side-resize::after { content: ''; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .15s; }
  .side-resize:hover::after, .side-resize:focus-visible::after, .app[data-resizing] .side-resize::after { background: var(--focus); }
  .app[data-resizing] { cursor: col-resize; user-select: none; }
  .content { padding: 28px 40px 48px; }

  /* Collapsed: an icon rail with tooltips (the options that can't shrink in place switch their layout) */
  .app[data-collapsed] .add-group { flex-direction: column; gap: 4px; }
  .app[data-collapsed] .add-group > .side-add { flex: none; padding: 0 14px; }
  .app[data-collapsed] .add-alt { width: 48px; }
  .app[data-collapsed] .side-scope .seg { display: none; }
  .app[data-collapsed] .scope-rail { display: grid; place-items: center; width: 44px; height: 44px; margin-left: 2px; border: 1px solid var(--rule); border-radius: 50%; background: none; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); }
  .app[data-collapsed] .theme-seg { display: none; }
  .app[data-collapsed] .theme-one { display: inline-grid; }
  .app[data-collapsed] .side [data-tip]:is(:hover, :focus-visible)::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); padding: 6px 10px; border-radius: var(--r-sm); background: var(--tip-bg); color: var(--tip-text); font-size: 13px; font-weight: 400; white-space: nowrap; pointer-events: none; z-index: 20; }
}

/* Block: sidebar surface */
@container app (min-width: 768px) {
  .app[data-b-sidebar='panel'] .side { border-right: 1px solid var(--rule); }
  .app[data-b-sidebar='floating'] .side { margin: 10px 0 10px 10px; background: var(--raised); border: 1px solid var(--rule-soft); border-radius: var(--r-lg); box-shadow: var(--float-shadow); }
  .app[data-b-sidebar='floating'] .side-resize { right: -9px; }
  .app[data-scheme='light'][data-b-sidebar='inverted'] .side { background: var(--inv-side); }
  .app[data-scheme='dark'][data-b-sidebar='inverted'] .side { background: var(--deep); }
  .app[data-b-sidebar='seamless'] .side { background: var(--bg); }
}

/* Block: how the open section is marked */
@container app (min-width: 768px) {
  .app[data-b-marker='fill'] .side-link[aria-current] { background: var(--active-bg); color: var(--active-text); font-weight: 500; }
  .app[data-b-marker='bar'] .side-link[aria-current] { font-weight: 500; }
  .app[data-b-marker='bar'] .side-link[aria-current]::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .app[data-b-marker='bar'][data-b-sidebar='floating'] .side-link[aria-current]::before { left: -13px; }
  .app[data-b-marker='bar'] .side-link[aria-current] .ic { color: var(--accent); }
  .app[data-b-marker='icon'] .side-link[aria-current] { font-weight: 500; }
  .app[data-b-marker='icon'] .side-link[aria-current] .ic { color: var(--accent); }
  .app[data-b-marker='icon'] .side-link[aria-current]::after { content: ''; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--accent); }
  .app[data-b-marker='icon'][data-collapsed] .side-link[aria-current]::after { right: 4px; top: 8px; margin: 0; }
  .app[data-b-marker='tab'] .side-link[aria-current] { background: var(--logo-bg); color: var(--logo-fg); font-weight: 500; }
}

/* Block: how the sidebar collapses (dragging the edge works in every option) */
.logo-btn, .edge-toggle { display: none; }
@container app (min-width: 768px) {
  .app[data-b-collapse='edge'] .edge-toggle { display: grid; place-items: center; position: absolute; top: 20px; right: -14px; z-index: 5; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); color: var(--text); cursor: pointer; box-shadow: var(--float-shadow); }
  .app[data-b-collapse='edge'] .edge-toggle:hover { background: var(--hover); }
  .app[data-b-collapse='edge'] .side-resize { top: 56px; height: calc(100% - 56px); }
  .app[data-b-collapse='edge'][data-b-sidebar='floating'] .edge-toggle { right: -19px; }
  .app[data-b-collapse='foot'] .foot-toggle { justify-self: start; margin-left: 2px; }
  .app[data-b-collapse='head'][data-collapsed] .side-head { flex-direction: column; height: auto; gap: 8px; padding: 0; }
  .app[data-b-collapse='head'][data-collapsed] .side-toggle { position: static; }
  .app[data-b-collapse='logo'] .logo-btn { display: grid; place-items: center; flex: none; width: 44px; height: 44px; padding: 0; border: 0; background: none; border-radius: var(--r-sm); color: var(--text); }
  .app[data-b-collapse='logo'][data-collapsed] .logo-btn { cursor: pointer; }
  .logo-btn .logo-hover { display: none; }
  .app[data-collapsed] .logo-btn:is(:hover, :focus-visible) .logo { display: none; }
  .app[data-collapsed] .logo-btn:is(:hover, :focus-visible) .logo-hover { display: block; }
  .app[data-collapsed] .logo-btn:hover { background: var(--hover); }
}

/* Block: Add on desktop — FAB variant */
@container app (min-width: 768px) {
  .app[data-b-dadd='fab'] .dfab { display: flex; align-items: center; gap: 8px; position: absolute; right: 28px; bottom: 28px; z-index: 5; height: 52px; padding: 0 22px 0 18px; border-radius: var(--r-lg); box-shadow: var(--float-shadow); font-weight: 500; }
  .app[data-b-dadd='fab'] .content { padding-bottom: 110px; }
}

/* Block: phone top bar */
@container app (max-width: 767px) {
  .app[data-b-ptop='title'] .page-head h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .app[data-b-ptop='title'] .page-head { margin-top: 0; }
  .app[data-b-ptop='title'] .page-head:has(> h1:only-child) { margin: 0; }
  .app[data-b-ptop='none'] .content { padding-top: 16px; }
}

/* Page building blocks (sample content, styled neutrally so the shell is what you judge) */
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; margin: 8px 0 18px; }
h1 { font-family: var(--font-head); font-weight: var(--head-w); font-size: var(--h1); line-height: 1.15; }
.month { display: inline-flex; align-items: center; gap: 2px; }
.month span { font-weight: 500; }
.summary { margin-bottom: 24px; }
.summary-label, .summary-split, .page-note { font-size: 13px; color: var(--muted); }
.summary-amount { font-family: var(--font-num); font-weight: var(--num-w); font-size: var(--sum); line-height: 1.1; margin: 4px 0 8px; display: inline-block; }
.app[data-b-type='ledger'] .summary-amount { padding-bottom: 6px; border-bottom: 3px double var(--text); margin-bottom: 10px; }
.summary-split { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.page-note { margin: -6px 0 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 0; }
.row-main, .row-side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-side { align-items: flex-end; text-align: right; flex: none; }
.row-sub { font-size: 13px; color: var(--muted); }
.day { margin-top: 20px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; font-weight: 500; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.day-date { font-weight: 400; }
.tx { border-bottom: 1px solid var(--rule-soft); }
.tx .amt, .account-bal { font-family: var(--font-num); font-weight: var(--num-w); font-size: var(--row-num); }
.neg { color: var(--neg); } .pos { color: var(--pos); } .neu { color: var(--text); }
.accounts, .members { border-top: 1px solid var(--rule); }
.account { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 60px; border-bottom: 1px solid var(--rule-soft); }
.table-wrap { overflow-x: auto; border-top: 1px solid var(--rule); }
table.report { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.report th, table.report td { padding: 9px 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--rule-soft); }
table.report th:first-child, table.report td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--bg); }
table.report thead th { font-weight: 500; color: var(--muted); font-size: 12px; }
table.report tr.group th { font-family: var(--font-head); font-weight: var(--head-w); font-size: 14px; text-align: left; padding-top: 16px; border-bottom-color: var(--rule); }
table.report td.total { font-weight: 500; }
.member { display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid var(--rule-soft); }
.member .row-main { flex: 1; }
.role { font-size: 13px; color: var(--muted); }
.form { display: grid; gap: 18px; max-width: 480px; }
.field label, .field .label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
.input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-sm); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid transparent; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1; font-weight: 500; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-quiet { background: transparent; border-color: var(--rule); color: var(--text); }
.btn-quiet:hover { background: var(--hover); }
@container app (min-width: 768px) {
  .seg button { min-height: 34px; }
  h1 { font-size: var(--h1-d); }
  .summary-amount { font-size: var(--sum-d); }
}

/* Block: waking up (shown in the app after ~3 s without an answer; here at once) */
.wake { display: none; }
.app[data-waking] .wake.on { display: flex; }
.wake .sec { font-variant-numeric: tabular-nums; }
.wake small, .wake-card small { font-size: 12px; color: var(--muted); }
.wake-banner { flex: none; align-items: center; gap: 12px; padding: 10px 16px; background: var(--side); border-bottom: 1px solid var(--rule); }
.wake-banner .txt { display: flex; flex-direction: column; gap: 1px; }
.wake-banner .sec { margin-left: auto; }
.wake-pill { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); z-index: 6; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: var(--tip-bg); color: var(--tip-text); white-space: nowrap; font-size: 14px; box-shadow: var(--float-shadow); }
.app[data-b-ptop='none'] .wake-pill { top: 12px; }
.wake-pill .sec { opacity: .8; }
.wake-splash { position: absolute; inset: 0; z-index: 40; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: var(--bg); }
.wake-splash .logo { width: 56px; height: 56px; border-radius: calc(var(--r-lg) + 2px); animation: breathe 2.4s ease-in-out infinite; }
.wake-splash p { max-width: 280px; }
.wake-splash .sec { color: var(--muted); font-size: 13px; }
@keyframes breathe { 50% { transform: scale(.92); opacity: .75; } }
.wake-card { display: flex; flex-direction: column; gap: 14px; margin: min(16vh, 120px) auto 0; max-width: 420px; padding: 20px; border: 1px solid var(--rule); border-radius: var(--r-lg); background: var(--surface); }
.wake-card .wake-line { display: flex; align-items: center; gap: 12px; }
.wake-card .txt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.wake-card .sec { align-self: flex-start; color: var(--muted); font-size: 13px; }
.progress { width: 100%; height: 3px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.progress::after { content: ''; display: block; width: 35%; height: 100%; border-radius: 3px; background: var(--accent); animation: slide 1.6s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
@container app (min-width: 768px) { .wake-pill { top: 20px; } }
.sk { background: var(--skeleton); border-radius: 4px; position: relative; overflow: hidden; }
.sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--shimmer), transparent); animation: sk 1.4s infinite; }
@keyframes sk { to { transform: translateX(100%); } }

/* Sheets */
.overlay { position: absolute; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: var(--overlay); }
.overlay[hidden] { display: none; }
.sheet { width: 100%; background: var(--surface); color: var(--text); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 10px 16px 20px; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .5; } }
.sheet .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--rule); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sheet-head h2 { font-family: var(--font-head); font-weight: var(--head-w); font-size: 20px; }
.menu-item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 12px; border: 0; background: none; border-radius: var(--r-sm); cursor: pointer; text-decoration: none; color: var(--text); text-align: left; line-height: 1; }
.menu-item:hover { background: var(--hover); }
.menu-item[aria-current] { background: var(--active-bg); color: var(--active-text); }
.more-user { display: flex; align-items: center; gap: 12px; padding: 4px 4px 14px; }
.more-user small { display: block; color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 14px; min-height: 92px; padding: 14px; border: 1px solid var(--rule); border-radius: var(--r-lg); background: none; cursor: pointer; text-decoration: none; color: var(--text); text-align: left; line-height: 1.2; }
.tile:hover { background: var(--hover); }
.tile[aria-current] { background: var(--active-bg); color: var(--active-text); border-color: transparent; }
.amount-input { width: 100%; min-height: 64px; margin: 14px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: center; font-variant-numeric: tabular-nums; font-family: var(--font-num); font-weight: var(--num-w); font-size: 38px; }
.sheet .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
.sheet .seg { display: flex; }
.sheet .seg button { flex: 1; }
@container app (min-width: 768px) {
  .overlay { align-items: center; }
  .sheet { width: 440px; border-radius: var(--r-lg); padding: 20px 24px 24px; }
  .sheet .grab { display: none; }
}
.toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: var(--r-sm); background: var(--tip-bg); color: var(--tip-text); white-space: nowrap; }
@container app (min-width: 768px) { .toast { bottom: 24px; } }
@media (prefers-reduced-motion: reduce) { .app, .app *, .app *::after { animation: none !important; transition: none !important; } }

<div class="proto-wrap">

<div class="stage"><div class="frame">

<script>
// ---------- The blocks and their options (the first option of each block is the default) ----------
const BLOCKS = {
  palette: { group: 'Look', label: 'Colors', options: {
    ink: ['Ink and copper', 'Paper white, ink-blue buttons; the logo color is the next block (copper by default). Calm and bookish; dark mode is warm charcoal.'],
    sepia: ['Sepia and olive', 'Hryvnia-note colors: sepia buttons, an olive logo, a greenish paper. Warm, a little old-fashioned.'],
    sun: ['Sunflower and azure', 'A yellow Add button and a blue logo on cool greys. The brightest, most "app-like"; best in dark mode.'],
    graphite: ['Graphite and tangerine', 'New: near-black buttons, a tangerine logo and tangerine marks for the open section. Modern and quiet, one warm spark.'],
  } },
  type: { group: 'Look', label: 'Type', options: {
    ledger: ['Spectral + IBM Plex Sans', 'Light serif for headings and amounts, a plain sans for the rest. Reads like a typeset ledger.'],
    banknote: ['Unbounded + Manrope', 'Wide, light display type for headings and amounts, as on banknotes. The most characterful.'],
    rubik: ['Rubik', 'One rounded sans everywhere. Friendly and compact, like a banking app.'],
    fira: ['Fira Sans', 'New: one humanist sans with light 300 headings and big light amounts. Clean, Ukrainian-friendly, a little technical.'],
  } },
  corners: { group: 'Look', label: 'Corners', options: {
    sharp: ['Sharp', 'Radius 4 / 10 px. Precise, paper-like.'],
    soft: ['Soft', 'Radius 8 / 16 px. In between.'],
    round: ['Round', 'Radius 12 / 24 px. Pebble-like buttons, the Add button almost a circle.'],
  } },
  logo: { group: 'Look', label: 'Logo', options: {
    coin: ['P-coin', 'A coin whose edge becomes the letter P.'],
    hryvnia: ['Hryvnia sign', 'The ₴ sign on the tile: says "money, in hryvnias" at once.'],
    stack: ['Coin stack', 'Two stacks of coins: savings, growing.'],
    ledger: ['Ledger grid', 'A spreadsheet grid with a double rule under the total, a nod to the family sheet.'],
  } },
  logocolor: { group: 'Look', label: 'Logo color', options: {
    copper: ['Copper', 'With ink and gold colors: a light copper, the classic partner of ink blue (blue and orange are opposites). Warm, with the mark in ink.'],
    sky: ['Pale blue', 'With ink and gold colors: a light tint of the ink itself. Calm and all-blue; the logo stands out less.'],
    sage: ['Sage', 'With ink and gold colors: a soft grey-green. Quiet and natural, though close to the income green.'],
    gold: ['Gold (before)', 'The round-2 gold, to compare.'],
  } },
  sidebar: { group: 'Desktop sidebar', label: 'Surface', options: {
    panel: ['Tinted panel', 'A slightly tinted column with a hairline border. Classic, clear.'],
    floating: ['Floating card', 'The sidebar floats as a card with a margin and a soft shadow.'],
    inverted: ['Dark column', 'A dark sidebar even in light mode (ink-blue, dark sepia, graphite…). The strongest frame.'],
    seamless: ['Seamless', 'No panel at all: the sidebar is the page background; the line shows only when you resize.'],

// Sidebar: an icon button toggles it; dragging the edge resizes it and snaps to the icon rail when narrow.
// It never gets narrower than its head row (logo, the whole app name, collapse button), measured in the current type.
const NAV_KEY = 'pup.f010.blocks.nav';
const SIDE_MIN = 208, SIDE_MAX = 320, SIDE_RAIL = 72, SNAP = 150;
let sideMin = SIDE_MIN;
function measureSideMin() {
  const side = document.getElementById('side');
  const head = side.querySelector('.side-head');
  if (!head || getComputedStyle(side).display === 'none') return;
  const px = (v) => parseFloat(v) || 0;
  const hs = getComputedStyle(head), ss = getComputedStyle(side);
  const kids = [...head.children].filter((el) => getComputedStyle(el).display !== 'none' && getComputedStyle(el).position !== 'absolute');
  const content = kids.reduce((sum, el) => sum + (el.classList.contains('brand-name') ? el.scrollWidth : el.offsetWidth), 0);
  const need = content + px(hs.columnGap) * (kids.length - 1) + px(hs.paddingLeft) + px(hs.paddingRight)
    + px(ss.paddingLeft) + px(ss.paddingRight) + px(ss.borderLeftWidth) + px(ss.borderRightWidth) + px(ss.marginLeft) + 4;
  sideMin = Math.min(SIDE_MAX, Math.max(SIDE_MIN, Math.ceil(need)));
}
let navPref = null;
try { navPref = JSON.parse(localStorage.getItem(NAV_KEY)); } catch { /* storage blocked */ }
function saveNav() { try { localStorage.setItem(NAV_KEY, JSON.stringify(navPref)); } catch { /* storage blocked */ } }
function applyNav() {
  const collapsed = navPref?.collapsed ?? app.clientWidth < 1024;
  app.toggleAttribute('data-collapsed', collapsed);
  if (!collapsed) measureSideMin();
  const width = Math.max(sideMin, navPref?.width ?? 248);
  app.style.setProperty('--side-w', `${collapsed ? SIDE_RAIL : width}px`);
  const label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
  document.querySelectorAll('[data-collapse-btn]').forEach((btn) => {
    btn.setAttribute('aria-expanded', String(!collapsed));
    btn.setAttribute('aria-label', label);
    btn.dataset.tip = label;
    btn.innerHTML = 'edge' in btn.dataset ? icon(collapsed ? 'right' : 'left', 16) : icon(collapsed ? 'expand' : 'collapse');
  });
  document.querySelectorAll('.logo-btn').forEach((b) => { b.inert = !collapsed; });
  const handle = document.getElementById('side-resize');
  handle.setAttribute('aria-valuemin', String(sideMin));
  handle.setAttribute('aria-valuenow', String(collapsed ? SIDE_RAIL : width));
  handle.setAttribute('aria-valuetext', collapsed ? 'Collapsed' : `${width} pixels`);
}
function setNavCollapsed(value) {
  navPref = value === null ? null : { width: navPref?.width ?? 248, collapsed: value };
  if (value === null) { try { localStorage.removeItem(NAV_KEY); } catch { /* storage blocked */ } } else saveNav();
  applyNav();
}
function resizeTo(w) {
  navPref = w < SNAP ? { width: navPref?.width ?? 248, collapsed: true } : { width: Math.round(Math.min(SIDE_MAX, Math.max(sideMin, w))), collapsed: false };
  applyNav();
}
function bindResize() {
  const handle = document.getElementById('side-resize');
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    app.dataset.resizing = '';
    const left = document.getElementById('side').getBoundingClientRect().left;
    const move = (ev) => resizeTo(ev.clientX - left);
    const up = () => { delete app.dataset.resizing; saveNav(); handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  });
  handle.addEventListener('dblclick', () => setNavCollapsed(!app.hasAttribute('data-collapsed')));
  handle.addEventListener('keydown', (e) => {
    const collapsed = app.hasAttribute('data-collapsed');
    const w = navPref?.width ?? 248;
    if (e.key === 'ArrowLeft') { e.preventDefault(); collapsed || w - 16 < sideMin ? setNavCollapsed(true) : resizeTo(w - 16); saveNav(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); collapsed ? setNavCollapsed(false) : resizeTo(w + 16); saveNav(); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setNavCollapsed(!collapsed); }
  });
}
new ResizeObserver(applyNav).observe(app);
document.fonts?.ready.then(applyNav);
document.fonts?.addEventListener('loadingdone', applyNav);

// Waking up
let wakeTimer;
function coldStart() {
  clearInterval(wakeTimer);
  closeSheets();
  state.waking = true; app.dataset.waking = '';
  const start = Date.now();
  render();
  wakeTimer = setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    document.querySelectorAll('[data-elapsed]').forEach((el) => { el.textContent = `${s} s`; });
    if (s >= 9) endColdStart(true);
  }, 250);
}
function endColdStart(announce = false) {
  clearInterval(wakeTimer);
  state.waking = false; delete app.dataset.waking;
  render();
  if (announce) {
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = 'Connected';
    app.appendChild(t); setTimeout(() => t.remove(), 2200);
  }
}

function applyBlocks() { renderShell(); render(); applyNav(); updatePanel(); }
function setBlock(id, option) { picks[id] = option; savePicks(); applyBlocks(); }
function resetBlocks() { picks = { ...DEFAULTS }; savePicks(); applyBlocks(); }
function setLogo(name) { setBlock('logo', name); }
function randomBlocks() {
  for (const [id, b] of Object.entries(BLOCKS)) { const k = Object.keys(b.options); picks[id] = k[Math.floor(Math.random() * k.length)]; }
  savePicks(); applyBlocks();
}
const mixText = () => Object.entries(BLOCKS).map(([id, b]) => `${b.group}, ${b.label.toLowerCase()}: ${b.options[picks[id]][0]}`).join('\n');

const panel = document.getElementById('proto-panel');
function buildPanel() {
  let html = `<div class="pp-tools"><button data-pp="random">Mix at random</button><button data-pp="reset">Reset</button><button data-pp="close" class="pv-blocks">Close</button></div>
    <p class="pp-intro" style="margin-top:10px">It opens with your chosen mix (Reset brings it back). Pick an option for each block; the preview changes at once and your mix is remembered. Dragging the sidebar edge works with every option.</p>`;
  let group = '';
  for (const [id, b] of Object.entries(BLOCKS)) {
    if (b.group !== group) { group = b.group; html += `<h2>${group}</h2>`; }
    html += `<fieldset class="pp-block"><legend>${b.label}</legend><div class="pp-opts">${Object.entries(b.options).map(([k, [name]], i) => `<button data-pick="${id}:${k}" title="${name}">${id === 'palette' ? `<span class="pp-sw" aria-hidden="true">${SWATCHES[k].map((c) => `<i style="background:${c}"></i>`).join('')}</span>` : ''}${String.fromCharCode(65 + i)}. ${name}</button>`).join('')}</div><p class="pp-desc" data-desc="${id}"></p></fieldset>`;
  }
  html += `<div class="pp-mix"><h2>Your mix</h2><textarea id="mix" readonly aria-label="Your mix"></textarea><button data-pp="copy">Copy</button></div>`;
  panel.innerHTML = html;
}
function updatePanel() {
  panel.querySelectorAll('[data-pick]').forEach((b) => { const [id, k] = b.dataset.pick.split(':'); b.setAttribute('aria-pressed', String(picks[id] === k)); });
  panel.querySelectorAll('[data-desc]').forEach((p) => { p.textContent = BLOCKS[p.dataset.desc].options[picks[p.dataset.desc]][1]; });
  document.getElementById('mix').value = mixText();
}

// Preview bar (review aid)
document.body.insertAdjacentHTML('afterbegin', `<div class="proto-bar"><b>F-010 · App shell, block by block</b>
  <button class="pv-blocks" data-pp="toggle" aria-expanded="false">Blocks</button>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="tablet">Tablet</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="cold">Simulate cold start</button><button data-pp="notes" aria-expanded="false">About</button>
  <div class="proto-notes" id="notes" hidden><b>Mix and match</b><p style="margin:4px 0 0">Round 3: instead of three fixed directions, every block of the shell has its own options. The colors, type and logos of round 2 are here as options, plus new ones.</p><ul>
    <li><b>Sidebar (≥ 768 px):</b> collapse it with the button (where it sits is a block), or drag its right edge: 208–320 px, snaps to the icon rail when dragged narrow; double-click, or ← → / Enter on the focused edge. Collapsed by default below 1024 px; remembered.</li>
    <li><b>Phone:</b> Add is always one tap away; More holds Family, Settings and the theme.</li>
    <li>Page content is neutral sample data so you judge the frame; each page gets its own design in its feature.</li></ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
setView(innerWidth >= 1300 ? 'desktop' : 'phone');

document.addEventListener('click', (e) => {
  const pick = e.target.closest('[data-pick]');
  if (pick) { const [id, k] = pick.dataset.pick.split(':'); setBlock(id, k); return; }
  const pp = e.target.closest('[data-pp]');
  if (pp) {
    ({
      random: randomBlocks,
      reset: resetBlocks,
      toggle: () => { panel.classList.toggle('open'); pp.setAttribute('aria-expanded', String(panel.classList.contains('open'))); },
      close: () => panel.classList.remove('open'),
      notes: () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; pp.setAttribute('aria-expanded', String(!n.hidden)); },
      copy: async () => {
        const ta = document.getElementById('mix');
        try { await navigator.clipboard.writeText(ta.value); pp.textContent = 'Copied'; } catch { ta.select(); pp.textContent = 'Press Ctrl+C'; }
        setTimeout(() => { pp.textContent = 'Copy'; }, 1600);
      },
    })[pp.dataset.pp]?.();
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { state.schemePref = s.dataset.schemeSet; applyScheme(); return; }
  const sc = e.target.closest('[data-scope]');
  if (sc) { state.scope = sc.dataset.scope; render(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  if (e.target.classList.contains('overlay')) { closeSheets(); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  ({
    add: () => openSheet('add'),
    more: () => openSheet('more'),
    close: closeSheets,
    theme: () => { state.schemePref = app.dataset.scheme === 'dark' ? 'light' : 'dark'; applyScheme(); },
    collapse: () => {
      setNavCollapsed(!app.hasAttribute('data-collapsed'));
      if (picks.collapse === 'logo') document.querySelector(app.hasAttribute('data-collapsed') ? '.logo-btn' : '.side-toggle')?.focus();
    },
    'scope-next': () => { const i = SCOPES.findIndex(([id]) => id === state.scope); state.scope = SCOPES[(i + 1) % SCOPES.length][0]; render(); },
    cold: coldStart,
  })[a.dataset.action]?.();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheets(); document.getElementById('notes').hidden = true; } });

buildPanel();
applyBlocks();
</script>
</body>
</html>
