<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.pv-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.pv-bar button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pv-bar button:hover { background: #363c47; }
.pv-bar button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(520px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.pv-notes ul { margin: 6px 0 0; padding-left: 18px; }
.pv-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='tablet'] .frame { width: 834px; height: min(1050px, 100%); border: 12px solid #16181d; border-radius: 28px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
}

/* ---------- Tokens: the app's theme (F-010 … F-016) plus expense / income / transfer ---------- */
.app {
  --bg: #f5f6f7; --surface: #fcfcfd; --sidebar: #ebedf0; --seg-bg: #ebedf0; --text: #1c1e21; --muted: #57585b;
  --rule: #d7d8d9; --hover: #e8e9ea; --field-border: #7c828a; --key: #ebedf0; --key-hover: #e0e2e5;
  --primary: #26292e; --primary-hover: #363a40; --on-primary: #f5f6f7;
  --accent: #2a62a3; --active-bg: #e7ecf1; --tint: #e7ecf1; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --error: #b3261e; --error-bg: #fbeceb; --error-text: #8c1d18;
  --expense: #b3261e; --expense-bg: #fbeceb; --income: #1f7a4d; --income-bg: #e6f2ec; --transfer: #2a62a3; --transfer-bg: #e7ecf1;
  --fresh: #fdf3d6;
  --pill: #1c1e21; --on-pill: #f5f6f7; --focus: #26292e; --scrim: rgba(18, 19, 21, .45);
  --shadow-float: 0 8px 24px rgba(15, 17, 20, .1);
  --font-display: 'Unbounded', system-ui, sans-serif; --font-text: 'Manrope', system-ui, sans-serif;
  --r-sm: 12px; --r-lg: 24px;
}
.app[data-scheme='dark'] {
  --bg: #121315; --surface: #1b1c1e; --sidebar: #18191b; --seg-bg: #1f2022; --text: #e9eaec; --muted: #a4a5a7;
  --rule: #37383a; --hover: #26272a; --field-border: #71747b; --key: #26272a; --key-hover: #303134;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --active-bg: #262f37; --tint: #262f37; --logo: #8ec1ec; --logo-mark: #121315;
  --error: #f2958c; --error-bg: #3a1d1b; --error-text: #f6b8b2;
  --expense: #f2958c; --expense-bg: #3a1d1b; --income: #7fd1a4; --income-bg: #1b3327; --transfer: #8ec1ec; --transfer-bg: #262f37;
  --fresh: #3a3420;
  --pill: #e9eaec; --on-pill: #121315; --focus: #e9eaec; --scrim: rgba(0, 0, 0, .6);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p, ul, ol, dl, dd) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.list { list-style: none; padding: 0; margin: 0; }
.neg { color: var(--expense); }
.pos { color: var(--income); }
.move { color: var(--transfer); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 15px; text-decoration: none; white-space: nowrap; background: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-default { border-color: var(--rule); color: var(--text); }
.btn-default:hover { background: var(--hover); }
.btn-danger { background: var(--error); color: var(--on-primary); }
.btn-danger-quiet { color: var(--error); padding: 0 12px; }
.btn-danger-quiet:hover { background: var(--error-bg); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.text-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--accent); font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 14px; z-index: 40; white-space: nowrap; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--tint); color: var(--text); }
.banner .ic { margin-top: 2px; color: var(--accent); }
.banner-error { background: var(--error-bg); color: var(--error-text); }
.banner-error .ic { color: var(--error-text); }

/* Fields (F-011: 48 px, a 2 px accent border in focus, the error under the field) */
.field { display: grid; gap: 6px; }
.field label, .field .label { font-weight: 500; font-size: 14px; }
.input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-size: 16px; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.input[aria-invalid='true'] { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
.field-error { display: flex; align-items: center; gap: 6px; color: var(--error); font-size: 14px; font-weight: 500; }
.field-hint { color: var(--muted); font-size: 14px; }

/* Segmented choice (F-016): a pill track, the picked one a raised pill */
.seg { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 999px; background: var(--seg-bg); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked='true'] { background: var(--surface); box-shadow: 0 1px 2px rgba(15, 17, 20, .12); }
.app[data-scheme='dark'] .seg button[aria-checked='true'] { background: var(--active-bg); box-shadow: none; }
.seg button[aria-checked='true'][data-type='expense'] { color: var(--expense); }
.seg button[aria-checked='true'][data-type='income'] { color: var(--income); }
.seg button[aria-checked='true'][data-type='transfer'] { color: var(--transfer); }

/* ---------- App shell (F-010): top bar and tab bar on the phone, sidebar from 768 px ---------- */
.logo { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
.column { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { display: flex; flex: none; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand .logo { width: 32px; height: 32px; }
.brand-name { font-family: var(--font-display); font-size: 15px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
.main { flex: 1; min-height: 0; overflow: hidden auto; position: relative; }
.content { max-width: 880px; margin: 0 auto; padding: 8px 16px 32px; }
.tabs { display: flex; flex: none; align-items: center; gap: 2px; padding: 8px 8px 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.tab { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; color: var(--muted); font-size: 13px; text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab[data-active] { width: auto; padding: 0 14px 0 12px; background: var(--active-bg); color: var(--accent); font-weight: 500; }
.tab:not([data-active]) .tab-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tab-add { display: grid; place-items: center; width: 52px; height: 52px; margin-left: auto; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
.avatar-link { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; text-decoration: none; }
.avatar[data-initials]::before { content: attr(data-initials); }
@container app (min-width: 768px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-right: 1px solid var(--rule); background: var(--sidebar); min-width: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; height: 44px; margin-bottom: 12px; padding: 0 2px; }
  .side-head .logo { width: 32px; height: 32px; margin: 0 6px; }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin-bottom: 14px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 999px; color: var(--text); font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { background: var(--hover); }
  .nav-link[aria-current='page'] { font-weight: 500; }
  .nav-link[aria-current='page'] > svg { color: var(--accent); }
  .nav-link[aria-current='page']::before { content: ''; position: absolute; top: 8px; bottom: 8px; left: -12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-sep { height: 1px; margin: 10px 14px; background: var(--rule); }
  .side-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; margin-top: auto; padding: 0 0 0 8px; font-size: 14px; }
  .side-foot .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-foot .icon-btn { width: 36px; height: 36px; }
  .top, .tabs { display: none; }
  .content { padding: 32px 40px 48px; }
  .toast { bottom: 24px; }
}

/* ---------- Pop-ups (I-012): a sheet on the phone, a dialog from 768 px ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: var(--scrim); }
.scrim.over { z-index: 26; }
.dialog { position: relative; display: flex; flex-direction: column; width: 100%; max-height: 92%; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-float); overflow: hidden; }
.handle { flex: none; width: 36px; height: 4px; margin: 8px auto 0; border-radius: 999px; background: var(--rule); }
.dlg-head { position: relative; padding: 8px 64px 0 16px; min-height: 44px; }
.dlg-x { position: absolute; top: 4px; right: 8px; }
.dlg-head h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 28px; padding-top: 8px; }
.dlg-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 0; scrollbar-width: none; }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 16px; }
.dlg-foot .btn { flex: 1; }
.dlg-foot .spacer { display: none; }
.more-link { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 12px; border-radius: 12px; color: var(--text); text-decoration: none; background: none; border: 0; width: 100%; cursor: pointer; }
.more-link:hover { background: var(--hover); }
.more-link[aria-current='page'] { background: var(--active-bg); color: var(--accent); font-weight: 500; }
@container app (min-width: 768px) {
  .scrim { align-items: center; justify-content: center; }
  .dialog { width: 480px; max-height: 86%; border-radius: var(--r-lg); }
  .handle { display: none; }
  .dlg-head { padding: 12px 64px 0 20px; }
  .dlg-x { top: 12px; right: 12px; }
  .dlg-body { padding: 20px 20px 0; }
  .dlg-foot { padding: 20px; }
  .dlg-foot .btn { flex: none; }
  .dlg-foot .spacer { display: block; flex: 1; }
}
.confirm .dialog { max-width: 100%; }
@container app (min-width: 768px) { .confirm .dialog { width: 400px; } }
.confirm-what { display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--seg-bg); }
.confirm-what .amt { font-family: var(--font-display); font-weight: 300; font-size: 22px; }

/* ---------- Pickers: account, category, date. A dropdown under its field on the desktop, a sheet on the phone ---------- */
.picker { position: absolute; z-index: 25; display: flex; flex-direction: column; max-height: 360px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--shadow-float); }
.picker > .cal { min-height: 0; overflow: auto; }
.pick-sheet .dialog { max-height: 86%; }
.pick-sheet.tall .dialog { height: 86%; }
.pick-sheet .dlg-body { display: flex; flex-direction: column; padding: 8px 16px 16px; }
.pick-search { position: relative; margin: 8px; flex: none; }
.pick-sheet .pick-search { margin: 8px 0 4px; }
.pick-search > .ic { position: absolute; left: 14px; top: 14px; color: var(--muted); pointer-events: none; }
.pick-search .input { padding: 0 16px 0 44px; }
.pick-search input::-webkit-search-cancel-button { display: none; }
.pick-scroll { padding: 0 6px 6px; }
.pick-sheet .pick-scroll { padding: 0; }
.sa { position: relative; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.sa-vp { flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain; scrollbar-width: none; }
.sa-vp::-webkit-scrollbar { display: none; }
.sa-track { position: absolute; display: none; pointer-events: none; }
.sa[data-overflow] > .sa-track { display: block; pointer-events: auto; top: 8px; bottom: 8px; right: 2px; width: 12px; opacity: 0; transition: opacity .3s ease .1s; }
.sa[data-scrolling] > .sa-track, .sa:hover > .sa-track { opacity: 1; transition-delay: 0s; transition-duration: .12s; }
.sa-thumb { position: absolute; top: 0; left: 50%; width: 6px; margin-left: -3px; border-radius: 999px; background: var(--field-border); }
.sa > .sa-vp { --ft: 0px; --fb: 0px; mask-image: linear-gradient(to bottom, transparent, #000 var(--ft), #000 calc(100% - var(--fb)), transparent); }
.sa[data-top] > .sa-vp { --ft: 32px; }
.sa[data-bottom] > .sa-vp { --fb: 40px; }
.pick-h { padding: 10px 10px 4px; color: var(--muted); font-size: 13px; font-weight: 500; }
.pick-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); text-align: left; cursor: pointer; }
.pick-item:hover { background: var(--hover); }
.pick-item[aria-pressed='true'] { background: var(--active-bg); color: var(--accent); }
.pick-item[aria-pressed='true'] .ok { color: var(--accent); }
.pick-item:disabled { cursor: default; color: var(--muted); background: none; }
.pick-item .grow { flex: 1; min-width: 0; display: grid; }
.pick-item .grow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-item small { color: var(--muted); font-size: 13px; }
.pick-item .num { color: var(--muted); }
.pick-item[aria-pressed='true'] .num { color: inherit; }
.pick-none { padding: 12px 10px; color: var(--muted); }
/* Date: Today and Yesterday, then the month, Monday first */
.cal { padding: 8px 8px 12px; }
.cal-quick { display: flex; gap: 8px; padding: 0 0 8px; }
.toast.two { display: grid; justify-items: center; gap: 2px; max-width: calc(100% - 32px); white-space: normal; border-radius: 20px; text-align: center; }
.toast.two .ln { display: block; }
.toast.two .ln:first-child { display: flex; align-items: center; justify-content: center; gap: 8px; }
.confirm-what .move { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }

/* ---------- The Transactions page: shared by the variants ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 0 16px; }
.page-head h1 { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; margin-right: auto; }
.text-link.inherit { color: inherit; }
.btn-tall { min-height: 48px; margin-top: 18px; }
.list-wrap { max-width: 720px; }
/* F-018's row */
.tx-row { display: flex; align-items: center; gap: 16px; min-height: 60px; padding: 8px 12px; margin: 0 -12px; width: calc(100% + 24px); border: 0; border-radius: var(--r-sm); background: none; color: var(--text); text-align: left; cursor: pointer; }
.tx-row:hover { background: var(--hover); }
.tx-row:focus-visible { outline-offset: -2px; }
.tx-row[data-fresh] { animation: fresh 2400ms ease-out; }
@keyframes fresh { 0%, 40% { background: var(--fresh); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .tx-row[data-fresh] { animation: none; background: var(--fresh); } }
.tx-main { flex: 1; min-width: 0; display: grid; }
.tx-cat { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-sub { display: flex; align-items: center; gap: 4px; min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; white-space: nowrap; }
.tx-sub span { overflow: hidden; text-overflow: ellipsis; }
.tx-sub span:first-child { flex: none; max-width: 60%; }
.tx-amt { font-weight: 500; text-align: right; }
.tx-amt .ic, .confirm-what .ic { display: inline-block; vertical-align: -3px; margin: 0 2px; }
/* A day: its name on the left, what it cost on the right */
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 20px 0 4px; color: var(--muted); font-size: 14px; font-weight: 500; }
.day-head h2, .day-head h3 { font: inherit; }
.d-tot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 12px; font-variant-numeric: tabular-nums; }
/* Skeletons (F-018's loading) */
.sk { border-radius: var(--r-sm); background: var(--hover); }
.sk-day { width: 140px; height: 16px; margin: 20px 0 12px; border-radius: 6px; }
.sk-row { height: 52px; margin-bottom: 8px; }
.loading-more { padding-top: 8px; }
.loading-more .sk-row { opacity: .7; }
.loading-more .sk-row:nth-child(2) { opacity: .45; }
.loading-more .sk-row:nth-child(3) { opacity: .2; }
.sentinel { height: 1px; }
.list-end { padding: 24px 0 8px; color: var(--muted); font-size: 14px; text-align: center; }
/* Empty and nothing found */
.empty { max-width: 460px; padding: 32px 0 8px; }
.empty-title { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 1.3; margin-bottom: 8px; }
/* Select buttons: a filter's current value with its arrow */
.sel { display: inline-flex; align-items: center; gap: 8px; min-width: 0; min-height: 44px; padding: 0 12px 0 16px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--text); font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap; }
.sel:hover { background: var(--hover); }
.sel > span { overflow: hidden; text-overflow: ellipsis; }
.sel > .ic { color: var(--muted); }
.sel[data-on] { border-color: var(--accent); background: var(--active-bg); color: var(--accent); }

/* ---------- Variants 7 and 8 · Receipts and calendar ---------- */

  -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 16px 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 51% repeat-x;

/** About three months of a Kyiv couple's spending: 1 Aug – 29 Oct 2026, the same every time (a seeded random). */
function makeData() {

    if (dom === 15) add(d, { type: 'transfer', acc: 'mono-usd', to: 'mono', amount: 100, toAmount: 4490 });
    if (dom === 25) add(d, { type: 'expense', cat: 'expense:Spotify', acc: 'mono', amount: 199 });
    if (dom === 27) add(d, { type: 'income', cat: 'income:Salary', acc: 'privat', amount: 62000, note: MONTHS_LONG[d.getMonth()] });
    if (dom === 28) add(d, { type: 'transfer', acc: 'privat', to: 'mono', amount: 20000, note: 'For the month' });
    if (dom % 9 === 4) add(d, { type: 'transfer', acc: 'mono', to: 'cash', amount: 2000, toAmount: 2000, note: 'Cash for the market' });
    if (d.getDay() === 2 && dom % 2 === 0) add(d, { type: 'expense', cat: 'expense:Therapy', acc: 'mono', amount: 1200 });
    if (rnd() < 0.62) add(d, { type: 'expense', cat: 'expense:Groceries', acc: pick(['mono', 'mono', 'cash', 'privat']), amount: amt(120, 1450), note: pick(['Silpo', 'ATB', 'Novus', 'Market', '', 'Silpo']) });
    if (rnd() < 0.18) add(d, { type: 'expense', cat: 'expense:Groceries', acc: 'cash', amount: amt(40, 260), note: pick(['Bakery', 'Fruit stand', '']) });
    if (rnd() < 0.36) add(d, { type: 'expense', cat: 'expense:Eating out', acc: pick(['cash', 'mono']), amount: amt(90, 950), note: pick(['Lunch with Vlad', 'Coffee', 'Puzata Hata', 'Pizza', '']) });
    if (rnd() < 0.42) add(d, { type: 'expense', cat: 'expense:Transportation', acc: 'mono', amount: pick([8, 8, 16, amt(120, 420)]), note: pick(['Metro', 'Uklon', 'Bolt', 'Metro']) });
    if (rnd() < 0.14) add(d, { type: 'expense', cat: 'expense:Delivery', acc: 'mono', amount: amt(60, 180), note: 'Nova Poshta' });
    if (rnd() < 0.1) add(d, { type: 'expense', cat: 'expense:Home supplies', acc: pick(['mono', 'privat']), amount: amt(150, 1200), note: pick(['Epicentr', 'EVA', '']) });
    if (rnd() < 0.07) add(d, { type: 'expense', cat: 'expense:Medicine/Drugs/Skincare', acc: 'mono', amount: amt(120, 900), note: pick(['Pharmacy', 'Sunscreen']) });

const inCat = (t, c) => (c.startsWith('group:') ? cat(t.cat)?.group === c.slice(6) : t.cat === c);

const totalCur = () => (F.accs.length === 1 ? acc(F.accs[0]).cur : REPORT_CUR);

function totalsHtml(items, cls = 'd-tot') {

function placeMenu() {

}
function wireScrollAreas() {
  document.querySelectorAll('[data-sa]').forEach((sa) => {
    const vp = sa.querySelector('.sa-vp');
    const track = sa.querySelector('.sa-track');
    const thumb = sa.querySelector('.sa-thumb');
    let hide;
    sa.update = () => {
      const { scrollTop, scrollHeight, clientHeight } = vp;
      const max = scrollHeight - clientHeight;
      const over = max > 1;
      sa.toggleAttribute('data-overflow', over);
      sa.toggleAttribute('data-top', scrollTop > 1);
      sa.toggleAttribute('data-bottom', over && scrollTop < max - 1);
      if (!over) return;
      const th = track.clientHeight;
      const h = Math.max(32, (th * clientHeight) / scrollHeight);
      thumb.style.height = `${h}px`;
      thumb.style.transform = `translateY(${((th - h) * scrollTop) / max}px)`;
    };
    vp.addEventListener('scroll', () => { sa.update(); sa.setAttribute('data-scrolling', ''); clearTimeout(hide); hide = setTimeout(() => sa.removeAttribute('data-scrolling'), 900); }, { passive: true });
    new ResizeObserver(sa.update).observe(vp);
    sa.update();
  });
}

// ---------- The form (F-018 / F-019's, as built; here only what matters for the list) and Delete ----------

/** The one moment: the account's balance counts from the old value to the new one in the notification. */
function balanceToast(word, changes) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  const two = changes.length > 1;
  el.className = two ? 'toast two' : 'toast'; el.setAttribute('role', 'status');
  const counts = changes.map(([a, from]) => `${esc(a.name)}${two ? '' : ':'} <span class="count num">${money(a.cur, from)}</span>`);
  el.innerHTML = two ? `<span class="ln">${icon('check', 16)} ${word}.</span><span class="ln">${counts.join(', ')}</span>` : `${icon('check', 16)}<span>${word}. ${counts[0]}</span>`;
  app.appendChild(el);
  const outs = [...el.querySelectorAll('.count')];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const start = performance.now();
  const step = (now) => {
    const k = still ? 1 : Math.min(1, (now - start - 300) / 700);
    if (k > 0) changes.forEach(([a, from, to], i) => { outs[i].textContent = money(a.cur, from + (to - from) * (1 - (1 - k) ** 3)); });
    if (k < 1) requestAnimationFrame(step);

}
function toast(text) {

  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = text;
  app.appendChild(el); setTimeout(() => el.remove(), 2200);
}

// ---------- Render ----------
function pageInner() {

}
function render() {

  const active = document.activeElement?.id;
  app.innerHTML = shell(pageInner()) + moreSheet() + menuLayer() + editDialog() + confirmDelete();
  document.querySelector('.main').scrollTop = scroll;
  const pk = document.querySelector('#pk-list, .pick-sheet .sa-vp, .picker .sa-vp'); if (pk) pk.scrollTop = pkScroll;
  document.querySelectorAll('[data-page-set]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.pageSet === state.page)));
  placeMenu(); requestAnimationFrame(placeMenu);
  wireScrollAreas();

/** The day the folded week shows: the picked one, else today in this month, else the month's last day with spending. */
function foldDay() {
  if (state.day) return state.day;
  if (F.anchor.getFullYear() === TODAY.getFullYear() && F.anchor.getMonth() === TODAY.getMonth()) return TODAY;
  return latestDay();
}
/** The month's calendar, or with `week` (its Monday) only that week's row. */
function calendar(week) {
  const { y, m, per: all, level } = monthDays();
  const per = week ? all.filter((p) => p.d >= week && p.d <= addDays(week, 6)) : all;
  const lead = week ? Math.round((per[0].d - week) / 864e5) : (new Date(y, m, 1).getDay() + 6) % 7;
  const tail = week ? 7 - lead - per.length : 0;
  const cur = totalCur();
  const short = (n) => (n >= 10000 ? `${Math.round(n / 1000)}k` : group3(n));
  const cells = per.map((p) => {
    const future = p.d > TODAY;
    const on = state.day && sameDay(state.day, p.d);
    const label = `${WEEKDAYS_LONG[p.d.getDay()]} ${p.d.getDate()} ${MONTHS_LONG[m]}${future ? '' : p.spent || p.got ? `: ${p.spent ? `spent ${money(cur, p.spent)}` : ''}${p.spent && p.got ? ', ' : ''}${p.got ? `received ${money(cur, p.got)}` : ''}` : ': nothing spent'}`;
    return `<button class="v7-cell" type="button" data-action="v7-day" data-k="${dayKey(p.d)}" data-lv="${level(p.spent)}"${sameDay(p.d, TODAY) ? ' data-today' : ''}${future ? ' disabled' : ''} aria-pressed="${!!on}"><span class="sr">${esc(label)}</span>
      <span class="v7-ctop" aria-hidden="true"><span class="v7-dn">${p.d.getDate()}</span>${p.got ? '<span class="v7-in"></span>' : ''}</span><span class="v7-amt num" aria-hidden="true">${p.spent ? short(p.spent) : ''}</span></button>`;
  }).join('');
  const wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  return `<section class="v7-cal${week ? ' v7-week' : ''}" aria-label="${week ? 'Days of the week' : `Days of ${MONTHS_LONG[m]}`}">
    <div class="v7-wd" aria-hidden="true">${wd.map((w) => `<span>${isWide() ? w : w[0]}</span>`).join('')}</div>
    <div class="v7-grid">${'<span aria-hidden="true"></span>'.repeat(lead)}${cells}${'<span aria-hidden="true"></span>'.repeat(tail)}</div>
    ${week ? '' : `<div class="v7-legend" aria-hidden="true"><span>Less</span>${[1, 2, 3, 4].map((l) => `<i data-lv="${l}"></i>`).join('')}<span>More</span><span class="v7-leg-in"><i></i>Income</span></div>`}</section>`;
}

/** Where it went: each category's amount and share of the period's spending (with Income picked, of what came in). */
function bars(inMenu) {
  if (F.type === 'transfer') return '';
  const kind = F.type === 'income' ? 'income' : 'expense';
  const title = kind === 'income' ? 'Where it came from' : 'Where it went';
  const keep = F.cats; F.cats = [];
  const base = found(); F.cats = keep;
  const cur = totalCur();
  const by = new Map();
  base.filter((t) => t.type === kind).forEach((t) => by.set(t.cat, (by.get(t.cat) ?? 0) + conv(t.amount, acc(t.acc).cur, cur)));
  const lines = [...by].map(([id, n]) => ({ id, name: cat(id).name, n: Math.round(n) })).sort((a, b) => b.n - a.n);
  if (!lines.length) return '';
  const sum = lines.reduce((s, l) => s + l.n, 0);
  const max = lines[0].n;
  const few = !inMenu && !isDesk() && !state.allcats && lines.length > 5;
  const shown = few ? lines.slice(0, 5) : lines;
  const pct = (n) => { const p = (n / sum) * 100; return p < 1 ? '<1%' : `${Math.round(p)}%`; };
  return `<section class="v7-where${kind === 'income' ? ' v7-where-in' : ''}" aria-labelledby="v7-wh">${inMenu ? `<h2 class="sr" id="v7-wh">${title}</h2><button class="v7-bar v7-allbar" type="button" data-action="v7-cat" data-id="" aria-pressed="${!F.cats.length}"><span class="v7-bn">All categories</span><span class="num v7-bv">${money(cur, sum)}</span></button>` : `<h2 id="v7-wh">${title}</h2>`}
    ${!inMenu && isDesk() ? '<div class="sa v7-where-sa" data-sa><div class="sa-vp">' : ''}<ul class="list">${shown.map((l) => `<li><button class="v7-bar" type="button" data-action="v7-cat" data-id="${l.id}" aria-pressed="${F.cats[0] === l.id}" style="--w:${Math.max(2, (l.n / max) * 100).toFixed(1)}%"><span class="v7-bn">${esc(l.name)}</span><span class="num v7-bv">${money(cur, l.n)}</span><span class="num v7-bp">${pct(l.n)}</span><span class="v7-track" aria-hidden="true"><span></span></span></button></li>`).join('')}</ul>${!inMenu && isDesk() ? '</div><div class="sa-track"><div class="sa-thumb"></div></div></div>' : ''}
    ${!inMenu && !isDesk() && lines.length > 5 ? `<button class="text-link v7-more" type="button" data-action="v7-allcats" aria-expanded="${!!state.allcats}">${state.allcats ? 'Fewer' : `All ${lines.length} categories`}${icon(state.allcats ? 'chevUp' : 'chevDown', 16)}</button>` : ''}</section>`;
}

/** Variant 4's slip: the day on top, a line per transaction with a dotted leader, the day's total at the foot. */
function slip(d, all) {
  const t = totals(all);
  const lines = d.items.map((x) => `<li><button class="v7-line" type="button" data-action="open-tx" data-id="${x.id}"${state.fresh === x.id ? ' data-fresh' : ''}>
      <span class="v7-l">${esc(rowTitle(x))}</span><span class="v7-dots" aria-hidden="true"></span><span class="v7-lamt">${txAmount(x)}</span>
      <span class="v7-note">${rowSub(x)}</span></button></li>`).join('');
  return `<section class="v7-paper v7-slip" aria-labelledby="d-${d.k}">
    <h2 class="v7-day" id="d-${d.k}">${dayLabel(d.date)}</h2>
    <div class="v7-rule" role="presentation"></div>
    <ul class="list">${lines}</ul>${all.length > d.items.length ? `<p class="v7-cont">${all.length - d.items.length} more loading</p>` : ''}
    ${t.spent || t.got ? `<div class="v7-rule" role="presentation"></div>
    ${t.spent ? `<div class="v7-foot"><span>Total</span><span class="num v7-big">${money(t.cur, t.spent, '−')}</span></div>` : ''}
    ${t.got ? `<div class="v7-foot v7-gotline"><span>Received</span><span class="num pos">${money(t.cur, t.got, '+')}</span></div>` : ''}` : ''}
  </section>`;
}
function endLine() {
  if (F.pk !== 'month') return 'That’s everything.';
  const prev = new Date(F.anchor.getFullYear(), F.anchor.getMonth() - 1, 1);
  return `That’s all of ${esc(monthName(F.anchor))}.${prev >= new Date(2026, 7, 1) ? `</p><p class="list-end" style="padding-top:0"><button class="btn btn-default" type="button" data-action="v7-prev">Show ${esc(monthName(prev))}</button>` : ''}`;
}

/** Below 1024 px: once the big totals scroll away, a slim bar with the month and its totals stays on top; a tap goes back up. */
function miniBar() {
  const t = totals(found());
  const name = F.pk === 'month' ? MONTHS_LONG[F.anchor.getMonth()] : periodLabel();
  return `<div class="v7-mini-wrap"><button class="v7-mini" type="button" data-action="v7-top" tabindex="-1" aria-hidden="true">
    <span class="v7-mini-m">${esc(name)}</span><span class="v7-mini-f"><span class="num"><span class="sr">Spent </span>${money(t.cur, t.spent)}</span>${t.got ? `<span class="num v7-mini-got"><span class="sr">Received </span>${money(t.cur, t.got, '+')}</span>` : ''}</span>${icon('chevUp', 20)}<span class="sr">Back to the top</span></button></div>`;
}
let heroIo = null;
/** Swipe the totals left or right to move a month (or a year); the arrows stay for a mouse and the keyboard. */
V.afterRender = () => {
  heroIo?.disconnect();
  // The sticky left column is as tall as the scrolling area at most; "Where it went" scrolls inside it
  const left = document.querySelector('.v7-left');
  fitLeft();
  const hero = document.querySelector('.v7-hero');
  const wrap = document.querySelector('.v7-mini-wrap');
  if (hero && wrap) {
    const btn = wrap.querySelector('.v7-mini');
    heroIo = new IntersectionObserver(([e]) => {
      const on = !e.isIntersecting;
      wrap.toggleAttribute('data-on', on);
      btn.tabIndex = on ? 0 : -1;
      btn.toggleAttribute('aria-hidden', !on);
    }, { root: document.querySelector('.main'), rootMargin: '-48px 0px 0px 0px' });
    heroIo.observe(hero);
  }
  if (!hero || isDesk() || !(F.pk === 'month' || F.pk === 'year')) return;
  const figs = hero.querySelectorAll('.v7-figs, .v7-ratio, .v7-cap');
  let x0 = null; let y0 = 0; let drag = null;
  hero.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') return; x0 = e.clientX; y0 = e.clientY; drag = null; });
  hero.addEventListener('pointermove', (e) => {
    if (x0 === null) return;
    const dx = e.clientX - x0; const dy = e.clientY - y0;
    if (drag === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) drag = Math.abs(dx) > Math.abs(dy);
    if (!drag) return;
    const dir = dx < 0 ? 1 : -1;
    const k = canStep(dir) ? 0.5 : 0.15;
    figs.forEach((f) => { f.style.transform = `translateX(${dx * k}px)`; f.style.opacity = String(1 - Math.min(0.6, Math.abs(dx) / 300)); });
  });
  const end = (e) => {
    if (x0 === null) return;
    const dx = e.clientX - x0;
    x0 = null;
    figs.forEach((f) => { f.style.transform = ''; f.style.opacity = ''; });
    if (!drag || Math.abs(dx) < 56) return;
    const dir = dx < 0 ? 1 : -1;
    swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
    if (!canStep(dir)) return;
    stepPeriod(dir); state.day = null; refilter();
  };
  hero.addEventListener('pointerup', end);
  hero.addEventListener('pointercancel', () => { x0 = null; figs.forEach((f) => { f.style.transform = ''; f.style.opacity = ''; }); });
};
let swallowClick = false;
document.addEventListener('click', (e) => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);

/** "Show 38 transactions" on the sheet's button. */
function showWord() { const n = found().length; return n ? `Show ${n} ${n === 1 ? 'transaction' : 'transactions'}` : 'Nothing found'; }
/** The phone: one Filters button with how many are on, then each picked filter as a chip with its own ×. */
function phoneFilters() {
  const n = filterCount();
  const chip = (kind, text, what) => `<span class="v7-chip"><span>${esc(text)}</span><button class="icon-btn" type="button" data-action="v7-clear" data-kind="${kind}" aria-label="Clear ${what}: ${esc(text)}">${icon('x', 16)}</button></span>`;
  const chips = [
    F.accs.length ? chip('acc', acc(F.accs[0]).name, 'account') : '',
    F.type ? chip('type', TYPES.find((x) => x.id === F.type).label, 'type') : '',
    F.cats.length ? chip('cat', cat(F.cats[0])?.name ?? F.cats[0].slice(6), 'category') : '',
  ].join('');
  return `<div class="v7-controls v7-pf" role="group" aria-label="Filters">
    <button class="sel v7-fbtn" type="button" data-action="open-menu" data-menu="v7filters" data-anchor="v7filters" aria-expanded="${state.menu === 'v7filters'}"${n ? ' data-on' : ''}>${icon('filter', 20)}<span>Filters</span>${n ? `<span class="v7-count" aria-label="${n} on">${n}</span>` : ''}</button>
    ${chips}</div>`;
}
function filterSheet() {
  const pill = (action, id, text, on, kind) => `<button type="button" data-action="${action}" data-id="${id}" aria-pressed="${on}"${kind ? ` data-type="${kind}"` : ''}>${esc(text)}</button>`;
  const accs = [pill('v7-facc', '', 'All accounts', !F.accs.length), ...ACCOUNTS.map((a) => pill('v7-facc', a.id, a.name, F.accs[0] === a.id))].join('');
  const types = TYPES.map((x) => pill('v7-ftype', x.id, x.label, (F.type ?? '') === x.id, x.id)).join('');
  const cats = bars(true);
  return `<div class="sa" data-sa><div class="sa-vp pick-scroll v7-fsheet">
    <section class="v7-fsec" aria-labelledby="fs-acc"><h3 id="fs-acc">Account</h3><div class="v7-pills">${accs}</div></section>
    <section class="v7-fsec" aria-labelledby="fs-type"><h3 id="fs-type">Type</h3><div class="v7-pills">${types}</div></section>
    ${cats ? `<section class="v7-fsec v7-inmenu" aria-labelledby="fs-cat"><h3 id="fs-cat">Category</h3>${cats}</section>` : ''}
  </div><div class="sa-track"><div class="sa-thumb"></div></div></div>`;
}

/**
 * Desktop: the sticky left column ends 16 px above the window's bottom at every scroll position, so the whole of
 * "Where it went" is on screen and its list scrolls inside it (it keeps the wheel at both ends: the receipts don't move).
 */
function fitLeft() {
  const left = document.querySelector('.v7-left');
  const main = document.querySelector('.main');
  if (!left || !main) return;
  if (!isDesk()) { left.style.maxHeight = ''; return; }
  const m = main.getBoundingClientRect();
  const top = Math.max(left.getBoundingClientRect().top, m.top + 16);
  left.style.maxHeight = `${Math.round(m.bottom - top - 16)}px`;
}
let fitWired = null;
const fitOnScroll = () => requestAnimationFrame(fitLeft);
new MutationObserver(() => {
  const main = document.querySelector('.main');
  if (main && main !== fitWired) { main.addEventListener('scroll', fitOnScroll, { passive: true }); fitWired = main; }
}).observe(document.getElementById('app'), { childList: true });
window.addEventListener('resize', fitOnScroll);

boot();
</script>
</body>
</html>
