<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }

.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(480px, calc(100vw - 32px)); background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }

/* ---------- Tokens: the app's theme (F-010, F-011, F-028, F-014, F-015) ---------- */
.app {

  --accent: #2a62a3; --active-bg: #e7ecf1; --tint: #e7ecf1; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --error: #b3261e; --error-bg: #fbeceb; --error-text: #8c1d18;
  --pill: #1c1e21; --on-pill: #f5f6f7; --focus: #26292e; --scrim: rgba(18, 19, 21, .45);
  --shadow-float: 0 8px 24px rgba(15, 17, 20, .1);

}
.app[data-scheme='dark'] {
  --bg: #121315; --surface: #1b1c1e; --sidebar: #18191b; --seg-bg: #1f2022; --text: #e9eaec; --muted: #a4a5a7;
  --rule: #37383a; --hover: #26272a; --field-border: #71747b;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --active-bg: #262f37; --tint: #262f37; --logo: #8ec1ec; --logo-mark: #121315;
  --error: #f2958c; --error-bg: #3a1d1b; --error-text: #f6b8b2;
  --pill: #e9eaec; --on-pill: #121315; --focus: #e9eaec; --scrim: rgba(0, 0, 0, .6);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p, ul, ol, dl, dd) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.list { list-style: none; padding: 0; margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 15px; text-decoration: none; white-space: nowrap; background: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-default { border-color: var(--rule); color: var(--text); }
.btn-default:hover { background: var(--hover); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.text-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--accent); font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 14px; z-index: 30; white-space: nowrap; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--tint); color: var(--text); }
.banner .ic { margin-top: 2px; color: var(--accent); }
.banner-error { background: var(--error-bg); color: var(--error-text); }
.banner-error .ic { color: var(--error-text); }
.banner .text-link { min-height: 44px; margin: -6px 0 -10px; color: inherit; }
.later { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 14px; }
.later .ic { margin-top: 2px; }

/* Fields (F-011: 48 px, a 2 px accent border in focus, the error under the field) */
.field { display: grid; gap: 6px; }
.field label { font-weight: 500; font-size: 14px; }
.input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-size: 16px; }
/* In focus: a 2 px accent border, drawn as an inset outline (DESIGN_RULES, custom rules) */
.input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.input[aria-invalid='true'] { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
.field-error { color: var(--error); font-size: 14px; }
.field-hint { color: var(--muted); font-size: 14px; }

/* ---------- App shell (F-010): top bar and tab bar on the phone, sidebar from 768 px ---------- */
.logo { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
.column { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { display: flex; flex: none; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand .logo { width: 32px; height: 32px; }
.brand-name { font-family: var(--font-display); font-size: 15px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
.main { flex: 1; min-height: 0; overflow: hidden auto; position: relative; }
.content { max-width: 1040px; margin: 0 auto; padding: 8px 16px 32px; }
.tabs { display: flex; flex: none; align-items: center; gap: 2px; padding: 8px 8px 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.tab { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; color: var(--muted); font-size: 13px; text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab[data-active] { width: auto; padding: 0 14px 0 12px; background: var(--active-bg); color: var(--accent); font-weight: 500; }
.tab:not([data-active]) .tab-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tab-add { display: grid; place-items: center; width: 52px; height: 52px; margin-left: auto; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
.avatar-link { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; text-decoration: none; }
/* The initials are drawn by CSS so the link is named "Settings" only */
.avatar[data-initials]::before { content: attr(data-initials); }
@container app (min-width: 768px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-right: 1px solid var(--rule); background: var(--sidebar); min-width: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; height: 44px; margin-bottom: 12px; padding: 0 2px; }
  .side-head .logo { width: 32px; height: 32px; margin: 0 6px; }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin-bottom: 14px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 999px; color: var(--text); font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { background: var(--hover); }
  .nav-link[aria-current='page'] { font-weight: 500; }
  .nav-link[aria-current='page'] > svg { color: var(--accent); }
  .nav-link[aria-current='page']::before { content: ''; position: absolute; top: 8px; bottom: 8px; left: -12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-sep { height: 1px; margin: 10px 14px; background: var(--rule); }
  .side-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; margin-top: auto; padding: 0 0 0 8px; font-size: 14px; }
  .side-foot .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-foot .icon-btn { width: 36px; height: 36px; }
  .top, .tabs { display: none; }
  .content { padding: 32px 40px 48px; }
  .toast { bottom: 24px; }
}

/* ---------- Page head ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 0 20px; }
.page-head h1 { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; margin-right: auto; }

/* ---------- Pop-ups (I-012): a sheet on the phone, a dialog from 768 px ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: var(--scrim); }
.dialog { display: flex; flex-direction: column; width: 100%; max-height: 92%; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-float); overflow: hidden; }
.dlg-head { position: relative; padding: 16px 64px 0 16px; }
.dlg-x { position: absolute; top: 8px; right: 8px; }
.dlg-head h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 28px; }
.dlg-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 0; }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 16px; }
.dlg-foot .btn { flex: 1; }
.more-link { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 12px; border-radius: 12px; color: var(--text); text-decoration: none; background: none; border: 0; width: 100%; cursor: pointer; }
.more-link:hover { background: var(--hover); }
.more-link[aria-current='page'] { background: var(--active-bg); color: var(--accent); font-weight: 500; }
@container app (min-width: 768px) {
  .scrim { align-items: center; justify-content: center; }
  .dialog { width: 440px; max-height: 80%; border-radius: var(--r-lg); }
  .dlg-head { padding: 20px 64px 0 20px; }
  .dlg-x { top: 12px; right: 12px; }
  .dlg-body { padding: 20px 20px 0; }
  .dlg-foot { padding: 20px; }
  .dlg-foot .btn { flex: none; }
}

/* ---------- States ---------- */
.sk { display: block; height: 14px; border-radius: 6px; background: var(--hover); }
/* The one moment: after the report currency changes, the total in it comes in from below in place of the old one */
@keyframes swap-in { from { opacity: 0; transform: translateY(8px); } }
.swap-in { display: inline-block; animation: swap-in 200ms ease-out; }
@media (prefers-reduced-motion: reduce) { .swap-in { animation: none; } }

/* ====================================================================================================== */
/* ---------- Variant 4 (final) · Variant 1 with any NBU currency ---------- */
.v1 { max-width: 880px; }
.v1-sec { display: grid; gap: 12px; padding: 20px 0 24px; border-top: 1px solid var(--rule); }
.v1-label h2 { font-size: 17px; font-weight: 500; line-height: 24px; }
.v1-label p { margin-top: 4px; color: var(--muted); font-size: 14px; }
.v1-ctl { display: grid; gap: 12px; min-width: 0; }
.v1-name-btns { display: flex; gap: 8px; }
.v1-name-btns[hidden] { display: none; }
.v1-email { display: grid; gap: 2px; }
.v1-email dt { font-weight: 500; font-size: 14px; }
.v1-email dd { overflow-wrap: anywhere; }
.v1-email .field-hint { margin-top: 2px; }
/* Segmented choice: a pill track, the picked one a raised pill with the accent */
.seg { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 999px; background: var(--seg-bg); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked='true'] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(15, 17, 20, .12); }
.app[data-scheme='dark'] .seg button[aria-checked='true'] { background: var(--active-bg); box-shadow: none; }

.pick-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 12px 0 16px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-size: 16px; text-align: left; cursor: pointer; }
.pick-btn b { font-weight: 500; }
.pick-btn .what { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-btn .ph { flex: 1; color: var(--muted); }
.pick-btn > .ic { color: var(--muted); }
.pick-btn[aria-expanded='true'] { border-color: var(--accent); outline: 1px solid var(--accent); }
/* Picked from the list: marked like the picked segment (the accent), with a check */
.pick-btn[data-picked] { border-color: var(--accent); outline: 1px solid var(--accent); background: var(--active-bg); }
.pick-btn[data-picked] b, .pick-btn[data-picked] > .ok { color: var(--accent); }
/* Desktop: the list floats under the field over the page (the page doesn't move); phone: a sheet (see below) */
.pick-wrap { position: relative; }
.picker { position: absolute; z-index: 15; top: calc(100% + 8px); left: 0; right: 0; display: flex; flex-direction: column; height: 344px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--shadow-float); }
.picker .sa { flex: 1; }
.pick-sheet .dialog { height: 80%; }
/* The rows' highlight lines up with the search box and the title (16 px from the edge) */
.pick-sheet .dlg-body { display: flex; flex-direction: column; padding: 8px 16px 0; }
.pick-sheet .pick-search { margin: 8px 0 4px; }
.pick-sheet .pick-scroll { padding: 0 0 8px; }
.pick-sheet .sa { flex: 1; }
.pick-search { position: relative; margin: 8px; flex: none; }
.pick-search > .ic { position: absolute; left: 14px; top: 14px; color: var(--muted); pointer-events: none; }
.pick-search .input { padding: 0 52px 0 44px; }
.pick-search .icon-btn { position: absolute; right: 4px; top: 2px; }
.pick-search input::-webkit-search-cancel-button { display: none; }
.pick-scroll { padding: 0 6px 6px; }
/* I-004's scroll area: a 6 px pill that shows while scrolling or under the pointer and fades; edges with more fade out */
.sa { position: relative; display: flex; flex-direction: column; min-height: 0; }
.sa-vp { flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain; scrollbar-width: none; }
.sa-vp::-webkit-scrollbar { display: none; }
.sa-track { position: absolute; display: none; pointer-events: none; }
.sa[data-overflow] > .sa-track { display: block; pointer-events: auto; top: 8px; bottom: 8px; right: 2px; width: 12px; opacity: 0; transition: opacity .3s ease .1s; }
.sa[data-scrolling] > .sa-track, .sa[data-dragging] > .sa-track, .sa:hover > .sa-track { opacity: 1; transition-delay: 0s; transition-duration: .12s; }
.sa-thumb { position: absolute; top: 0; left: 50%; width: 6px; margin-left: -3px; border-radius: 999px; background: var(--field-border); transition: width .12s, margin-left .12s, background-color .12s; }
.sa-track:hover .sa-thumb, .sa[data-dragging] .sa-thumb { width: 10px; margin-left: -5px; background: var(--muted); }
.sa > .sa-vp { --ft: 0px; --fb: 0px; mask-image: linear-gradient(to bottom, transparent, #000 var(--ft), #000 calc(100% - var(--fb)), transparent); }
.sa[data-top] > .sa-vp { --ft: 32px; }
.sa[data-bottom] > .sa-vp { --fb: 40px; }
@media (prefers-reduced-motion: reduce) { .sa-track, .sa-thumb { transition: none !important; } }
.pick-h { padding: 10px 10px 4px; color: var(--muted); font-size: 13px; font-weight: 500; }
.pick-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); text-align: left; cursor: pointer; }
.pick-item:hover { background: var(--hover); }
.pick-item b { flex: none; width: 40px; font-weight: 500; }
.pick-item[aria-pressed='true'] { background: var(--active-bg); color: var(--accent); }
.pick-none { padding: 12px 10px; color: var(--muted); }
.v1-total { display: grid; gap: 2px; padding-top: 4px; }
.v1-total .cap { color: var(--muted); font-size: 14px; }
.v1-total .amt { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 36px; letter-spacing: -.01em; overflow: hidden; }
.v1-total .rates { color: var(--muted); font-size: 14px; }
@container app (min-width: 1024px) {
  .v1-sec { grid-template-columns: 240px minmax(0, 1fr); gap: 32px; padding: 24px 0 28px; }
  .v1-ctl { max-width: 480px; }
}

// ---------- I-004's scroll area: the thumb's size and place, and the edges with more behind them ----------
function wireScrollAreas() {
  document.querySelectorAll('[data-sa]').forEach((sa) => {
    const vp = sa.querySelector('.sa-vp');
    const track = sa.querySelector('.sa-track');
    const thumb = sa.querySelector('.sa-thumb');
    let hideTimer;
    sa.update = () => {
      const { scrollTop, scrollHeight, clientHeight } = vp;
      const max = scrollHeight - clientHeight;
      const over = max > 1;
      sa.toggleAttribute('data-overflow', over);
      sa.toggleAttribute('data-top', scrollTop > 1);
      sa.toggleAttribute('data-bottom', over && scrollTop < max - 1);
      if (!over) return;
      const th = track.clientHeight;
      const h = Math.max(32, (th * clientHeight) / scrollHeight);
      thumb.style.height = `${h}px`;
      thumb.style.transform = `translateY(${((th - h) * scrollTop) / max}px)`;
    };
    vp.addEventListener('scroll', () => {
      sa.update();
      sa.setAttribute('data-scrolling', '');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => sa.removeAttribute('data-scrolling'), 900);
    }, { passive: true });
    new ResizeObserver(sa.update).observe(vp);
    thumb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      thumb.setPointerCapture(e.pointerId);
      sa.setAttribute('data-dragging', '');
      const startY = e.clientY;
      const startTop = vp.scrollTop;
      const ratio = (vp.scrollHeight - vp.clientHeight) / (track.clientHeight - thumb.offsetHeight);
      const move = (ev) => { vp.scrollTop = startTop + (ev.clientY - startY) * ratio; };
      const up = () => { sa.removeAttribute('data-dragging'); thumb.removeEventListener('pointermove', move); thumb.removeEventListener('pointerup', up); };
      thumb.addEventListener('pointermove', move);
      thumb.addEventListener('pointerup', up);
    });
    sa.update();
  });
}

          ${seg('s-cur', QUICK, state.currency, 'pick-cur')}
          <div class="pick-wrap">${pickBtn}${picker}</div>
          ${R.saveError ? `<div class="banner banner-error" role="alert">${icon('alert')}<div><p>Couldn’t save the currency. Check the connection and try again.</p><button class="text-link" type="button" data-action="retry-cur">${icon('refresh')}Try again</button></div></div>` : ''}
          <div class="v1-total"><span class="cap">Your accounts in total</span><span class="amt num" aria-live="polite"><span class="${R.fresh ? 'swap-in' : ''}">${money(state.currency, totalIn(state.currency))}</span></span>
            <span class="rates">${ratesLine(state.currency)}</span></div>
        </div>
      </section>
      <section class="v1-sec" aria-labelledby="s-theme">
        <div class="v1-label"><h2 id="s-theme">Theme</h2><p>Kept on this device. System follows your phone or computer.</p></div>
        <div class="v1-ctl">${seg('s-theme', THEMES, state.schemePref, 'pick-theme')}</div>
      </section>
    </div>`;
  },
  /** The search and the list: in the dropdown on the desktop, in the sheet on the phone. */
  panel() {
    return `<div class="pick-search">${icon('search')}<input class="input" id="pk-q" type="search" aria-label="Search currencies" placeholder="Search: zloty, GBP" value="${esc(R.query)}" autocomplete="off"><button class="icon-btn" type="button" data-action="toggle-list" aria-label="Close the list">${icon('x')}</button></div>
      <div class="sa" data-sa><div class="sa-vp pick-scroll" id="pk-list">${V.list()}</div><div class="sa-track" aria-hidden="true"><div class="sa-thumb"></div></div></div>`;
  },
  /** The phone: the list in a sheet, so the search and the keyboard have room. */
  overlay() {
    if (!R.open || isWide()) return '';
    return `<div class="scrim pick-sheet" data-action="toggle-list"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pk-title" data-stop>
      <div class="dlg-head"><button class="icon-btn dlg-x" type="button" data-action="toggle-list" aria-label="Close">${icon('x')}</button><h2 id="pk-title">Report currency</h2></div>
      <div class="dlg-body" id="pk">${V.panel().replace(/<button class="icon-btn" type="button" data-action="toggle-list" aria-label="Close the list">.*?<\/button>/, '')}</div></div></div>`;
  },
  escape() { if (R.open) V.actions['toggle-list'](); },
  afterRender() {
    wireScrollAreas();
    const input = document.getElementById('name');
    input?.addEventListener('input', () => {
      R.draft = input.value;
      document.getElementById('name-btns').hidden = !(R.draft.trim() !== state.name || R.error);
    });
    input?.addEventListener('keydown', (e) => { if (e.key === 'Enter') V.actions['name-save'](); });
    const q = document.getElementById('pk-q');
    q?.addEventListener('input', () => {
      R.query = q.value;
      const vp = document.getElementById('pk-list');
      vp.innerHTML = V.list(); vp.scrollTop = 0; vp.closest('.sa').update();
    });
    q?.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); V.actions['toggle-list'](); } });
  },
  /** Saves the report currency: at once, with a notification; on the Couldn't save screen the first try fails. */
  save(code) {
    if (code === state.currency) { R.open = false; render(); return; }
    if (state.page === 'save-error') { Object.assign(R, { saveError: true, pending: code, open: false }); render(); return; }
    Object.assign(R, { open: false, query: '', fresh: true, saveError: false });
    state.currency = code; render(); R.fresh = false;
    toast(`Totals are now in ${code}`);
  },
  actions: {
    'pick-cur': (a) => { V.save(a.dataset.id); document.querySelector(`[data-action="pick-cur"][data-id="${a.dataset.id}"]`)?.focus(); },
    'pick-other': (a) => { V.save(a.dataset.id); document.querySelector('.pick-btn')?.focus(); },
    'toggle-list': () => {
      Object.assign(R, { open: !R.open, query: '' }); render();
      (R.open ? document.getElementById('pk-q') : document.querySelector('.pick-btn'))?.focus();
    },
    'retry-cur': () => { R.saveError = false; const code = R.pending ?? 'USD'; R.pending = null; state.page = 'settings'; V.save(code); },
    'pick-theme': (a) => { setScheme(a.dataset.id); render(); document.querySelector(`[data-action="pick-theme"][data-id="${a.dataset.id}"]`)?.focus(); },
    'name-cancel': () => { Object.assign(R, { draft: state.name, error: '' }); render(); },
    'name-save': () => {
      if (!R.draft.trim()) { R.error = 'Enter your name.'; render(); document.getElementById('name').focus(); return; }
      state.name = R.draft.trim(); Object.assign(R, { draft: state.name, error: '' }); render(); toast('Name saved');
    },
  },
};


const PAGES = V.PAGES;
// Preview bar (review aid)
document.body.insertAdjacentHTML('afterbegin', `<div class="pv-bar"><b>F-016 · ${V.DIRECTION.name}</b>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="tablet">Tablet</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Screen</span>${PAGES.map((p) => `<button data-page-set="${p.id}">${p.label}</button>`).join('')}</div>
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="notes" aria-expanded="false">About this direction</button>
  <div class="pv-notes" id="notes" hidden><b>${V.DIRECTION.name}</b><p style="margin:4px 0 0">${V.DIRECTION.thesis}</p><ul>${V.DIRECTION.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
setView(innerWidth >= 1200 ? 'desktop' : 'phone');

document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-page-set]');
  if (p) { go(p.dataset.pageSet); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { setScheme(s.dataset.schemeSet); render(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  if (a.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  e.preventDefault();
  ({
    nav: () => { state.more = false; render(); toast(`${a.dataset.to} isn’t part of this prototype`); },
    'add-tx': () => toast('Add transaction (F-018)'),
    more: () => { state.more = !state.more; render(); },
    'close-more': () => { state.more = false; render(); },
    // The sun / moon button stays (open point 2): it sets Light or Dark
    'flip-scheme': () => { setScheme(app.dataset.scheme === 'dark' ? 'light' : 'dark'); render(); },
    ...(V.actions ?? {}),
    notes: () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; a.setAttribute('aria-expanded', String(!n.hidden)); },
  })[a.dataset.action]?.(a, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.getElementById('notes').hidden = true;
  if (state.more) { state.more = false; render(); return; }
  V.escape?.();
});
applyScheme();
go(PAGES[0].id);
</script>
</body>
</html>
