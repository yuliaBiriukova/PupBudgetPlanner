<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-028 · Variant 6 · Round 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Unbounded:wght@300&display=swap">
<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.pv-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.pv-bar button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pv-bar button:hover { background: #363c47; }
.pv-bar button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(480px, calc(100vw - 32px)); background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.pv-notes ul { margin: 6px 0 0; padding-left: 18px; }
.pv-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='tablet'] .frame { width: 834px; height: min(1050px, 100%); border: 12px solid #16181d; border-radius: 28px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
}

/* ---------- Tokens: the app's theme (F-010, F-011) plus a danger button and the sky tint for the new link ---------- */
.app {
  --bg: #f5f6f7; --surface: #fcfcfd; --sidebar: #ebedf0; --seg-bg: #ebedf0; --text: #1c1e21; --muted: #57585b;
  --rule: #d7d8d9; --hover: #e8e9ea; --field-border: #7c828a;
  --primary: #26292e; --primary-hover: #363a40; --on-primary: #f5f6f7;
  --accent: #2a62a3; --active-bg: #e7ecf1; --tint: #e7ecf1; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --hero: #26292e; --on-hero: #f5f6f7; --hero-muted: #b4b9bf; --hero-rule: #474c54;
  --error: #b3261e; --error-bg: #fbeceb; --error-text: #8c1d18;
  --danger: #b3261e; --danger-hover: #9c211a; --on-danger: #fcfcfd;
  --pill: #1c1e21; --on-pill: #f5f6f7; --focus: #2a62a3; --scrim: rgba(18, 19, 21, .45);
  --shadow-float: 0 8px 24px rgba(15, 17, 20, .1);
  --font-display: 'Unbounded', system-ui, sans-serif; --font-text: 'Manrope', system-ui, sans-serif;
  --r-sm: 12px; --r-lg: 24px;
}
.app[data-scheme='dark'] {
  --bg: #121315; --surface: #1b1c1e; --sidebar: #18191b; --seg-bg: #121315; --text: #e9eaec; --muted: #a4a5a7;
  --rule: #37383a; --hover: #26272a; --field-border: #71747b;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --active-bg: #262f37; --tint: #262f37; --logo: #8ec1ec; --logo-mark: #121315;
  --hero: #0b0c0d; --on-hero: #e9eaec; --hero-muted: #a4a5a7; --hero-rule: #2e3035;
  --error: #f2958c; --error-bg: #3a1d1b; --error-text: #f6b8b2;
  --danger: #f2958c; --danger-hover: #f6b8b2; --on-danger: #121315;
  --pill: #e9eaec; --on-pill: #121315; --focus: #8ec1ec; --scrim: rgba(0, 0, 0, .6);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p, ul) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }

/* Buttons and fields (the F-011 set) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 15px; text-decoration: none; white-space: nowrap; background: none; }
.btn-lg { min-height: 52px; font-size: 16px; width: 100%; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: var(--surface); color: var(--text); border-color: var(--field-border); }
.btn-outline:hover { background: var(--hover); }
.btn-danger { background: var(--danger); color: var(--on-danger); }
.btn-danger:hover { background: var(--danger-hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-quiet { color: var(--text); }
.btn-quiet:hover { background: var(--hover); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.field label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
.field .hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
.control { position: relative; display: flex; }
.control input { width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-size: 16px; min-width: 0; }
.control input:focus { outline: 1px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.control.has-toggle input { padding-right: 56px; }
.toggle { position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 10px; color: var(--muted); cursor: pointer; }
.text-link { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; background: none; border: 0; padding: 0; cursor: pointer; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--error-bg); color: var(--error-text); }
.banner .ic { margin-top: 2px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ''; flex: 1; border-top: 1px solid var(--rule); }
.toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 14px; z-index: 30; white-space: nowrap; }

/* ---------- Sign-in layout (F-011, variant 4) ---------- */
.auth { height: 100%; overflow: hidden auto; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; background: var(--surface); }
.hero { display: flex; flex-direction: column; padding: 24px 20px 48px; background: var(--hero); color: var(--on-hero); }
.hero-body { display: flex; flex-direction: column; }
.logo { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.wordmark { font-family: var(--font-display); font-weight: 300; font-size: 30px; line-height: 1.1; letter-spacing: -.01em; margin-top: 16px; white-space: nowrap; }
.about { display: none; }
.form-side { position: relative; margin-top: -24px; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 20px 16px 32px; }
.form-wrap { width: 100%; max-width: 400px; margin: 0 auto; }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: var(--seg-bg); }
.seg a { display: grid; place-items: center; min-height: 44px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 500; }
.seg a[aria-current='page'] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(15, 17, 20, .14); }
.app[data-scheme='dark'] .seg a[aria-current='page'] { background: #2e3035; box-shadow: none; }
.auth form { margin-top: 20px; display: grid; gap: 20px; }
.auth-foot { margin-top: 12px; text-align: center; color: var(--muted); }
@container app (min-width: 900px) {
  .auth { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: stretch; min-height: 100%; }
  .hero { padding: 40px 56px; min-height: 100%; }
  .hero-body { margin: auto 0; max-width: 480px; }
  .logo { width: 56px; height: 56px; }
  .wordmark { font-size: 48px; margin-top: 24px; }
  .about { display: block; color: var(--hero-muted); margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--hero-rule); max-width: 420px; }
  .form-side { margin-top: 0; border-radius: 0; min-height: 100%; display: flex; flex-direction: column; justify-content: safe center; padding: 40px 48px; }
}

/* ---------- App shell (F-010): top bar and tab bar on the phone, sidebar from 768 px ---------- */
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
.column { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { display: flex; flex: none; align-items: center; gap: 10px; height: 56px; padding: 0 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand .logo { width: 32px; height: 32px; }
.brand-name { font-family: var(--font-display); font-size: 15px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
.main { flex: 1; min-height: 0; overflow: hidden auto; }
.content { max-width: 960px; margin: 0 auto; padding: 8px 16px 32px; }
.tabs { display: flex; flex: none; align-items: center; gap: 2px; padding: 8px 8px 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.tab { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; color: var(--muted); font-size: 13px; text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab[data-active] { width: auto; padding: 0 14px 0 12px; background: var(--active-bg); color: var(--accent); font-weight: 500; }
.tab:not([data-active]) .tab-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tab-add { display: grid; place-items: center; width: 52px; height: 52px; margin-left: auto; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
@container app (min-width: 768px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-right: 1px solid var(--rule); background: var(--sidebar); min-width: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; height: 44px; margin-bottom: 12px; padding: 0 2px; }
  .side-head .logo { width: 32px; height: 32px; margin: 0 6px; }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin-bottom: 14px; border: 0; border-radius: var(--r-sm); background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: var(--r-sm); color: var(--text); font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { background: var(--hover); }
  .nav-link[aria-current='page'] { font-weight: 500; }
  .nav-link[aria-current='page'] > svg { color: var(--accent); }
  .nav-link[aria-current='page']::before { content: ''; position: absolute; top: 8px; bottom: 8px; left: -12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-sep { height: 1px; margin: 10px 14px; background: var(--rule); }
  .side-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; margin-top: auto; padding: 0 8px; font-size: 14px; }
  .top, .tabs { display: none; }
  .content { padding: 32px 40px 48px; }
  .toast { bottom: 24px; }
}

/* ---------- Dialogs: a sheet on the phone, centered from 768 px ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: var(--scrim); }
.dialog { width: 100%; max-height: 92%; overflow: auto; padding: 20px 20px 24px; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-float); }
.dialog h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 1.3; }
.dialog p { margin-top: 10px; }
.dialog .field { margin-top: 18px; }
.dialog-actions { display: flex; flex-direction: column-reverse; gap: 8px; margin-top: 22px; }
.dialog-actions .btn { width: 100%; min-height: 48px; }
@container app (min-width: 768px) {
  .scrim { align-items: center; justify-content: center; }
  .dialog { width: 440px; border-radius: var(--r-lg); padding: 24px 28px 28px; }
  .dialog-actions { flex-direction: row; justify-content: flex-end; }
  .dialog-actions .btn { width: auto; min-height: 44px; }
}

/* ====================================================================================================== */
/* ---------- Variant 6 · Round 4: card rows, grouped links, action options ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 0 18px; }
.page-head h1 { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; margin-right: auto; }
.page-head .new-btn { order: 3; width: 100%; min-height: 52px; }
.lead { margin: 16px 0 14px; color: var(--muted); max-width: 560px; }
.n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; }

/* Tabs · pill: the Sign in / Create account switch */
.tabs-pill { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: var(--seg-bg); }
.app[data-scheme='dark'] .tabs-pill { background: #0d0e0f; }
.tabs-pill a { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
.tabs-pill a[aria-current='page'] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(15, 17, 20, .14); }
.app[data-scheme='dark'] .tabs-pill a[aria-current='page'] { background: #2e3035; box-shadow: none; }

/* Tabs · underline: text tabs with the sidebar's accent bar, under the open one */
.tabs-line { display: flex; gap: 24px; border-bottom: 1px solid var(--rule); }
.tabs-line a { position: relative; display: flex; align-items: center; gap: 8px; min-height: 48px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
.tabs-line a:hover { color: var(--text); }
.tabs-line a[aria-current='page'] { color: var(--text); }
.tabs-line a[aria-current='page']::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }

/* Tabs · title: the two names are the heading; the open one in text color, the other muted */
.tabs-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 22px; margin-right: auto; }
.tabs-title a { display: inline-flex; align-items: baseline; gap: 6px; min-height: 44px; padding-top: 4px; font-family: var(--font-display); font-weight: 300; font-size: 24px; line-height: 1.2; letter-spacing: -.01em; color: var(--muted); text-decoration: none; white-space: nowrap; }
.tabs-title a:hover { color: var(--text); }
.tabs-title a[aria-current='page'] { color: var(--text); }
.tabs-title .n { font-family: var(--font-text); font-size: 14px; }

/* Shared bits */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 20px; background: var(--active-bg); color: var(--accent); }
.tag-blocked { background: var(--error-bg); color: var(--error-text); }
.initials { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-weight: 500; font-size: 14px; }
[data-blocked] .initials { background: var(--error-bg); color: var(--error-text); }
.lic { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--rule); color: var(--muted); }
[data-waiting] .lic { border-color: transparent; background: var(--active-bg); color: var(--accent); }
.waiting { color: var(--accent); font-weight: 500; }
.blocked-text { color: var(--error); }
.name { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 500; }
.email { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% - 4px); z-index: 5; min-width: 220px; padding: 6px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--shadow-float); }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--text); cursor: pointer; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu .danger { color: var(--error); }
.legend { margin-top: 12px; color: var(--muted); font-size: 14px; }
.list { list-style: none; padding: 0; }

/* People · table (variant 1) */
.t-head { display: none; }
.t-row { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 2px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.table { border-top: 1px solid var(--text); }
.t-row .meta { grid-column: 1; color: var(--muted); font-size: 14px; }
.t-row .menu-wrap { grid-column: 2; grid-row: 1 / span 2; }
.t-row .cell { display: none; font-size: 14px; }
.t-row .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.t-row .who > div { min-width: 0; }
.table .initials, .table .lic { display: none; }

/* People · card rows: a light card per person, the table's columns inside */
.rows { display: grid; gap: 8px; }
.rows .t-row { padding: 14px 8px 14px 16px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); }

/* People · cards: a grid, everything on the card */
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.card { position: relative; padding: 18px; border: 1px solid var(--rule); border-radius: var(--r-lg); background: var(--surface); }
.card-top { display: flex; align-items: flex-start; gap: 12px; }
.card-top > div { flex: 1; min-width: 0; padding-top: 1px; }
.card-top > .menu-wrap { flex: none; min-width: 0; margin: -8px -8px 0 0; padding: 0; }
.card dl { margin: 14px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); }
.card dt, .card dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.card dt { color: var(--muted); padding-right: 12px; }
.card dd { text-align: right; overflow-wrap: anywhere; }

/* The new link in the dialog */
.link-card { margin-top: 16px; padding: 16px; border-radius: var(--r-lg); background: var(--tint); animation: rise 320ms cubic-bezier(.2, 0, 0, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .link-card { animation: none; } }
.link-card .who { font-family: var(--font-display); font-weight: 300; font-size: 17px; }
.link-card .control { margin-top: 10px; }
.link-card .control input { height: 48px; font-size: 14px; text-overflow: ellipsis; }
.link-card .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.link-card .btns .btn { min-height: 48px; padding: 0 12px; }

@container app (min-width: 768px) {
  .page-head { flex-wrap: nowrap; }
  .page-head .new-btn { order: 0; width: auto; min-height: 48px; }
  .tabs-pill { width: 360px; }
  .tabs-title a { font-size: 28px; }
  .t-head { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.3fr) 44px; gap: 16px; padding: 10px 0 8px; color: var(--muted); font-size: 13px; }
  .table .t-head { border-bottom: 1px solid var(--rule); }
  .rows-head { padding-left: 17px; padding-right: 9px; }
  .t-row { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.3fr) 44px; gap: 16px; min-height: 60px; padding: 10px 0; }
  .rows .t-row { padding: 12px 8px 12px 16px; min-height: 68px; }
  .t-row .meta { display: none; }
  .t-row .cell { display: block; }
  .t-row .menu-wrap { grid-column: auto; grid-row: auto; }
  .links .t-head, .links .t-row { grid-template-columns: minmax(0, 1.6fr) minmax(0, 2.2fr) minmax(0, 1fr) 44px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .dialog.dialog-wide { width: 480px; }
}
.card .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Variant 5 · round 3: search, the hide switch, compact list and grouped links ---------- */
.tabs-line { margin-top: 4px; }

/* Search: a visible label with the count on the same line, the field with a clear button */
.search { margin: 16px 0 14px; }
.search-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.search-top label { font-weight: 500; font-size: 14px; }
.search-top .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
/* The icon and the clear button sit in the row, not on top of the field */
.search-box { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 4px 0 14px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); }
.search-box:focus-within { border-color: var(--accent); outline: 1px solid var(--accent); }
.search-box .lead-ic { color: var(--muted); }
.search-box input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--text); font-size: 16px; outline: none; }
.search-box input::-webkit-search-cancel-button { display: none; }
.search-wrap { max-width: 420px; }
mark { background: var(--tint); color: inherit; border-radius: 3px; padding: 0 1px; }
.nobody { padding: 28px 0 8px; }
.nobody h2 { font-family: var(--font-display); font-weight: 300; font-size: 19px; line-height: 1.3; }
.nobody p { margin-top: 6px; color: var(--muted); }
.nobody .btn { margin-top: 14px; }

/* The hide switch */
.links-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; margin: 12px 0 10px; }
.links-top .lead { margin: 0; }
.switch-btn { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--text); cursor: pointer; font-size: 14px; }
.track { position: relative; width: 40px; height: 24px; flex: none; border-radius: 999px; background: var(--field-border); transition: background 160ms; }
.track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: transform 160ms; }
.switch-btn[aria-checked='true'] .track { background: var(--accent); }
.switch-btn[aria-checked='true'] .track::after { transform: translateX(16px); }
.hidden-note { margin-top: 10px; color: var(--muted); font-size: 14px; }

/* People · compact: one line per person on the desktop, light stripes like a spreadsheet */
.compact { border-top: 1px solid var(--rule); }
.compact .c-row { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 0 12px; align-items: center; min-height: 56px; padding: 6px 0 6px 4px; border-bottom: 1px solid var(--rule); }
.compact .c-row:nth-child(even) { background: var(--surface); }
.compact .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.compact .who > div { min-width: 0; }
.compact .initials { width: 28px; height: 28px; font-size: 12px; }
.compact .cell { display: none; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.compact .c-email { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-head { display: none; }

/* Links · grouped: waiting links as card rows, the rest as plain lists */
.group + .group { margin-top: 26px; }
.group-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.group-head h2 { font-family: var(--font-display); font-weight: 300; font-size: 17px; }
.group-head .n { font-size: 14px; }
.w-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 4px 14px; align-items: center; padding: 14px 8px 14px 16px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); }
.w-row + .w-row { margin-top: 8px; }
.w-row .left { grid-column: 2; color: var(--accent); font-weight: 500; font-size: 14px; }
.h-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.h-list { border-top: 1px solid var(--rule); }
.h-row .what { color: var(--muted); font-size: 14px; }
.h-row .when { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }

@container app (min-width: 768px) {
  .c-head { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1.8fr) minmax(0, 1.1fr) minmax(0, .9fr) minmax(0, 1fr) 44px; gap: 16px; padding: 10px 0 8px 4px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--rule); }
  .compact { border-top: 0; }
  .compact .c-row { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1.8fr) minmax(0, 1.1fr) minmax(0, .9fr) minmax(0, 1fr) 44px; gap: 16px; min-height: 48px; padding: 2px 0 2px 4px; }
  .compact .cell { display: block; }
  .compact .c-email { display: none; }
  .w-row { grid-template-columns: 40px minmax(0, 1fr) auto 44px; }
  .w-row .left { grid-column: auto; text-align: right; }
  .h-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 120px; }
  .h-row .when { text-align: right; }
}
.w-row .lic, .w-row .menu-wrap { grid-row: 1 / span 2; }
.w-row .menu-wrap { grid-column: 3; }
@container app (min-width: 768px) {
  .w-row .lic, .w-row .menu-wrap { grid-row: auto; grid-column: auto; }
}

/* ---------- Variant 6 · round 4: one corner system, no ⋯ menus, hidden link history ---------- */
/* Corners: text buttons, tabs, chips and nav items are pills; icon buttons circles; fields, rows, menus 12; dialogs 24 */
.icon-btn, .toggle { border-radius: 999px; }
.side-add, .nav-link { border-radius: 999px; }
.nav-link[aria-current='page']::before { left: -12px; }

/* People: card rows without the sign-in column */
.p-head { display: none; }
.p-list { display: grid; gap: 8px; list-style: none; padding: 0; }
.p-row { border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); }
.p-row[data-picked] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.p-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 8px 12px 16px; min-height: 68px; }
.p-main .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.p-main .who > div { min-width: 0; }
.p-main .meta { grid-column: 1; color: var(--muted); font-size: 14px; padding-left: 52px; }
.p-main .cell { display: none; font-size: 14px; }
.p-main .acts { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 4px; }
[data-actions='select'] .p-main { grid-template-columns: 44px minmax(0, 1fr); padding-left: 4px; }
[data-actions='select'] .p-main .meta { grid-column: 2; }
[data-actions='select'] .p-main .acts { display: none; }

/* Expand: the row opens to show its actions */
.p-row[data-clickable] .p-main { cursor: pointer; }
.p-row[data-clickable] .p-main:hover { background: var(--hover); border-radius: inherit; }
.chev { transition: transform 160ms; }
[aria-expanded='true'] > .chev { transform: rotate(180deg); }
.p-more { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 16px 14px 68px; }
.p-more p { flex: 1 1 100%; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
.p-more .btn { min-height: 44px; }
.btn-danger-outline { border-color: var(--error); color: var(--error); background: none; }
.btn-danger-outline:hover { background: var(--error-bg); }

/* Buttons: visible on every row; text on the desktop, circles on the phone */
.row-btn-text { display: none; }
.danger-ic { color: var(--error); }
.danger-ic:hover { color: var(--error); background: var(--error-bg); }

/* Select: a check box per row and one bar for the picked people */
.pick { display: grid; place-items: center; width: 44px; height: 44px; cursor: pointer; }
/* The whole 44 px square is the check box; the 20 px box is drawn inside it */
.pick input { appearance: none; position: relative; width: 44px; height: 44px; margin: 0; border: 0; border-radius: 12px; background: none; cursor: pointer; }
.pick input::before { content: ''; position: absolute; inset: 12px; border: 1.5px solid var(--field-border); border-radius: 6px; background: var(--surface); }
.pick input:checked::before { background: var(--accent); border-color: var(--accent); }
.pick input:checked::after { content: ''; position: absolute; left: 17px; top: 18px; width: 10px; height: 6px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg); }
.pick input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.bulk { position: sticky; bottom: 12px; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 16px; padding: 10px 10px 10px 18px; border-radius: 999px; background: var(--pill); color: var(--on-pill); box-shadow: var(--shadow-float); }
.bulk .what { margin-right: auto; font-weight: 500; }
.bulk .btn { min-height: 44px; padding: 0 16px; color: var(--on-pill); }
.bulk .btn:hover { background: rgba(127, 127, 127, .2); }
.bulk .btn-on-pill { background: var(--surface); color: var(--text); }
.bulk .btn-on-pill:hover { background: var(--hover); }

/* Invite links: the waiting ones always; the history behind disclosures or chips */
.w-row .btn { min-height: 44px; }
.disc { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 4px; border: 0; border-top: 1px solid var(--rule); background: none; color: var(--text); cursor: pointer; text-align: left; }
.disc:hover { background: var(--hover); }
.disc h2 { font-family: var(--font-display); font-weight: 300; font-size: 17px; }
.disc .n { font-size: 14px; margin-right: auto; }
.disc .hint { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--field-border); border-radius: 999px; background: var(--surface); color: var(--text); cursor: pointer; font-weight: 500; font-size: 14px; }
.chip[aria-pressed='true'] { background: var(--active-bg); border-color: var(--accent); color: var(--accent); }
.chip .n { color: inherit; opacity: .85; }
.history-note { margin-top: 18px; color: var(--muted); font-size: 14px; }

@container app (min-width: 768px) {
  .p-head { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1.2fr) var(--acts-w); gap: 16px; padding: 4px 9px 8px 17px; color: var(--muted); font-size: 13px; }
  .p-main { grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1.2fr) var(--acts-w); gap: 16px; }
  .p-main .meta { display: none; }
  .p-main .cell { display: block; }
  .p-main .acts { grid-column: auto; grid-row: auto; justify-content: flex-end; }
  [data-actions='select'] .p-head { grid-template-columns: 44px minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1.2fr); padding-left: 5px; }
  [data-actions='select'] .p-main { grid-template-columns: 44px minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1.2fr); }
  .row-btn-text { display: inline-flex; }
  .row-btn-ic { display: none; }
  .p-more { padding-left: 68px; }
}
.people-view { --acts-w: 44px; }
.people-view[data-actions='buttons'] { --acts-w: 210px; }

/* Waiting links: a visible Cancel link instead of a menu */
.w-row { grid-template-columns: 40px minmax(0, 1fr) auto; }
.w-row > .btn { grid-column: 3; grid-row: 1 / span 2; }
@container app (min-width: 768px) {
  .w-row { grid-template-columns: 40px minmax(0, 1fr) auto auto; }
  .w-row > .btn { grid-column: auto; grid-row: auto; }
}
/* Emails stay on one line in the rows */
.p-main .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The bar for picked people: a 24 px panel on the phone, a pill from 768 px */
.bulk { border-radius: var(--r-lg); padding: 8px 8px 8px 16px; }
.bulk .icon-btn { color: var(--on-pill); }
.bulk .icon-btn:hover { background: rgba(127, 127, 127, .2); color: var(--on-pill); }
@container app (min-width: 768px) { .bulk { border-radius: 999px; padding: 10px 10px 10px 18px; } }
/* On the phone the bar keeps one line: text-only buttons */
.bulk { flex-wrap: nowrap; gap: 6px; }
.bulk .btn { padding: 0 14px; }
.bulk .btn .ic { display: none; }
@container app (min-width: 768px) { .bulk { gap: 12px; } .bulk .btn .ic { display: block; } }
.wide-only { display: none; }
@container app (min-width: 768px) { .wide-only { display: inline; } }
</style>
</head>

  const used = all.filter((l) => l.status === 'used');
  const old = all.filter(isOld);
  const waitingHtml = `<section class="group" aria-labelledby="g-waiting"><div class="group-head"><h2 id="g-waiting">Waiting</h2><span class="n">${waiting.length}</span></div>${waiting.map(waitingRow).join('')}</section>`;
  if (picks.history === 'chips') {
    return `<div class="chips" role="group" aria-label="Show links">
        <button class="chip" type="button" aria-pressed="true" disabled>Waiting <span class="n">${waiting.length}</span></button>
        <button class="chip" type="button" data-action="toggle-used" aria-pressed="${state.showUsed}">Used <span class="n">${used.length}</span></button>
        <button class="chip" type="button" data-action="toggle-old" aria-pressed="${state.showOld}">Expired and cancelled <span class="n">${old.length}</span></button>
      </div>
      ${waitingHtml}
      ${state.showUsed ? `<section class="group" aria-labelledby="g-used"><div class="group-head"><h2 id="g-used">Used</h2><span class="n">${used.length}</span></div>${usedRows(used)}</section>` : ''}
      ${state.showOld ? `<section class="group" aria-labelledby="g-old"><div class="group-head"><h2 id="g-old">Expired and cancelled</h2><span class="n">${old.length}</span></div>${oldRows(old)}</section>` : ''}`;
  }
  const disc = (key, title, n, shown, rows) => `<section class="group">
      <button class="disc" type="button" data-action="toggle-${key}" aria-expanded="${shown}" aria-controls="g-${key}"><h2>${title}</h2><span class="n">${n}</span><span class="hint">${shown ? 'Hide' : 'Show'}</span>${icon('chevDown').replace('class="ic"', 'class="ic chev"')}</button>
      ${shown ? `<div id="g-${key}">${rows}</div>` : ''}
    </section>`;
  return `${waitingHtml}${disc('used', 'Used', used.length, state.showUsed, usedRows(used))}${disc('old', 'Expired and cancelled', old.length, state.showOld, oldRows(old))}`;
}

function peoplePage() {
  syncPreset();
  const links = state.page === 'people-links' || state.page === 'people-links-all';
  const all = state.page === 'people-link'
    ? [{ id: 'olena', note: 'For Olena', status: 'waiting', until: '19 Nov 2026', left: '7 days left', created: '12 Nov 2026' }, ...LINKS5]
    : LINKS5;
  const tabs = `<nav class="tabs-line" aria-label="People or invite links">
    <a href="#people" data-nav="people"${links ? '' : ' aria-current="page"'}>People <span class="n">${PEOPLE5.length}</span></a>
    <a href="#links" data-nav="people-links"${links ? ' aria-current="page"' : ''}>Invite links <span class="n">${all.filter((l) => l.status === 'waiting').length}</span></a>
  </nav>`;
  const body = links
    ? `<p class="lead">A link works once, for 7 days. Pup Budget shows a link only when you make it.</p><div id="links-list">${linksBody(all)}</div>`
    : `<div class="search"><div class="search-wrap">
        <div class="search-top"><label for="people-search">Search people</label><span class="count" id="people-count" aria-live="polite">${countText()}</span></div>
        <div class="search-box"><span class="lead-ic">${icon('search')}</span><input id="people-search" type="search" autocomplete="off" placeholder="Name or email" value="${esc(state.query)}" data-search>
          ${state.query ? `<button class="icon-btn clear" type="button" data-action="clear-search" aria-label="Clear search">${icon('x')}</button>` : ''}</div>
      </div></div>
      <div class="people-view" data-actions="${picks.actions}" id="people-list">${peopleList()}</div>
      <p class="legend">“Before invites” means the account was made while sign-up was open.</p>`;
  return shell(`<header class="page-head"><h1>People</h1><button class="btn btn-primary new-btn" type="button" data-nav="people-new">${icon('plus')}New invite link</button></header>
    ${tabs}${body}${dialog()}`);
}
const refreshPeople = () => { document.getElementById('people-list').innerHTML = peopleList(); };
const refreshLinks = () => { document.getElementById('links-list').innerHTML = linksBody(LINKS5); };

document.addEventListener('input', (e) => {
  if (!e.target.matches('[data-search]')) return;
  state.query = e.target.value;
  refreshPeople();
  document.getElementById('people-count').textContent = countText();
  const box = e.target.parentElement;
  const clear = box.querySelector('.clear');
  if (state.query && !clear) box.insertAdjacentHTML('beforeend', `<button class="icon-btn clear" type="button" data-action="clear-search" aria-label="Clear search">${icon('x')}</button>`);
  if (!state.query && clear) clear.remove();
});
document.addEventListener('change', (e) => {
  const id = e.target.dataset?.pick;
  if (!id) return;
  if (e.target.checked) state.picked.add(id); else state.picked.delete(id);
  refreshPeople();
  document.querySelector(`[data-pick="${id}"]`)?.focus();
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-block-set]');
  if (b) { const [id, o] = b.dataset.blockSet.split(':'); setBlock(id, o); return; }
  // In "Open the row" a click anywhere on the row opens it (buttons inside keep their own action)
  const row = e.target.closest('[data-row-toggle]');
  if (row && !e.target.closest('button, a, input')) { const id = row.dataset.rowToggle; state.open = state.open === id ? null : id; refreshPeople(); }
});

function dialog() {
  const many = picks.actions === 'select' && state.picked?.size > 1;
  if (state.page === 'people-new') {
    return `<div class="scrim"><div class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">New invite link</h2>
      <p class="muted">One person can create an account with it within 7 days.</p>
      <form novalidate data-form="new-link">
        ${field({ id: 'note', label: 'Who is it for? (optional, only you see it)', value: 'For Olena', extra: 'maxlength="60"' })}
        <div class="dialog-actions"><button class="btn btn-quiet" type="button" data-nav="people">Cancel</button><button class="btn btn-primary" type="submit">${icon('link')}Create link</button></div>
      </form>
    </div></div>`;
  }
  if (state.page === 'people-link') {
    return `<div class="scrim"><div class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Link for Olena is ready</h2>
      <div class="link-card">
        <p class="who">For Olena</p>
        <div class="control"><label class="sr" for="new-link">Invite link</label><input id="new-link" type="text" readonly value="${LINK}"></div>
        <div class="btns"><button class="btn btn-primary" type="button" data-action="copy">${icon(state.copied ? 'check' : 'copy')}${state.copied ? 'Copied' : 'Copy link'}</button><button class="btn btn-outline" type="button" data-action="share">${icon('share')}Share</button></div>
      </div>
      <p>Send it to Olena in any messenger. It works once, until <span class="num">19 Nov 2026</span>.</p>
      <p class="muted" style="font-size:14px">Copy it now: Pup Budget can’t show this link again. Lost it? Cancel it and make a new one.</p>
      <div class="dialog-actions"><button class="btn btn-quiet" type="button" data-nav="people-links">Done</button></div>
    </div></div>`;
  }
  if (state.page === 'people-block') {
    return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">${many ? `Block ${state.picked.size} people?` : 'Block Iryna Melnyk?'}</h2>
      <p>${many ? 'They are' : 'Iryna is'} signed out on every device and can’t sign in. Their data stays, and you can unblock them any time.</p>
      <div class="dialog-actions"><button class="btn btn-quiet" type="button" data-nav="people">Cancel</button><button class="btn btn-primary" type="button" data-action="do-block">${icon('ban')}Block</button></div>
    </div></div>`;
  }
  if (state.page === 'people-delete') {
    const ok = state.confirmText.trim().toLowerCase() === 'max.trial@example.com';
    return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Delete Max’s account?</h2>
      <p>This deletes the account and everything in it: accounts, transactions, categories and settings. It can’t be undone.</p>
      <p class="muted">To join again, Max would need a new invite link.</p>
      ${field({ id: 'confirm-email', label: 'Type max.trial@example.com to confirm', type: 'email', inputmode: 'email', value: state.confirmText, extra: 'data-confirm' })}
      <div class="dialog-actions"><button class="btn btn-quiet" type="button" data-nav="people">Cancel</button><button class="btn btn-danger" type="button" data-action="do-delete" data-delete="max.trial@example.com"${ok ? '' : ' disabled'}>${icon('trash')}Delete account</button></div>
    </div></div>`;
  }
  return '';
}

const VARIANT_ACTIONS = {
  'toggle-row': (a) => { const id = a.dataset.id; state.open = state.open === id ? null : id; refreshPeople(); document.querySelector(`[data-action="toggle-row"][data-id="${id}"]`)?.focus(); },
  'clear-picks': () => { state.picked.clear(); refreshPeople(); },
  'toggle-used': (a) => { state.showUsed = !state.showUsed; refreshLinks(); document.querySelector(`[data-action="${a.dataset.action}"]`)?.focus(); },
  'toggle-old': (a) => { state.showOld = !state.showOld; refreshLinks(); document.querySelector(`[data-action="${a.dataset.action}"]`)?.focus(); },
  'clear-search': () => { state.query = ''; render(); document.getElementById('people-search').focus(); },
};

// ---------- Render ----------
const RENDER = { invite: invitePage, 'invite-bad': inviteBadPage, closed: closedPage, 'google-closed': googleClosedPage };
function render() {
  app.innerHTML = (RENDER[state.page] ?? peoplePage)();
  document.querySelectorAll('[data-page-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pageSet === state.page)));
}
function go(id) { state.page = id; state.menu = null; state.copied = false; state.more = false; state.confirmText = ''; render(); }
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  app.appendChild(t); setTimeout(() => t.remove(), 2200);
}

// Preview bar (review aid)
document.body.insertAdjacentHTML('afterbegin', `<div class="pv-bar"><b>F-028 · ${DIRECTION.name}</b>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="tablet">Tablet</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Screen</span>${PAGES.map((p) => `<button data-page-set="${p.id}">${p.label}</button>`).join('')}</div>
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="notes" aria-expanded="false">About this direction</button>
  <div class="pv-notes" id="notes" hidden><b>${DIRECTION.name}</b><p style="margin:4px 0 0">${DIRECTION.thesis}</p><ul>${DIRECTION.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
setView(innerWidth >= 1200 ? 'desktop' : 'phone');

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const p = e.target.closest('[data-page-set]');
  if (p) { go(p.dataset.pageSet); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { state.schemePref = s.dataset.schemeSet; applyScheme(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (!a) { if (state.menu) { state.menu = null; render(); } return; }
  if (a.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  ({
    'toggle-pw': () => {
      const input = document.getElementById(a.getAttribute('aria-controls'));
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      a.setAttribute('aria-pressed', String(show));
      a.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      a.innerHTML = icon(show ? 'eyeOff' : 'eye');
    },
    menu: () => { state.menu = state.menu === a.dataset.id ? null : a.dataset.id; render(); },
    'ask-block': () => go('people-block'),
    'ask-delete': () => go('people-delete'),
    unblock: () => { go('people'); toast('Max can sign in again'); },
    'cancel-link': () => { go('people'); toast('Link cancelled'); },
    'do-block': () => { go('people'); toast('Iryna is blocked'); },
    'do-delete': () => { go('people'); toast('Max’s account is deleted'); },
    copy: () => { state.copied = true; render(); toast('Link copied'); },
    share: () => toast('Opens the phone’s share sheet (Telegram, Viber…)'),
    google: () => toast('Opens Google'),
    'add-tx': () => toast('Add transaction (F-018)'),
    more: () => { state.more = !state.more; render(); },
    'close-more': () => { state.more = false; render(); },
    ...VARIANT_ACTIONS,
    notes: () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; a.setAttribute('aria-expanded', String(!n.hidden)); },
  })[a.dataset.action]?.(a);
});
document.addEventListener('input', (e) => {
  if (!e.target.matches('[data-confirm]')) return;
  state.confirmText = e.target.value;
  const btn = document.querySelector('[data-delete]');
  btn.disabled = state.confirmText.trim().toLowerCase() !== btn.dataset.delete;
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const kind = e.target.dataset.form;
  if (kind === 'new-link') { go('people-link'); return; }
  toast(kind === 'signup' ? 'Account created' : 'Signed in');
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.getElementById('notes').hidden = true;
  if (state.menu || state.more) { state.menu = null; state.more = false; render(); }
  else if (state.page === 'people-block' || state.page === 'people-delete') go('people');
});
applyScheme();
render();
</script>
</body>
</html>
