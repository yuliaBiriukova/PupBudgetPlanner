<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-028 · Variant 2 · Receipt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Unbounded:wght@300&display=swap">
<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.pv-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.pv-bar button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pv-bar button:hover { background: #363c47; }
.pv-bar button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(480px, calc(100vw - 32px)); background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.pv-notes ul { margin: 6px 0 0; padding-left: 18px; }
.pv-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='tablet'] .frame { width: 834px; height: min(1050px, 100%); border: 12px solid #16181d; border-radius: 28px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
}

/* ---------- Tokens: the app's theme (F-010, F-011) plus a danger button and the sky tint for the new link ---------- */
.app {
  --bg: #f5f6f7; --surface: #fcfcfd; --sidebar: #ebedf0; --seg-bg: #ebedf0; --text: #1c1e21; --muted: #57585b;
  --rule: #d7d8d9; --hover: #e8e9ea; --field-border: #7c828a;
  --primary: #26292e; --primary-hover: #363a40; --on-primary: #f5f6f7;
  --accent: #2a62a3; --active-bg: #e7ecf1; --tint: #e7ecf1; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --hero: #26292e; --on-hero: #f5f6f7; --hero-muted: #b4b9bf; --hero-rule: #474c54;
  --error: #b3261e; --error-bg: #fbeceb; --error-text: #8c1d18;
  --danger: #b3261e; --danger-hover: #9c211a; --on-danger: #fcfcfd;
  --pill: #1c1e21; --on-pill: #f5f6f7; --focus: #2a62a3; --scrim: rgba(18, 19, 21, .45);
  --shadow-float: 0 8px 24px rgba(15, 17, 20, .1);
  --font-display: 'Unbounded', system-ui, sans-serif; --font-text: 'Manrope', system-ui, sans-serif;
  --r-sm: 12px; --r-lg: 24px;
}
.app[data-scheme='dark'] {
  --bg: #121315; --surface: #1b1c1e; --sidebar: #18191b; --seg-bg: #121315; --text: #e9eaec; --muted: #a4a5a7;
  --rule: #37383a; --hover: #26272a; --field-border: #71747b;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --active-bg: #262f37; --tint: #262f37; --logo: #8ec1ec; --logo-mark: #121315;
  --hero: #0b0c0d; --on-hero: #e9eaec; --hero-muted: #a4a5a7; --hero-rule: #2e3035;
  --error: #f2958c; --error-bg: #3a1d1b; --error-text: #f6b8b2;
  --danger: #f2958c; --danger-hover: #f6b8b2; --on-danger: #121315;
  --pill: #e9eaec; --on-pill: #121315; --focus: #8ec1ec; --scrim: rgba(0, 0, 0, .6);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p, ul) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }

/* Buttons and fields (the F-011 set) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 15px; text-decoration: none; white-space: nowrap; background: none; }
.btn-lg { min-height: 52px; font-size: 16px; width: 100%; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: var(--surface); color: var(--text); border-color: var(--field-border); }
.btn-outline:hover { background: var(--hover); }
.btn-danger { background: var(--danger); color: var(--on-danger); }
.btn-danger:hover { background: var(--danger-hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-quiet { color: var(--text); }
.btn-quiet:hover { background: var(--hover); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.field label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
.field .hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
.control { position: relative; display: flex; }
.control input { width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-size: 16px; min-width: 0; }
.control input:focus { outline: 1px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.control.has-toggle input { padding-right: 56px; }
.toggle { position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 10px; color: var(--muted); cursor: pointer; }
.text-link { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; background: none; border: 0; padding: 0; cursor: pointer; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--error-bg); color: var(--error-text); }
.banner .ic { margin-top: 2px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ''; flex: 1; border-top: 1px solid var(--rule); }
.toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 14px; z-index: 30; white-space: nowrap; }

/* ---------- Sign-in layout (F-011, variant 4) ---------- */
.auth { height: 100%; overflow: hidden auto; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; background: var(--surface); }
.hero { display: flex; flex-direction: column; padding: 24px 20px 48px; background: var(--hero); color: var(--on-hero); }
.hero-body { display: flex; flex-direction: column; }
.logo { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.wordmark { font-family: var(--font-display); font-weight: 300; font-size: 30px; line-height: 1.1; letter-spacing: -.01em; margin-top: 16px; white-space: nowrap; }
.about { display: none; }
.form-side { position: relative; margin-top: -24px; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 20px 16px 32px; }
.form-wrap { width: 100%; max-width: 400px; margin: 0 auto; }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: var(--seg-bg); }
.seg a { display: grid; place-items: center; min-height: 44px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 500; }
.seg a[aria-current='page'] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(15, 17, 20, .14); }
.app[data-scheme='dark'] .seg a[aria-current='page'] { background: #2e3035; box-shadow: none; }
.auth form { margin-top: 20px; display: grid; gap: 20px; }
.auth-foot { margin-top: 12px; text-align: center; color: var(--muted); }
@container app (min-width: 900px) {
  .auth { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: stretch; min-height: 100%; }
  .hero { padding: 40px 56px; min-height: 100%; }
  .hero-body { margin: auto 0; max-width: 480px; }
  .logo { width: 56px; height: 56px; }
  .wordmark { font-size: 48px; margin-top: 24px; }
  .about { display: block; color: var(--hero-muted); margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--hero-rule); max-width: 420px; }
  .form-side { margin-top: 0; border-radius: 0; min-height: 100%; display: flex; flex-direction: column; justify-content: safe center; padding: 40px 48px; }
}

/* ---------- App shell (F-010): top bar and tab bar on the phone, sidebar from 768 px ---------- */
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
.column { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { display: flex; flex: none; align-items: center; gap: 10px; height: 56px; padding: 0 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand .logo { width: 32px; height: 32px; }
.brand-name { font-family: var(--font-display); font-size: 15px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
.main { flex: 1; min-height: 0; overflow: hidden auto; }
.content { max-width: 960px; margin: 0 auto; padding: 8px 16px 32px; }
.tabs { display: flex; flex: none; align-items: center; gap: 2px; padding: 8px 8px 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.tab { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; color: var(--muted); font-size: 13px; text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab[data-active] { width: auto; padding: 0 14px 0 12px; background: var(--active-bg); color: var(--accent); font-weight: 500; }
.tab:not([data-active]) .tab-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tab-add { display: grid; place-items: center; width: 52px; height: 52px; margin-left: auto; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
@container app (min-width: 768px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-right: 1px solid var(--rule); background: var(--sidebar); min-width: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; height: 44px; margin-bottom: 12px; padding: 0 2px; }
  .side-head .logo { width: 32px; height: 32px; margin: 0 6px; }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin-bottom: 14px; border: 0; border-radius: var(--r-sm); background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: var(--r-sm); color: var(--text); font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { background: var(--hover); }
  .nav-link[aria-current='page'] { font-weight: 500; }
  .nav-link[aria-current='page'] > svg { color: var(--accent); }
  .nav-link[aria-current='page']::before { content: ''; position: absolute; top: 8px; bottom: 8px; left: -12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-sep { height: 1px; margin: 10px 14px; background: var(--rule); }
  .side-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; margin-top: auto; padding: 0 8px; font-size: 14px; }
  .top, .tabs { display: none; }
  .content { padding: 32px 40px 48px; }
  .toast { bottom: 24px; }
}

/* ---------- Dialogs: a sheet on the phone, centered from 768 px ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: var(--scrim); }
.dialog { width: 100%; max-height: 92%; overflow: auto; padding: 20px 20px 24px; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-float); }
.dialog h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 1.3; }
.dialog p { margin-top: 10px; }
.dialog .field { margin-top: 18px; }
.dialog-actions { display: flex; flex-direction: column-reverse; gap: 8px; margin-top: 22px; }
.dialog-actions .btn { width: 100%; min-height: 48px; }
@container app (min-width: 768px) {
  .scrim { align-items: center; justify-content: center; }
  .dialog { width: 440px; border-radius: var(--r-lg); padding: 24px 28px 28px; }
  .dialog-actions { flex-direction: row; justify-content: flex-end; }
  .dialog-actions .btn { width: auto; min-height: 44px; }
}

/* ====================================================================================================== */
/* ---------- Variant 2 · Receipt: invitations as paper receipts with a torn edge; people as a plain list ---------- */
.app { --paper: #fcfcfd; --paper-rule: #c9cbce; --stamp: #b3261e; }
.app[data-scheme='dark'] { --paper: #232427; --paper-rule: #45474b; --stamp: #f2958c; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; padding: 8px 0 28px; }
.page-head h1 { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; }
.page-head p { margin-top: 8px; color: var(--muted); max-width: 520px; }
.page-head .grow { flex: 1 1 280px; }
.page-head .btn { flex: 1 1 100%; }
.section + .section { margin-top: 36px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.section-head h2 { font-family: var(--font-display); font-weight: 300; font-size: 17px; }
.section-head .count { color: var(--muted); }

/* The receipt: paper, a dashed rule between lines, a torn bottom edge (mask) and a soft shadow (on the wrapper) */
.receipt-wrap { filter: drop-shadow(0 1px 1px rgba(15, 17, 20, .14)) drop-shadow(0 6px 14px rgba(15, 17, 20, .07)); }
.app[data-scheme='dark'] .receipt-wrap { filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .5)); }
.receipt { --z: 7px; position: relative; padding: 16px 18px calc(18px + var(--z)); border-radius: 10px 10px 0 0; background: var(--paper); color: var(--text);
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--z)) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(2 * var(--z)) var(--z) repeat-x;
  mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--z)) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(2 * var(--z)) var(--z) repeat-x; }
.receipt-title { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 300; font-size: 17px; line-height: 1.3; }
.receipt-title .ic { color: var(--accent); }
.receipt dl { margin: 12px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); }
.receipt dt, .receipt dd { margin: 0; padding: 7px 0; border-top: 1px dashed var(--paper-rule); font-size: 14px; }
.receipt dt { color: var(--muted); padding-right: 12px; }
.receipt dd { text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.receipt[data-void] dd { text-decoration: line-through; color: var(--muted); }
.stamp { position: absolute; right: 14px; top: 10px; padding: 2px 12px; border: 2px solid var(--stamp); border-radius: 8px; color: var(--stamp); font-family: var(--font-display); font-weight: 300; font-size: 17px; transform: rotate(-8deg); background: var(--paper); }

/* On the sign-in screens: the receipt on the charcoal half */
.hero .receipt-wrap { margin-top: 18px; max-width: 360px; }
.hero .receipt { padding: 12px 14px calc(14px + var(--z)); }
.hero .receipt dl { margin-top: 8px; }
.hero .receipt dt, .hero .receipt dd { padding: 5px 0; }
.form-title { font-family: var(--font-display); font-weight: 300; font-size: 22px; line-height: 1.3; }
@container app (min-width: 900px) {
  .hero .receipt-wrap { margin-top: 32px; }
  .hero .receipt { padding: 18px 20px calc(20px + var(--z)); }
  .hero .receipt dt, .hero .receipt dd { padding: 8px 0; }
}

/* The links: a strip on the phone, a grid on the desktop */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 248px; gap: 14px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 12px; scroll-snap-type: x mandatory; list-style: none; }
.strip > li { scroll-snap-align: start; }
.strip .receipt-wrap, .strip .receipt { height: 100%; }
.receipt .btn { min-height: 44px; margin: 8px 0 -6px -12px; padding: 0 12px; }
.receipt[data-old] .receipt-title, .receipt[data-old] .receipt-title .ic { color: var(--muted); }
.waiting { color: var(--accent); font-weight: 500; }

/* People: a plain list with initials */
.people { list-style: none; padding: 0; border-top: 1px solid var(--rule); }
.person { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.initials { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-weight: 500; font-size: 14px; }
.person[data-blocked] .initials { background: var(--error-bg); color: var(--error-text); }
.person .name { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 500; }
.person .sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.person .side-meta { display: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 20px; background: var(--active-bg); color: var(--accent); }
.tag-blocked { background: var(--error-bg); color: var(--error-text); }
.menu { position: absolute; right: 0; top: calc(100% - 8px); z-index: 5; min-width: 220px; padding: 6px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--shadow-float); }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--text); cursor: pointer; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu .danger { color: var(--error); }

/* The new link in the dialog: printed out of a slot */
.slot { height: 6px; margin: 18px 6px 0; border-radius: 3px; background: var(--primary); }
.printer { overflow: hidden; margin: -3px 14px 0; padding: 0 6px 14px; }
.printer .receipt-wrap { animation: print 520ms cubic-bezier(.2, 0, 0, 1); }
@keyframes print { from { transform: translateY(-100%); } }
@media (prefers-reduced-motion: reduce) { .printer .receipt-wrap { animation: none; } }
.printer .control input { height: 48px; font-size: 14px; text-overflow: ellipsis; }
.printer .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.printer .btns .btn { min-height: 48px; margin: 0; padding: 0 12px; }

@container app (min-width: 768px) {
  .page-head .btn { flex: none; }
  .strip { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); overflow: visible; margin: 0; padding: 4px 0 0; }
  .person { grid-template-columns: 40px minmax(0, 1fr) minmax(0, 220px) 44px; }
  .person .side-meta { display: block; color: var(--muted); font-size: 14px; }
  .dialog.dialog-wide { width: 480px; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame">
    <div class="app" id="app" data-scheme="light"></div>
  </div>
</div>

<script>
const DIRECTION = {
  name: 'Variant 2 · Receipt',
  thesis: 'An invitation is a receipt: printed for one person, valid once and until a date. The invitee sees it on the charcoal half; the owner sees the links as a row of receipts. Takes a risk: a real-world object in a quiet app.',
  notes: [

      <p class="muted">One person can create an account with it within 7 days.</p>
      <form novalidate data-form="new-link">
        ${field({ id: 'note', label: 'Who is it for? (optional, only you see it)', value: 'For Olena', extra: 'maxlength="60"' })}
        <div class="dialog-actions"><button class="btn btn-quiet" type="button" data-nav="people">Cancel</button><button class="btn btn-primary" type="submit">${icon('link')}Create link</button></div>
      </form>
    </div></div>`;
  }
  if (state.page === 'people-link') {
    return `<div class="scrim"><div class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Your invite link</h2>
      <div class="slot" aria-hidden="true"></div>
      <div class="printer"><div class="receipt-wrap"><div class="receipt">
        <p class="receipt-title">${icon('ticket')}For Olena</p>
        <dl><dt>Valid until</dt><dd>19 Nov 2026</dd><dt>Works</dt><dd>Once</dd></dl>
        <div class="control" style="margin-top:10px"><label class="sr" for="new-link">Invite link</label><input id="new-link" type="text" readonly value="${LINK}"></div>
        <div class="btns"><button class="btn btn-primary" type="button" data-action="copy">${icon(state.copied ? 'check' : 'copy')}${state.copied ? 'Copied' : 'Copy'}</button><button class="btn btn-outline" type="button" data-action="share">${icon('share')}Share</button></div>
      </div></div></div>
      <p class="muted" style="font-size:14px">Send it to Olena in any messenger. Copy it now: Pup Budget can’t show this link again.</p>
      <div class="dialog-actions"><button class="btn btn-quiet" type="button" data-nav="people">Done</button></div>
    </div></div>`;
  }
  if (state.page === 'people-block') {
    return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Block Iryna Melnyk?</h2>
      <p>Iryna is signed out on every device and can’t sign in. Their data stays, and you can unblock them any time.</p>
      <div class="dialog-actions"><button class="btn btn-quiet" type="button" data-nav="people">Cancel</button><button class="btn btn-primary" type="button" data-action="do-block">${icon('ban')}Block</button></div>
    </div></div>`;
  }
  if (state.page === 'people-delete') {
    const ok = state.confirmText.trim().toLowerCase() === 'max.trial@example.com';
    return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Delete Max’s account?</h2>
      <p>This deletes the account and everything in it: accounts, transactions, categories and settings. It can’t be undone.</p>
      <p class="muted">To join again, Max would need a new invite link.</p>
      ${field({ id: 'confirm-email', label: 'Type max.trial@example.com to confirm', type: 'email', inputmode: 'email', value: state.confirmText, extra: 'data-confirm' })}
      <div class="dialog-actions"><button class="btn btn-quiet" type="button" data-nav="people">Cancel</button><button class="btn btn-danger" type="button" data-action="do-delete" data-delete="max.trial@example.com"${ok ? '' : ' disabled'}>${icon('trash')}Delete account</button></div>
    </div></div>`;
  }
  return '';
}

const VARIANT_ACTIONS = {};

// ---------- Render ----------
const RENDER = { invite: invitePage, 'invite-bad': inviteBadPage, closed: closedPage, 'google-closed': googleClosedPage };
function render() {
  app.innerHTML = (RENDER[state.page] ?? peoplePage)();
  document.querySelectorAll('[data-page-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pageSet === state.page)));
}
function go(id) { state.page = id; state.menu = null; state.copied = false; state.more = false; state.confirmText = ''; render(); }
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  app.appendChild(t); setTimeout(() => t.remove(), 2200);
}

// Preview bar (review aid)
document.body.insertAdjacentHTML('afterbegin', `<div class="pv-bar"><b>F-028 · ${DIRECTION.name}</b>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="tablet">Tablet</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Screen</span>${PAGES.map((p) => `<button data-page-set="${p.id}">${p.label}</button>`).join('')}</div>
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="notes" aria-expanded="false">About this direction</button>
  <div class="pv-notes" id="notes" hidden><b>${DIRECTION.name}</b><p style="margin:4px 0 0">${DIRECTION.thesis}</p><ul>${DIRECTION.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
setView(innerWidth >= 1200 ? 'desktop' : 'phone');

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const p = e.target.closest('[data-page-set]');
  if (p) { go(p.dataset.pageSet); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { state.schemePref = s.dataset.schemeSet; applyScheme(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (!a) { if (state.menu) { state.menu = null; render(); } return; }
  if (a.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  ({
    'toggle-pw': () => {
      const input = document.getElementById(a.getAttribute('aria-controls'));
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      a.setAttribute('aria-pressed', String(show));
      a.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      a.innerHTML = icon(show ? 'eyeOff' : 'eye');
    },
    menu: () => { state.menu = state.menu === a.dataset.id ? null : a.dataset.id; render(); },
    'ask-block': () => go('people-block'),
    'ask-delete': () => go('people-delete'),
    unblock: () => { go('people'); toast('Max can sign in again'); },
    'cancel-link': () => { go('people'); toast('Link cancelled'); },
    'do-block': () => { go('people'); toast('Iryna is blocked'); },
    'do-delete': () => { go('people'); toast('Max’s account is deleted'); },
    copy: () => { state.copied = true; render(); toast('Link copied'); },
    share: () => toast('Opens the phone’s share sheet (Telegram, Viber…)'),
    google: () => toast('Opens Google'),
    'add-tx': () => toast('Add transaction (F-018)'),
    more: () => { state.more = !state.more; render(); },
    'close-more': () => { state.more = false; render(); },
    ...VARIANT_ACTIONS,
    notes: () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; a.setAttribute('aria-expanded', String(!n.hidden)); },
  })[a.dataset.action]?.(a);
});
document.addEventListener('input', (e) => {
  if (!e.target.matches('[data-confirm]')) return;
  state.confirmText = e.target.value;
  const btn = document.querySelector('[data-delete]');
  btn.disabled = state.confirmText.trim().toLowerCase() !== btn.dataset.delete;
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const kind = e.target.dataset.form;
  if (kind === 'new-link') { go('people-link'); return; }
  toast(kind === 'signup' ? 'Account created' : 'Signed in');
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.getElementById('notes').hidden = true;
  if (state.menu || state.more) { state.menu = null; state.more = false; render(); }
  else if (state.page === 'people-block' || state.page === 'people-delete') go('people');
});
applyScheme();
render();
</script>
</body>
</html>
