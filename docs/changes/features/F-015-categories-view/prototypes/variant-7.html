<title>F-015 · Variant 7 · Tags in groups that fold, in the menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.pv-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.pv-bar button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pv-bar button:hover { background: #363c47; }
.pv-bar button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(480px, calc(100vw - 32px)); background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.pv-notes ul { margin: 6px 0 0; padding-left: 18px; }
.pv-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='tablet'] .frame { width: 834px; height: min(1050px, 100%); border: 12px solid #16181d; border-radius: 28px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
}

/* ---------- Tokens: the app's theme (F-010, F-011, F-028, F-014) ---------- */
.app {
  --bg: #f5f6f7; --surface: #fcfcfd; --sidebar: #ebedf0; --seg-bg: #ebedf0; --text: #1c1e21; --muted: #57585b;
  --rule: #d7d8d9; --hover: #e8e9ea; --field-border: #7c828a;
  --primary: #26292e; --primary-hover: #363a40; --on-primary: #f5f6f7;
  --accent: #2a62a3; --active-bg: #e7ecf1; --tint: #e7ecf1; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --error: #b3261e; --error-bg: #fbeceb; --error-text: #8c1d18;
  --expense: #b3261e; --income: #1f7a4d; --income-bg: #e4f1ea; --expense-bg: #fbeceb;
  --pill: #1c1e21; --on-pill: #f5f6f7; --focus: #26292e; --scrim: rgba(18, 19, 21, .45);
  --shadow-float: 0 8px 24px rgba(15, 17, 20, .1);
  --font-display: 'Unbounded', system-ui, sans-serif; --font-text: 'Manrope', system-ui, sans-serif;
  --r-sm: 12px; --r-lg: 24px;
}
.app[data-scheme='dark'] {
  --bg: #121315; --surface: #1b1c1e; --sidebar: #18191b; --seg-bg: #121315; --text: #e9eaec; --muted: #a4a5a7;
  --rule: #37383a; --hover: #26272a; --field-border: #71747b;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --active-bg: #262f37; --tint: #262f37; --logo: #8ec1ec; --logo-mark: #121315;
  --error: #f2958c; --error-bg: #3a1d1b; --error-text: #f6b8b2;
  --expense: #f2958c; --income: #7fd1a4; --income-bg: #1b2d23; --expense-bg: #3a1d1b;
  --pill: #e9eaec; --on-pill: #121315; --focus: #e9eaec; --scrim: rgba(0, 0, 0, .6);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p, ul, ol, dl, dd) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.list { list-style: none; padding: 0; margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 15px; text-decoration: none; white-space: nowrap; background: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.text-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--accent); font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 14px; z-index: 30; white-space: nowrap; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--tint); color: var(--text); }
.banner .ic { margin-top: 2px; color: var(--accent); }
.banner-error { background: var(--error-bg); color: var(--error-text); }
.banner-error .ic { color: var(--error-text); }
/* "Comes later": a quiet line with an info icon, no box */
.later { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 14px; }
.later .ic { margin-top: 2px; }

/* ---------- App shell (F-010): top bar and tab bar on the phone, sidebar from 768 px ---------- */
.logo { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
.column { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { display: flex; flex: none; align-items: center; gap: 10px; height: 56px; padding: 0 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand .logo { width: 32px; height: 32px; }
.brand-name { font-family: var(--font-display); font-size: 15px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
.main { flex: 1; min-height: 0; overflow: hidden auto; position: relative; }
.content { max-width: 1040px; margin: 0 auto; padding: 8px 16px 32px; }
.tabs { display: flex; flex: none; align-items: center; gap: 2px; padding: 8px 8px 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.tab { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; color: var(--muted); font-size: 13px; text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab[data-active] { width: auto; padding: 0 14px 0 12px; background: var(--active-bg); color: var(--accent); font-weight: 500; }
.tab:not([data-active]) .tab-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tab-add { display: grid; place-items: center; width: 52px; height: 52px; margin-left: auto; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
@container app (min-width: 768px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-right: 1px solid var(--rule); background: var(--sidebar); min-width: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; height: 44px; margin-bottom: 12px; padding: 0 2px; }
  .side-head .logo { width: 32px; height: 32px; margin: 0 6px; }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin-bottom: 14px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 999px; color: var(--text); font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { background: var(--hover); }
  .nav-link[aria-current='page'] { font-weight: 500; }
  .nav-link[aria-current='page'] > svg { color: var(--accent); }
  .nav-link[aria-current='page']::before { content: ''; position: absolute; top: 8px; bottom: 8px; left: -12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-sep { height: 1px; margin: 10px 14px; background: var(--rule); }
  .side-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; margin-top: auto; padding: 0 8px; font-size: 14px; }
  .top, .tabs { display: none; }
  .content { padding: 32px 40px 48px; }
  .toast { bottom: 24px; }
}

/* ---------- Page head ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 0 18px; }
.page-head h1 { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; margin-right: auto; }

/* ---------- The More sheet on the phone (F-010, I-012 spacing) ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: var(--scrim); }
.dialog { display: flex; flex-direction: column; width: 100%; max-height: 92%; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-float); overflow: hidden; }
.dlg-head { position: relative; padding: 16px 64px 0 16px; }
.dlg-x { position: absolute; top: 8px; right: 8px; }
.dlg-head h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 28px; }
.dlg-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 16px; }
.more-link { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 12px; border-radius: 12px; color: var(--text); text-decoration: none; }
.more-link:hover { background: var(--hover); }
.more-link[aria-current='page'] { background: var(--active-bg); color: var(--accent); font-weight: 500; }

/* ---------- States shared by all variants ---------- */
.sk { display: block; height: 14px; border-radius: 6px; background: var(--hover); }
.state-box { max-width: 460px; padding: 32px 0 8px; }
.state-box h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 1.3; }
.state-box p { margin-top: 8px; color: var(--muted); }
.state-box .btn { margin-top: 18px; }
/* ====================================================================================================== */
/* ---------- Round 2 (variants 4–6): variant 2's place in Settings and its list of groups on the desktop ---------- */
.r2-back { margin: 0 0 -4px -4px; padding: 0 8px 0 4px; }
.r2-intro { margin: -8px 0 20px; color: var(--muted); }
.r2-label { display: flex; justify-content: space-between; gap: 12px; padding: 20px 12px 6px; color: var(--muted); font-size: 14px; }
.r2-btn { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 8px 10px 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--text); text-align: left; cursor: pointer; }
.r2-btn:hover { background: var(--hover); }
.r2-btn[aria-current='true'] { background: var(--active-bg); }
.r2-btn[aria-current='true'] .r2-name { color: var(--accent); }
.r2-btn[aria-current='true']::before { content: ''; position: absolute; top: 12px; bottom: 12px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.r2-btn > .ic { color: var(--muted); }
.r2-txt { display: grid; flex: 1; min-width: 0; }
.r2-name { font-weight: 500; font-size: 16px; }
.r2-prev { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r2-index .list li + li { margin-top: 2px; }
.r2-index .r2-label:first-child { padding-top: 0; }
.r2-md { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 40px; align-items: start; }
.r2-kind { display: flex; gap: 8px; align-items: baseline; color: var(--muted); font-size: 14px; }
.r2-kind b { font-weight: 500; }
[data-kind='income'] .r2-kind b, .r2-kind[data-kind='income'] b { color: var(--income); }
[data-kind='expense'] .r2-kind b, .r2-kind[data-kind='expense'] b { color: var(--expense); }
.r2-title { margin-top: 4px; font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.2; letter-spacing: -.02em; }
.r2-foot { margin-top: 32px; }
/* The moment of variants 4 and 5: what you picked comes in from the side */
@keyframes r2-in { from { opacity: 0; transform: translateX(12px); } }
.r2-anim { animation: r2-in 180ms ease-out; }
@media (prefers-reduced-motion: reduce) { .r2-anim { animation: none; } }
/* Tags (variant 3's, quieter): not buttons, no border, no pointer; income tags carry the income color */
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags li { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--seg-bg); color: var(--text); font-size: 14px; }
.app[data-scheme='dark'] .tags li { background: #26272a; }
[data-kind='income'] .tags li { background: var(--income-bg); color: var(--income); }
.app[data-scheme='dark'] [data-kind='income'] .tags li { background: var(--income-bg); }

/* The Settings page (F-016 designs the rest; here only the row that leads to Categories) */
.r2-set { border-top: 1px solid var(--rule); }
.r2-set li { border-bottom: 1px solid var(--rule); }
.r2-set .row { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 10px 8px 10px 12px; border-radius: var(--r-sm); color: var(--text); text-decoration: none; }
.r2-set a.row:hover { background: var(--hover); }
.r2-set .row > .ic { color: var(--muted); }
.r2-set .row .r2-txt { flex: 1; }
.r2-set .val { color: var(--muted); font-size: 14px; }
.r2-set .row[aria-disabled='true'] { color: var(--muted); }
/* ---------- Variant 7 · Variant 5 with groups that fold, and its own menu item ---------- */
.v7-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 16px; margin: -8px 0 8px; color: var(--muted); }
.v7-kind-label { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; padding: 4px 0 8px; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
.v7-grp { padding: 8px 0 16px; }
.v7-grp[data-closed] { padding-bottom: 8px; }
.v7-grp + .v7-grp { border-top: 1px solid var(--rule); }
.v7-kind-label + .v7-grp { padding-top: 8px; }
.v7-h { font: inherit; }
/* The group's row is the button: the name, the count and the arrow; its text lines up with the tags under it */
.v7-btn { display: flex; align-items: center; gap: 12px; width: calc(100% + 16px); min-height: 52px; margin: 0 -8px; padding: 6px 8px; border: 0; border-radius: var(--r-sm); background: none; color: var(--text); text-align: left; cursor: pointer; }
.v7-btn:hover { background: var(--hover); }
.v7-btn .r2-txt { flex: 1; }
.v7-btn .n { color: var(--muted); font-size: 14px; }
.v7-btn .chev { color: var(--muted); transition: transform 160ms ease-out; }
.v7-btn[aria-expanded='false'] .chev { transform: rotate(-90deg); }
.v7-grp .tags { margin-top: 6px; }
/* The one moment: a group's tags come out of its row when it opens */
@keyframes v7-open { from { opacity: 0; transform: translateY(-4px); } }
.v7-grp .tags.v7-anim { animation: v7-open 160ms ease-out; }
@media (prefers-reduced-motion: reduce) { .v7-grp .tags.v7-anim { animation: none; } .v7-btn .chev { transition: none; } }
/* Desktop: variant 5 as it was: the list of groups, the picked group's tags bigger on the right */
.v5-detail .tags { margin-top: 20px; gap: 10px; }
.v5-detail .tags li { min-height: 44px; padding: 0 18px; font-size: 16px; }
</style>
</head>

</div>

  coins: ['M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0', 'M14.8 9a2 2 0 0 0 -1.8 -1h-2a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4h-2a2 2 0 0 1 -1.8 -1', 'M12 7v10'],
  moon: ['M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z'],
};
const icon = (n, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n].map((d) => `<path d="${d}"/>`).join('')}</svg>`;
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// ---------- Data: the default set every person gets (F-013, PRODUCT.md "Default categories"), in report order ----------
const GROUPS = [
  { id: 'income', name: 'Income', kind: 'income', cats: ['Salary', 'Gifts', 'Other'] },
  { id: 'home', name: 'Home expenses', kind: 'expense', cats: ['Rent', 'Bills', 'Home supplies', 'Electronics', 'Bank commission', 'Gifts', 'Tax', 'Delivery', 'Other'] },
  { id: 'daily', name: 'Daily living', kind: 'expense', cats: ['Groceries', 'Clothing', 'Eating out', 'Transportation', 'Salon/Barber', 'Sport'] },
  { id: 'health', name: 'Health', kind: 'expense', cats: ['Doctor/Dentist', 'Medicine/Drugs/Skincare', 'Emergency', 'Therapy'] },
  { id: 'education', name: 'Education', kind: 'expense', cats: ['English lessons', 'Piano lessons', 'Driving'] },
  { id: 'fun', name: 'Entertainment', kind: 'expense', cats: ['Activities', 'Books', 'Games', 'Hobbies', 'Vacation'] },
  { id: 'subs', name: 'Subscriptions', kind: 'expense', cats: ['Spotify', 'Phone', 'Subscriptions'] },
];
const ALL = GROUPS.reduce((n, g) => n + g.cats.length, 0);
const cats = (n) => (n === 1 ? '1 category' : `${n} categories`);
const groupsOf = (kind) => GROUPS.filter((g) => g.kind === kind);
const countOf = (kind) => groupsOf(kind).reduce((n, g) => n + g.cats.length, 0);
const LATER = 'Adding your own categories, renaming and removing them come after the first release.';

const app = document.getElementById('app');
const stage = document.getElementById('stage');
const mq = matchMedia('(prefers-color-scheme: dark)');
const state = { page: 'categories', schemePref: 'light', more: false };

function applyScheme() {
  const scheme = state.schemePref === 'system' ? (mq.matches ? 'dark' : 'light') : state.schemePref;
  app.dataset.scheme = scheme;
  document.querySelectorAll('[data-scheme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.schemeSet === state.schemePref)));
}
mq.addEventListener('change', applyScheme);

// ---------- Shell ----------
function shell(inner) {
  const nav = V.NAV;
  const cur = V.current();
  const tabs = nav.slice(0, 3);
  const moreActive = !tabs.some(([, l]) => l === cur);
  return `<div class="shell">
    <aside class="side" aria-label="Sections">
      <div class="side-head"><span class="logo" aria-hidden="true">${icon('stack', 20)}</span><span class="brand-name">Pup Budget</span></div>
      <button class="side-add" type="button" data-action="add-tx">${icon('plus')}Add transaction</button>
      <nav class="nav" aria-label="Main">
        ${nav.map(([i, l]) => `<a class="nav-link" href="#${l.toLowerCase()}"${l === cur ? ' aria-current="page"' : ''} data-action="nav" data-to="${l}">${icon(i)}${l}</a>`).join('')}
        <div class="nav-sep" role="presentation"></div>
        <a class="nav-link" href="#people" data-action="nav" data-to="People">${icon('people')}People</a>
      </nav>
      <div class="side-foot"><span class="avatar" aria-hidden="true">YB</span><span>Yulia Biriukova</span></div>
    </aside>
    <div class="column">
      <header class="top"><div class="brand"><span class="logo" aria-hidden="true">${icon('stack', 20)}</span><span class="brand-name">Pup Budget</span></div><span class="avatar" aria-hidden="true">YB</span></header>
      <main class="main" tabindex="0"><div class="content">${inner}</div></main>
      <nav class="tabs" aria-label="Main">
        ${tabs.map(([i, l]) => `<a class="tab" href="#${l.toLowerCase()}"${l === cur ? ' data-active aria-current="page"' : ''} data-action="nav" data-to="${l}">${icon(i)}<span class="tab-label">${l}</span></a>`).join('')}
        <button class="tab" type="button" data-action="more" aria-expanded="${state.more}"${moreActive ? ' data-active' : ''}>${icon('dots')}<span class="tab-label">More</span></button>
        <button class="tab-add" type="button" data-action="add-tx" aria-label="Add transaction">${icon('plus', 24)}</button>
      </nav>
    </div>
  </div>`;
}
function moreSheet() {
  if (!state.more) return '';
  const cur = V.current();
  const items = [...V.NAV.slice(3), ['people', 'People']];
  return `<div class="scrim" data-action="close-more"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="more-title" data-stop><div class="dlg-head"><button class="icon-btn dlg-x" type="button" data-action="close-more" aria-label="Close">${icon('x')}</button><h2 id="more-title">More</h2></div><div class="dlg-body">
    <ul class="list">${items.map(([i, l]) => `<li><a class="more-link" href="#${l.toLowerCase()}" data-action="nav" data-to="${l}"${l === cur ? ' aria-current="page"' : ''}>${icon(i)}${l}</a></li>`).join('')}</ul></div></div></div>`;
}

// ---------- Shared states ----------
const errorState = (head) => `${head}<div class="banner banner-error" role="alert">${icon('alert')}<div><p>Couldn’t load your categories. Check the connection and try again.</p>
  <button class="text-link" type="button" data-action="retry" style="color:inherit">${icon('refresh')}Try again</button></div></div>`;
const emptyState = (head) => `${head}<div class="state-box">
    <h2>No categories here</h2>
    <p>Every account starts with the default set, so this shouldn’t happen. Try again; if they’re still missing, tell Yulia.</p>
    <button class="btn btn-primary" type="button" data-action="retry">${icon('refresh')}Try again</button>
  </div>`;

function render() {
  const scroll = document.querySelector('.main')?.scrollTop ?? 0;
  app.innerHTML = shell(V.body(state.page)) + moreSheet();
  document.querySelector('.main').scrollTop = scroll;
  document.querySelectorAll('[data-page-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pageSet === state.page)));
  V.afterRender?.();
}
function go(id) {
  Object.assign(state, { page: id, more: false });
  V.go?.(id);
  render();
  document.querySelector('.main').scrollTop = 0;
  V.afterGo?.(id);
}
function toast(text) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  app.appendChild(t); setTimeout(() => t.remove(), 2200);
}
const WIDE = 1100;
const isWide = () => app.clientWidth >= WIDE;
const preview = (g) => {
  const c = g.cats;
  if (c.length <= 4) return `${c.slice(0, -1).join(', ')} and ${c[c.length - 1]}`;
  return `${c.slice(0, 3).join(', ')} and ${c.length - 3} more`;
};
const R = { sel: 'income', fresh: null, drilled: false };
const NAV_SETTINGS = [['receipt', 'Transactions'], ['wallet', 'Accounts'], ['chart', 'Reports'], ['users', 'Family'], ['settings', 'Settings']];
const kindWord = (g) => (g.kind === 'income' ? 'Income' : 'Expenses');
/** Variant 7 drops the + / − (owner: they look like list markers); variants 4–6 keep them as shown. */
let KIND_SIGNS = true;
const kindLine = (g) => `<p class="r2-kind" data-kind="${g.kind}">${KIND_SIGNS ? `<b aria-hidden="true">${g.kind === 'income' ? '+' : '−'}</b>` : ''}${g.name === kindWord(g) ? cats(g.cats.length) : `${kindWord(g)}, ${cats(g.cats.length)}`}</p>`;
const catsHead = () => `<a class="text-link r2-back" href="#settings" data-action="nav" data-to="Settings">${icon('chevLeft')}Settings</a><div class="page-head"><h1>Categories</h1></div>`;
const intro = () => `<p class="r2-intro">${ALL} categories in ${GROUPS.length} groups, in the order of your report.</p>`;
const foot = () => `<p class="later r2-foot">${icon('info', 16)}${LATER}</p>`;
const animIf = (id) => (R.fresh === id ? ' r2-anim' : '');
/** Variant 2's list of groups (desktop): the name, its first categories, the picked one marked like the menu. */
function groupIndex({ action = 'pick', withPreview = true, current = R.sel, label = 'Category groups' } = {}) {
  const btn = (g) => `<li><button class="r2-btn" type="button" data-action="${action}" data-id="${g.id}" aria-current="${current === g.id}"><span class="r2-txt"><span class="r2-name">${esc(g.name)}</span>${withPreview ? `<span class="r2-prev">${esc(preview(g))}</span>` : ''}</span></button></li>`;
  const exp = groupsOf('expense');
  return `<nav class="r2-index" aria-label="${label}"><ul class="list">${groupsOf('income').map(btn).join('')}</ul><div class="r2-label"><span>Expenses</span><span class="num">${exp.length} groups</span></div><ul class="list">${exp.map(btn).join('')}</ul></nav>`;
}
function settingsPage() {
  const off = (ic, name, val) => `<li><div class="row" aria-disabled="true">${icon(ic)}<span class="r2-txt"><span class="r2-name">${name}</span><span class="val">${val}</span></span></div></li>`;
  return `<div class="page-head"><h1>Settings</h1></div>
    <ul class="list r2-set">
      ${off('user', 'Name', 'Yulia Biriukova')}
      ${off('coins', 'Report currency', 'Hryvnia, UAH')}
      ${off('moon', 'Theme', 'Same as the system')}
      <li><a class="row" href="#categories" data-action="open-cats">${icon('tree')}<span class="r2-txt"><span class="r2-name">Categories</span><span class="val">${ALL} categories in ${GROUPS.length} groups</span></span>${icon('chevRight')}</a></li>
    </ul>`;
}
const skeleton = (rows) => `<div role="status" aria-busy="true"><span class="sr">Loading categories</span>${rows}</div>`;
const COMMON_ACTIONS = { 'open-cats': () => go('categories') };
let r2Wide = null;
new ResizeObserver(() => { const w = isWide(); if (r2Wide !== null && w !== r2Wide) render(); r2Wide = w; }).observe(app);
KIND_SIGNS = false;
const V = {
  DIRECTION: {
    name: 'Variant 7 · Tags in groups that fold, in the menu',
    thesis: 'Variant 5 with the owner’s two changes: Categories is its own menu item, and on the phone and tablet each group folds and unfolds.',
    notes: [
      'Where: its own menu item after Reports. On the phone it is under More, with Family and Settings.',
      'Phone and tablet: every group is open on the first visit, its categories as tags. Tap a group’s row (name, count, arrow) to fold it; a folded group shows its first categories instead. Collapse all / Expand all at the top.',
      'In the app the page remembers which groups you folded (on that device).',
      'Desktop: as in variant 5. The list of groups is on the left; the picked group’s tags are on the right. Nothing to fold there, because only one group is shown at a time.',
      'Tags aren’t buttons: no border and no pointer. Income tags are green; the others are neutral.',
      'The one moment: a group’s tags come out of its row when it opens (on the desktop, from the right).',
      'No + or − next to groups (they look like list markers): the words say it, “Expenses, 9 categories”; Income needs no word, its name says it.',
    ],
  },
  NAV: [['receipt', 'Transactions'], ['wallet', 'Accounts'], ['chart', 'Reports'], ['tree', 'Categories'], ['users', 'Family'], ['settings', 'Settings']],
  current: () => 'Categories',
  navTo: (l) => (l === 'Categories' ? 'categories' : null),
  PAGES: [
    { id: 'categories', label: 'Categories' },
    { id: 'categories-some-folded', label: 'Some folded' },
    { id: 'categories-all-folded', label: 'All folded' },
    { id: 'categories-group', label: 'Desktop: another group' },
    { id: 'categories-loading', label: 'Loading' },
    { id: 'categories-error', label: 'Couldn’t load' },
    { id: 'categories-empty', label: 'Empty' },
  ],
  go(id) {
    const closed = id === 'categories-some-folded' ? ['home', 'daily', 'health'] : id === 'categories-all-folded' ? GROUPS.map((g) => g.id) : [];
    Object.assign(R, { sel: id === 'categories-group' ? 'home' : 'income', fresh: null, closed: new Set(closed) });
  },
  body(p) {
    const head = '<div class="page-head"><h1>Categories</h1></div>';
    if (p === 'categories-error') return errorState(head);
    if (p === 'categories-empty') return emptyState(head);
    const tags = (g, cls = '') => `<ul class="list tags${cls}" id="t-${g.id}">${g.cats.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>`;
    if (p === 'categories-loading') return head + skeleton([3, 6, 4].map((n, i) => `<div class="v7-grp"><span class="sk" style="width:${[90, 140, 100][i]}px;height:16px;margin:16px 0 18px"></span><div class="tags">${Array.from({ length: n }, (_, k) => `<span class="sk" style="width:${[72, 96, 64, 110, 80, 70][k]}px;height:36px;border-radius:999px"></span>`).join('')}</div></div>`).join(''));
    if (isWide()) {
      const g = GROUPS.find((x) => x.id === R.sel);
      return `${head}${intro()}<div class="r2-md">${groupIndex()}
        <section class="v5-detail${animIf(g.id)}" data-kind="${g.kind}" aria-labelledby="d-title" aria-live="polite">${kindLine(g)}<h2 class="r2-title" id="d-title">${esc(g.name)}</h2>${tags(g)}</section></div>${foot()}`;
    }
    const grp = (g) => {
      const open = !R.closed.has(g.id);
      return `<section class="v7-grp" data-kind="${g.kind}"${open ? '' : ' data-closed'}>
        <h2 class="v7-h"><button class="v7-btn" type="button" data-action="fold" data-id="${g.id}" aria-expanded="${open}" aria-controls="t-${g.id}">
          <span class="r2-txt"><span class="r2-name">${esc(g.name)}</span>${open ? '' : `<span class="r2-prev">${esc(preview(g))}</span>`}</span>
          <span class="n num">${g.cats.length}</span>${icon('chevDown').replace('class="ic"', 'class="ic chev"')}</button></h2>
        ${open ? tags(g, R.fresh === g.id ? ' v7-anim' : '') : ''}</section>`;
    };
    const allClosed = R.closed.size === GROUPS.length;
    return `${head}<div class="v7-bar"><span>${ALL} categories in ${GROUPS.length} groups</span><button class="text-link" type="button" data-action="fold-all">${allClosed ? 'Expand all' : 'Collapse all'}</button></div>
      ${groupsOf('income').map(grp).join('')}
      <p class="v7-kind-label"><span>Expenses</span><span class="num">${cats(countOf('expense'))}</span></p>${groupsOf('expense').map(grp).join('')}${foot()}`;
  },
  actions: {
    pick: (a) => { Object.assign(R, { sel: a.dataset.id, fresh: a.dataset.id }); render(); R.fresh = null; document.querySelector(`[data-action="pick"][data-id="${a.dataset.id}"]`)?.focus(); },
    fold: (a) => {
      const id = a.dataset.id;
      if (R.closed.has(id)) { R.closed.delete(id); R.fresh = id; } else R.closed.add(id);
      render(); R.fresh = null;
      document.querySelector(`[data-action="fold"][data-id="${id}"]`)?.focus();
    },
    'fold-all': () => {
      R.closed = R.closed.size === GROUPS.length ? new Set() : new Set(GROUPS.map((g) => g.id));
      render(); document.querySelector('[data-action="fold-all"]')?.focus();
    },
  },
};
const PAGES = V.PAGES;

// Preview bar (review aid)
document.body.insertAdjacentHTML('afterbegin', `<div class="pv-bar"><b>F-015 · ${V.DIRECTION.name}</b>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="tablet">Tablet</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Screen</span>${PAGES.map((p) => `<button data-page-set="${p.id}">${p.label}</button>`).join('')}</div>
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="notes" aria-expanded="false">About this direction</button>
  <div class="pv-notes" id="notes" hidden><b>${V.DIRECTION.name}</b><p style="margin:4px 0 0">${V.DIRECTION.thesis}</p><ul>${V.DIRECTION.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
setView(innerWidth >= 1200 ? 'desktop' : 'phone');

document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-page-set]');
  if (p) { go(p.dataset.pageSet); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { state.schemePref = s.dataset.schemeSet; applyScheme(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  if (a.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  e.preventDefault();
  ({
    nav: () => {
      const to = V.navTo?.(a.dataset.to);
      if (to) { go(to); return; }
      state.more = false; render(); toast(`${a.dataset.to} isn’t part of this prototype`);
    },
    retry: () => go(V.PAGES[0].id),
    'add-tx': () => toast('Add transaction (F-018)'),
    more: () => { state.more = !state.more; render(); },
    'close-more': () => { state.more = false; render(); },
    ...(V.actions ?? {}),
    notes: () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; a.setAttribute('aria-expanded', String(!n.hidden)); },
  })[a.dataset.action]?.(a);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.getElementById('notes').hidden = true;
  if (state.more) { state.more = false; render(); }
});
applyScheme();
go(PAGES[0].id);
</script>
</body>
</html>
