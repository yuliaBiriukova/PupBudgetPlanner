<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.pv-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.pv-bar button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pv-bar button:hover { background: #363c47; }
.pv-bar button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(520px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.pv-notes ul { margin: 6px 0 0; padding-left: 18px; }
.pv-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='tablet'] .frame { width: 834px; height: min(1050px, 100%); border: 12px solid #16181d; border-radius: 28px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
}

/* ---------- Tokens: the app's theme (F-010 … F-016) plus expense / income / transfer ---------- */
.app {
  --bg: #f5f6f7; --surface: #fcfcfd; --sidebar: #ebedf0; --seg-bg: #ebedf0; --text: #1c1e21; --muted: #57585b;
  --rule: #d7d8d9; --hover: #e8e9ea; --field-border: #7c828a; --key: #ebedf0; --key-hover: #e0e2e5;
  --primary: #26292e; --primary-hover: #363a40; --on-primary: #f5f6f7;
  --accent: #2a62a3; --active-bg: #e7ecf1; --tint: #e7ecf1; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --error: #b3261e; --error-bg: #fbeceb; --error-text: #8c1d18;
  --expense: #b3261e; --expense-bg: #fbeceb; --income: #1f7a4d; --income-bg: #e6f2ec; --transfer: #2a62a3; --transfer-bg: #e7ecf1;
  --fresh: #fdf3d6;
  --pill: #1c1e21; --on-pill: #f5f6f7; --focus: #26292e; --scrim: rgba(18, 19, 21, .45);
  --shadow-float: 0 8px 24px rgba(15, 17, 20, .1);
  --font-display: 'Unbounded', system-ui, sans-serif; --font-text: 'Manrope', system-ui, sans-serif;
  --r-sm: 12px; --r-lg: 24px;
}
.app[data-scheme='dark'] {
  --bg: #121315; --surface: #1b1c1e; --sidebar: #18191b; --seg-bg: #1f2022; --text: #e9eaec; --muted: #a4a5a7;
  --rule: #37383a; --hover: #26272a; --field-border: #71747b; --key: #26272a; --key-hover: #303134;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --active-bg: #262f37; --tint: #262f37; --logo: #8ec1ec; --logo-mark: #121315;
  --error: #f2958c; --error-bg: #3a1d1b; --error-text: #f6b8b2;
  --expense: #f2958c; --expense-bg: #3a1d1b; --income: #7fd1a4; --income-bg: #1b3327; --transfer: #8ec1ec; --transfer-bg: #262f37;
  --fresh: #3a3420;
  --pill: #e9eaec; --on-pill: #121315; --focus: #e9eaec; --scrim: rgba(0, 0, 0, .6);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p, ul, ol, dl, dd) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.list { list-style: none; padding: 0; margin: 0; }
.neg { color: var(--expense); }
.pos { color: var(--income); }
.move { color: var(--transfer); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 15px; text-decoration: none; white-space: nowrap; background: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-default { border-color: var(--rule); color: var(--text); }
.btn-default:hover { background: var(--hover); }
.btn-danger { background: var(--error); color: var(--on-primary); }
.btn-danger-quiet { color: var(--error); padding: 0 12px; }
.btn-danger-quiet:hover { background: var(--error-bg); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.text-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--accent); font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 14px; z-index: 40; white-space: nowrap; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--tint); color: var(--text); }
.banner .ic { margin-top: 2px; color: var(--accent); }
.banner-error { background: var(--error-bg); color: var(--error-text); }
.banner-error .ic { color: var(--error-text); }

/* Fields (F-011: 48 px, a 2 px accent border in focus, the error under the field) */
.field { display: grid; gap: 6px; }
.field label, .field .label { font-weight: 500; font-size: 14px; }
.input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-size: 16px; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.input[aria-invalid='true'] { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
.field-error { display: flex; align-items: center; gap: 6px; color: var(--error); font-size: 14px; font-weight: 500; }
.field-hint { color: var(--muted); font-size: 14px; }

/* Segmented choice (F-016): a pill track, the picked one a raised pill */
.seg { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 999px; background: var(--seg-bg); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked='true'] { background: var(--surface); box-shadow: 0 1px 2px rgba(15, 17, 20, .12); }
.app[data-scheme='dark'] .seg button[aria-checked='true'] { background: var(--active-bg); box-shadow: none; }
.seg button[aria-checked='true'][data-type='expense'] { color: var(--expense); }
.seg button[aria-checked='true'][data-type='income'] { color: var(--income); }
.seg button[aria-checked='true'][data-type='transfer'] { color: var(--transfer); }

/* ---------- App shell (F-010): top bar and tab bar on the phone, sidebar from 768 px ---------- */
.logo { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
.column { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { display: flex; flex: none; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand .logo { width: 32px; height: 32px; }
.brand-name { font-family: var(--font-display); font-size: 15px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
.main { flex: 1; min-height: 0; overflow: hidden auto; position: relative; }
.content { max-width: 1040px; margin: 0 auto; padding: 8px 16px 32px; }
.tabs { display: flex; flex: none; align-items: center; gap: 2px; padding: 8px 8px 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.tab { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; color: var(--muted); font-size: 13px; text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab[data-active] { width: auto; padding: 0 14px 0 12px; background: var(--active-bg); color: var(--accent); font-weight: 500; }
.tab:not([data-active]) .tab-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tab-add { display: grid; place-items: center; width: 52px; height: 52px; margin-left: auto; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
.avatar-link { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; text-decoration: none; }
.avatar[data-initials]::before { content: attr(data-initials); }
@container app (min-width: 768px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-right: 1px solid var(--rule); background: var(--sidebar); min-width: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; height: 44px; margin-bottom: 12px; padding: 0 2px; }
  .side-head .logo { width: 32px; height: 32px; margin: 0 6px; }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin-bottom: 14px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 999px; color: var(--text); font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { background: var(--hover); }
  .nav-link[aria-current='page'] { font-weight: 500; }
  .nav-link[aria-current='page'] > svg { color: var(--accent); }
  .nav-link[aria-current='page']::before { content: ''; position: absolute; top: 8px; bottom: 8px; left: -12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-sep { height: 1px; margin: 10px 14px; background: var(--rule); }
  .side-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; margin-top: auto; padding: 0 0 0 8px; font-size: 14px; }
  .side-foot .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-foot .icon-btn { width: 36px; height: 36px; }
  .top, .tabs { display: none; }
  .content { padding: 32px 40px 48px; }
  .toast { bottom: 24px; }
}

/* ---------- Page head and the Transactions page (a stand-in until F-020's list) ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 0 20px; }
.page-head h1 { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; margin-right: auto; }
.latest { max-width: 720px; }
.latest-note { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; color: var(--muted); font-size: 14px; }
.latest-note .ic { margin-top: 2px; }
.day { padding: 16px 0 4px; color: var(--muted); font-size: 14px; font-weight: 500; }
.tx-row { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 60px; padding: 8px 12px; margin: 0 -12px; width: calc(100% + 24px); border: 0; border-radius: var(--r-sm); background: none; color: var(--text); text-align: left; cursor: pointer; }
.tx-row:hover { background: var(--hover); }
.tx-row[data-fresh] { animation: fresh 2400ms ease-out; }
@keyframes fresh { 0%, 40% { background: var(--fresh); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .tx-row[data-fresh] { animation: none; background: var(--fresh); } }
.tx-main { flex: 1; min-width: 0; display: grid; }
.tx-cat { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-sub { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; overflow: hidden; white-space: nowrap; }
.tx-sub span { overflow: hidden; text-overflow: ellipsis; }
.tx-amt { font-weight: 500; text-align: right; }
.tx-amt .ic { display: inline-block; vertical-align: -3px; margin: 0 2px; }

/* ---------- Pop-ups (I-012): a sheet on the phone, a dialog from 768 px ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: var(--scrim); }
.scrim.over { z-index: 26; }
.dialog { position: relative; display: flex; flex-direction: column; width: 100%; max-height: 92%; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-float); overflow: hidden; }
.handle { flex: none; width: 36px; height: 4px; margin: 8px auto 0; border-radius: 999px; background: var(--rule); }
.dlg-head { position: relative; padding: 8px 64px 0 16px; min-height: 44px; }
.dlg-x { position: absolute; top: 4px; right: 8px; }
.dlg-head h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 28px; padding-top: 8px; }
.dlg-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 0; scrollbar-width: none; }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 16px; }
.dlg-foot .btn { flex: 1; }
.dlg-foot .spacer { display: none; }
.more-link { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 12px; border-radius: 12px; color: var(--text); text-decoration: none; background: none; border: 0; width: 100%; cursor: pointer; }
.more-link:hover { background: var(--hover); }
.more-link[aria-current='page'] { background: var(--active-bg); color: var(--accent); font-weight: 500; }
@container app (min-width: 768px) {
  .scrim { align-items: center; justify-content: center; }
  .dialog { width: 480px; max-height: 86%; border-radius: var(--r-lg); }
  .handle { display: none; }
  .dlg-head { padding: 12px 64px 0 20px; }
  .dlg-x { top: 12px; right: 12px; }
  .dlg-body { padding: 20px 20px 0; }
  .dlg-foot { padding: 20px; }
  .dlg-foot .btn { flex: none; }
  .dlg-foot .spacer { display: block; flex: 1; }
}
.confirm .dialog { max-width: 100%; }
@container app (min-width: 768px) { .confirm .dialog { width: 400px; } }
.confirm-what { display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--seg-bg); }
.confirm-what .amt { font-family: var(--font-display); font-weight: 300; font-size: 22px; }

/* ---------- Pickers: account, category, date. A dropdown under its field on the desktop, a sheet on the phone ---------- */
.picker { position: absolute; z-index: 25; display: flex; flex-direction: column; max-height: 360px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--shadow-float); }
.picker > .cal { min-height: 0; overflow: auto; }
.pick-sheet .dialog { max-height: 86%; }
.pick-sheet.tall .dialog { height: 86%; }
.pick-sheet .dlg-body { display: flex; flex-direction: column; padding: 8px 16px 16px; }
.pick-search { position: relative; margin: 8px; flex: none; }
.pick-sheet .pick-search { margin: 8px 0 4px; }
.pick-search > .ic { position: absolute; left: 14px; top: 14px; color: var(--muted); pointer-events: none; }
.pick-search .input { padding: 0 16px 0 44px; }
.pick-search input::-webkit-search-cancel-button { display: none; }
.pick-scroll { padding: 0 6px 6px; }
.pick-sheet .pick-scroll { padding: 0; }
.sa { position: relative; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.sa-vp { flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain; scrollbar-width: none; }
.sa-vp::-webkit-scrollbar { display: none; }
.sa-track { position: absolute; display: none; pointer-events: none; }
.sa[data-overflow] > .sa-track { display: block; pointer-events: auto; top: 8px; bottom: 8px; right: 2px; width: 12px; opacity: 0; transition: opacity .3s ease .1s; }
.sa[data-scrolling] > .sa-track, .sa:hover > .sa-track { opacity: 1; transition-delay: 0s; transition-duration: .12s; }
.sa-thumb { position: absolute; top: 0; left: 50%; width: 6px; margin-left: -3px; border-radius: 999px; background: var(--field-border); }
.sa > .sa-vp { --ft: 0px; --fb: 0px; mask-image: linear-gradient(to bottom, transparent, #000 var(--ft), #000 calc(100% - var(--fb)), transparent); }
.sa[data-top] > .sa-vp { --ft: 32px; }
.sa[data-bottom] > .sa-vp { --fb: 40px; }
.pick-h { padding: 10px 10px 4px; color: var(--muted); font-size: 13px; font-weight: 500; }
.pick-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); text-align: left; cursor: pointer; }
.pick-item:hover { background: var(--hover); }
.pick-item[aria-pressed='true'] { background: var(--active-bg); color: var(--accent); }
.pick-item[aria-pressed='true'] .ok { color: var(--accent); }
.pick-item:disabled { cursor: default; color: var(--muted); background: none; }
.pick-item .grow { flex: 1; min-width: 0; display: grid; }
.pick-item .grow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-item small { color: var(--muted); font-size: 13px; }
.pick-item .num { color: var(--muted); }
.pick-item[aria-pressed='true'] .num { color: inherit; }
.pick-none { padding: 12px 10px; color: var(--muted); }
/* Date: Today and Yesterday, then the month, Monday first */
.cal { padding: 8px 8px 12px; }
.cal-quick { display: flex; gap: 8px; padding: 0 0 8px; }
.cal-quick .btn { flex: 1; min-height: 44px; padding: 0 12px; }
.pick-sheet .cal { padding: 8px 0 12px; }
.cal-quick .btn[aria-pressed='true'] { border-color: var(--accent); background: var(--active-bg); color: var(--accent); }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0 4px; }
.cal-head b { font-weight: 500; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; text-align: center; }
.cal-grid .wd { padding: 6px 0; color: var(--muted); font-size: 12px; }
.cal-grid button { height: 44px; border: 0; border-radius: 999px; background: none; color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; }
.cal-grid button:hover { background: var(--hover); }
.cal-grid button[data-today] { box-shadow: inset 0 0 0 1px var(--field-border); }
.cal-grid button[aria-pressed='true'] { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.cal-grid button:disabled { color: var(--muted); opacity: .5; cursor: default; background: none; }

/* The phone's own number keyboard (drawn, to show how much of the sheet stays visible while typing) */
.sys-kbd { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 6px 20px; background: #d1d4d9; }
.app[data-scheme='dark'] .sys-kbd { background: #2b2c2f; }
.sys-kbd span { display: grid; place-items: center; height: 46px; border-radius: 6px; background: #fdfdfe; color: #1c1e21; font: 400 22px/1 system-ui, sans-serif; }
.app[data-scheme='dark'] .sys-kbd span { background: #48494d; color: #f1f2f3; }
.sys-kbd .cap { grid-column: 1 / -1; height: auto; padding: 2px 0 4px; background: none !important; color: #57585b; font-size: 12px; }
.app[data-scheme='dark'] .sys-kbd .cap { color: #b8babd; }
.app[data-kbd] .scrim { bottom: 266px; }
.app[data-kbd] .tabs { visibility: hidden; }
@container app (min-width: 768px) { .sys-kbd { display: none; } .app[data-kbd] .scrim { bottom: 0; } }

/* The one moment: after a save the account's balance counts to its new value in the notification */
.count { display: inline-block; min-width: 0; }

/* ====================================================================================================== */
/* ---------- Variant 1 · Calculator: the sheet is a pocket calculator ---------- */
.v1.dialog { height: 92%; }
.v1-head { display: flex; flex: none; align-items: center; gap: 8px; padding: 8px 8px 0 16px; }

.v1-body > * { flex: none; }
/* The bold element: the amount, big, in the type's color, with a true sign */
.v1-amt { display: grid; justify-items: center; gap: 0; }
.v1-amt-label { color: var(--muted); font-size: 14px; font-weight: 500; }
.v1-amt-line { display: flex; align-items: baseline; justify-content: center; gap: 4px; max-width: 100%; padding: 0 4px; border-radius: 8px; font-family: var(--font-display); font-weight: 300; font-size: 48px; line-height: 64px; letter-spacing: -.02em; cursor: text; }
.v1-amt[data-type='expense'] .v1-amt-line { color: var(--expense); }
.v1-amt[data-type='income'] .v1-amt-line { color: var(--income); }

.v1-amt-line .sm { font-size: 32px; }
.v1-amt-input { field-sizing: content; min-width: 44px; max-width: 260px; border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; color: inherit; text-align: center; font-variant-numeric: tabular-nums; caret-color: var(--accent); }
.v1-amt-input::placeholder { color: inherit; opacity: .4; }
.v1-amt-input:focus { outline: none; }
.v1-amt-line:focus-within, .v1-amt-line[data-target] { box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
.v1-amt[aria-invalid] .v1-amt-line { box-shadow: inset 0 -2px 0 var(--error); border-radius: 0; }
.v1-amt-to .v1-amt-line { font-size: 32px; line-height: 44px; }
.v1-amt-to .v1-amt-line .sm { font-size: 24px; }
.v1-sum { color: var(--muted); font-size: 14px; min-height: 20px; }
.v1-rate { max-width: 340px; color: var(--muted); font-size: 14px; text-align: center; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; max-width: 100%; padding: 0 12px 0 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--text); font-weight: 500; font-size: 14px; cursor: pointer; }
.chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip > .ic { color: var(--muted); }
.chip:hover { background: var(--hover); }
.chip[aria-expanded='true'] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.v1-cats-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: -8px; }
.v1-cats-head h3 { font-size: 14px; font-weight: 500; }
/* Often: two rows that scroll sideways on the phone; all of them wrap on the desktop */
.v1-cats { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); grid-auto-columns: max-content; gap: 8px; margin: 0 -16px; padding: 0 16px 2px; overflow-x: auto; scrollbar-width: none; scroll-padding: 0 16px; }
.v1-cats::-webkit-scrollbar { display: none; }
.v1-cats.few { display: flex; flex-wrap: wrap; margin: 0; padding: 0; }
.tag { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--text); white-space: nowrap; cursor: pointer; }
.tag:hover { background: var(--hover); }
.tag[aria-checked='true'] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 500; }
.v1-route { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); align-items: center; gap: 4px; }
.route-acc { display: grid; gap: 0; min-height: 72px; padding: 10px 14px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; }
.route-acc:hover { background: var(--hover); }
.route-acc[aria-expanded='true'] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.route-acc[aria-invalid] { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
.route-acc small { color: var(--muted); font-size: 13px; }
.route-acc .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.route-acc .num { color: var(--muted); font-size: 14px; }
.route-arrow { color: var(--transfer); justify-self: center; }
.v1-errors { display: grid; justify-items: center; gap: 4px; }
/* The keys: the app's own, so the phone's keyboard never covers the form */
.v1-keys { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--rule); background: var(--surface); }
.key { display: grid; place-items: center; height: 52px; border: 0; border-radius: var(--r-sm); background: var(--key); color: var(--text); font-family: var(--font-display); font-weight: 300; font-size: 22px; cursor: pointer; }
.key:hover { background: var(--key-hover); }
.key:disabled { color: var(--muted); cursor: default; background: var(--key); }
.key-save { background: var(--primary); color: var(--on-primary); font-family: var(--font-text); font-weight: 500; font-size: 16px; }
.key-save:hover { background: var(--primary-hover); }
.v1-note { display: grid; gap: 6px; }
.v1-note label { font-weight: 500; font-size: 14px; }
@container app (min-width: 768px) {
  .v1.dialog { height: auto; width: 520px; }
  .v1-head { padding: 16px 12px 0 20px; }
  .v1-body { padding-top: 16px; gap: 20px; }
  .v1-keys { display: none; }
  .v1-cats { display: flex; flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }
}
.v1-sum:empty { display: none; }

/* ====================================================================================================== */
/* ---------- Variant 4 · Variant 1 with options: other amount inputs and category pickers ---------- */
.v1.v4-phone.dialog { height: auto; }
/* Amount · Calculator display: a screen above the keys, the sum on top, the amount big and right-aligned */
.v4-display { display: grid; gap: 0; padding: 10px 16px 6px; border-radius: var(--r-sm); background: var(--seg-bg); cursor: text; }
.v4-display .d-head { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
.v4-display .d-head label { font-weight: 500; }
.v4-display .big { display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; min-width: 0; font-family: var(--font-display); font-weight: 300; font-size: 40px; line-height: 56px; letter-spacing: -.02em; }
.v4-display .big .sm { font-size: 26px; }
.v4-display[data-type='expense'] .big { color: var(--expense); }
.v4-display[data-type='income'] .big { color: var(--income); }
.v4-display[data-type='transfer'] .big { color: var(--transfer); }
.v4-display input { field-sizing: content; min-width: 44px; max-width: 100%; border: 0; padding: 0; background: none; font: inherit; letter-spacing: inherit; color: inherit; text-align: right; font-variant-numeric: tabular-nums; caret-color: var(--accent); }
.v4-display input::placeholder { color: inherit; opacity: .4; }
.v4-display input:focus, .v4-display input:focus-visible { outline: none; }
.v4-display[data-target], .v4-display:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.v4-display[aria-invalid] { box-shadow: inset 0 0 0 2px var(--error); }
.v4-display.to .big { font-size: 28px; line-height: 40px; }
.v4-display.to .big .sm { font-size: 20px; }
.v4-display .rate { color: var(--muted); font-size: 14px; text-align: right; }
/* Amount · Recent amounts: the last ones for the picked category, one tap each, above the keys */
.v4-recent { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.v4-recent::-webkit-scrollbar { display: none; }
.v4-recent .cap { flex: none; color: var(--muted); font-size: 13px; }
.v4-recent button { flex: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--text); font-variant-numeric: tabular-nums; cursor: pointer; }
.v4-recent button:hover { background: var(--hover); }
.v4-keys-tight .key { height: 48px; }
/* Amount · Boxed field (variant 2's): label left, the amount right-aligned in a field, the phone's keyboard */
.v4-field { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 16px; }
.v4-field label { color: var(--muted); font-size: 14px; font-weight: 500; }
.v4-field .box { display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; min-width: 0; height: 64px; padding: 0 14px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); font-family: var(--font-display); font-weight: 300; font-size: 32px; line-height: 62px; cursor: text; }
.v4-field .box .sm { font-size: 22px; }
.v4-field .box:focus-within { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.v4-field[aria-invalid] .box { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
.v4-field[data-type='expense'] .box { color: var(--expense); }
.v4-field[data-type='income'] .box { color: var(--income); }
.v4-field[data-type='transfer'] .box { color: var(--transfer); }
.v4-field input { field-sizing: content; min-width: 44px; height: 100%; border: 0; padding: 0; background: none; font: inherit; color: inherit; text-align: left; font-variant-numeric: tabular-nums; outline: none; }
.v4-field input:focus-visible { outline: none; }
.v4-field input::placeholder { color: inherit; opacity: .4; }
.v4-field .rate, .v4-field .field-error { grid-column: 2; justify-self: end; text-align: right; }
.v4-field .rate { color: var(--muted); font-size: 14px; }
.v1-amt-input:focus-visible { outline: none; }
/* Category · Cells: the most used ones with this month's total, the last cell opens all */
.v4-cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); overflow: hidden; }
.v4-cells .v4-c { display: flex; min-width: 0; box-shadow: 1px 0 0 var(--rule), 0 1px 0 var(--rule); }
.v4-cell { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; min-height: 64px; padding: 8px 12px; border: 0; background: none; color: var(--text); text-align: left; cursor: pointer; }
.v4-cell:hover { background: var(--hover); }
.v4-cell .n { font-weight: 500; font-size: 14px; line-height: 18px; overflow-wrap: break-word; }
.v4-cell .s { color: var(--muted); font-size: 13px; }
.v4-cell[aria-checked='true'] { background: var(--active-bg); box-shadow: inset 0 0 0 2px var(--accent); }
.v4-cell[aria-checked='true'] .n { color: var(--accent); }
.v4-cell.all { justify-content: center; align-items: flex-start; color: var(--accent); }
.v4-cell:focus-visible { outline-offset: -2px; }
/* Category · Select: one field that opens the list with a search */
.v4-select { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 6px 12px 6px 16px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; }
.v4-select:hover { background: var(--hover); }
.v4-select .v { flex: 1; min-width: 0; display: grid; }
.v4-select .v span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.v4-select .v small { color: var(--muted); font-size: 13px; }
.v4-select .ph { color: var(--muted); font-weight: 400 !important; }
.v4-select > .ic { color: var(--muted); }
.v4-select[aria-expanded='true'] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.v4-select[aria-invalid] { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }
/* Category · Groups: the report's groups as a row of words, the picked group's categories under it */
.v4-groups { display: flex; gap: 12px; margin: 0 -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); }
.v4-groups::-webkit-scrollbar { display: none; }
.v4-groups button { position: relative; flex: none; min-width: 44px; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--muted); font-weight: 500; font-size: 14px; white-space: nowrap; cursor: pointer; }
.v4-groups button:hover { color: var(--text); }
.v4-groups button[aria-pressed='true'] { color: var(--text); }
.v4-groups button[aria-pressed='true']::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.v4-groups button .dot { display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--accent); vertical-align: 2px; }
.v4-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
/* Category · Search: type a few letters, the matching ones as tags */
.v4-find { position: relative; }
.v4-find > .ic { position: absolute; left: 14px; top: 14px; color: var(--muted); pointer-events: none; }
.v4-find .input { padding-left: 44px; }
.v4-find input::-webkit-search-cancel-button { display: none; }
.v4-none { color: var(--muted); font-size: 14px; }
@container app (min-width: 768px) {
  .v4-groups { margin: 0; padding: 0; }
  .v4-recent { margin: 0; padding: 0; }
  .v4-cells { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* ====================================================================================================== */
/* ---------- Variant 5 (final) · Calculator display, tags with search ---------- */
/* The amount a little smaller on the phone (owner, 2026-11-01) */
.v4-display .big { font-size: 34px; line-height: 48px; }
.v4-display .big .sm { font-size: 22px; }
.v4-display.to .big { font-size: 26px; line-height: 44px; }
.v4-display.to .big .sm { font-size: 18px; }
/* A sum being typed is arithmetic, not yet the amount: no sign, no currency, the text's color; its result on top */
.v4-display[data-sum] .big { color: var(--text); }
.v4-display .res { font-weight: 500; }
.v4-display[data-type='expense'] .res { color: var(--expense); }
.v4-display[data-type='income'] .res { color: var(--income); }
.v4-display[data-type='transfer'] .res { color: var(--transfer); }
.v4-display .res.low { color: var(--muted); }
.v5-hint { color: var(--muted); font-size: 14px; text-align: right; }
@container app (min-width: 768px) {
  .v4-display .big { font-size: 40px; line-height: 56px; }
  .v4-display .big .sm { font-size: 26px; }
  .v4-display.to .big { font-size: 28px; line-height: 40px; }
  .v4-display.to .big .sm { font-size: 20px; }
}

/* ====================================================================================================== */
/* ---------- Variant 6 · Variant 5 with account and day options ---------- */
.v6-acc .bal { flex: none; color: var(--muted); font-size: 14px; }
/* A row that scrolls sideways (cards, day pills), edge to edge of the sheet */
.v6-row { display: flex; gap: 8px; margin: 0 -16px; padding: 0 16px 2px; overflow-x: auto; scrollbar-width: none; }
.v6-row::-webkit-scrollbar { display: none; }
.v6-row > * { flex: none; }
.v6-card { display: grid; align-content: space-between; gap: 2px; width: 136px; min-height: 64px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; }
.v6-card:hover { background: var(--hover); }
.v6-card .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 14px; }
.v6-card .b { color: var(--muted); font-size: 13px; }
.v6-card[aria-checked='true'] { border-color: var(--accent); background: var(--active-bg); box-shadow: inset 0 0 0 1px var(--accent); }
.v6-card[aria-checked='true'] .n { color: var(--accent); }
/* Day before / after */
.v6-step { display: flex; align-items: center; justify-content: center; gap: 4px; }
.v6-step-mid { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--text); font-weight: 500; font-size: 14px; cursor: pointer; }
.v6-step-mid:hover { background: var(--hover); }
.v6-step-mid > .ic { color: var(--muted); }
.v6-step-mid[aria-expanded='true'] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.v6-step .icon-btn:disabled { opacity: .4; cursor: default; background: none; }
/* Week strip */
.v6-week-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: -12px; }
.v6-week-head h3 { font-size: 14px; font-weight: 500; }
.v6-week-head .btns { display: flex; }
.v6-week-head .icon-btn:disabled { opacity: .4; cursor: default; background: none; }
.v6-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.v6-week button { display: grid; justify-items: center; gap: 0; min-height: 56px; padding: 6px 0; border: 0; border-radius: var(--r-sm); background: none; color: var(--text); cursor: pointer; }
.v6-week button:hover { background: var(--hover); }
.v6-week small { color: var(--muted); font-size: 12px; line-height: 16px; }
.v6-week b { font-weight: 500; font-size: 16px; line-height: 24px; font-variant-numeric: tabular-nums; }
.v6-week button[data-today] { box-shadow: inset 0 0 0 1px var(--field-border); }
.v6-week button[aria-checked='true'] { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.v6-week button[aria-checked='true'] small { color: inherit; }
.v6-week button:disabled { opacity: .4; cursor: default; background: none; }
/* The phone's own date picker: a date field laid over the chip */
.v6-native { position: relative; }
.v6-native input { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; opacity: 0; cursor: pointer; }
.v6-native:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
@container app (min-width: 768px) {
  .v6-row { margin: 0 -20px; padding: 0 20px 2px; }
}
/* Most used + Other: three accounts and Other on one line at 375 px */
.v6-compact .tag { padding: 0 12px; }

/* ====================================================================================================== */
/* ---------- Variant 7 (final) · account field, week strip, note field, + on the Accounts page ---------- */
/* The form's body in the app's scroll area (I-004): the bar while scrolling, faded edges with more behind them */
.v7-sa { flex: 1; min-height: 0; }
.v7-sa > .sa-vp { display: flex; flex-direction: column; }
.v1-body.sa-vp > * { flex: none; }
.v7-sa[data-overflow] > .sa-track { top: 4px; bottom: 4px; }
.v7-day { display: grid; gap: 4px; }

/* From and To: the same size as before, with the account field's select arrows */
.v7-route { position: relative; padding-right: 36px; }
.v7-route .sel { position: absolute; right: 10px; top: 50%; margin-top: -10px; color: var(--muted); }
/* Account rows as in the app's other dropdowns: one line, the balance on the right */
.acc-item .grow span { font-weight: 400; }
/* The Accounts page: the cards (F-014, simplified) and a + on each */
.v7-cards { display: grid; gap: 12px; }
/* The + shares the card's grid cell, top right (no absolute position: it scrolls with the card) */

.v7-card { display: grid; gap: 2px; width: 100%; min-height: 112px; padding: 16px 64px 16px 16px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; }
.v7-card:hover { background: var(--hover); }
.v7-card .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v7-card .s { color: var(--muted); font-size: 14px; }

.v7-card[data-fresh] { animation: fresh 2400ms ease-out; }

.v7-add { align-self: start; justify-self: end; margin: 8px; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--text); cursor: pointer; }

  .v7-cards { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
}
/* The category error next to its label (owner, 2026-11-01) */
.v7-lbl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
/* All categories opens a dropdown: the link carries a small arrow */
.v1-cats-head .text-link { gap: 4px; }
/* Every block the same (owner, 2026-11-01): a 24 px label row, 8 px, its control; between blocks the pop-up's own
   padding, 16 px on the phone and 20 px on the desktop (I-012). Buttons in a label row keep 44 px to tap but take only
   the row's height */
.v7-blk { display: grid; gap: 8px; min-width: 0; }
.blk-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 24px; }
.blk-head h3, .blk-head .label { margin: 0; font-size: 14px; font-weight: 500; line-height: 24px; }
.blk-head .btns { display: flex; margin-right: -12px; }
.blk-head .icon-btn, .blk-head .text-link { margin-top: -10px; margin-bottom: -10px; }
.blk-head .icon-btn:disabled { opacity: .4; cursor: default; background: none; }

/** What the amount field holds: digits, spaces, `+` and `−` for a sum (V1), `.` or `,` (rounded). Returns a whole number or null. */
function evalAmount(s) {
  const clean = String(s ?? '').replace(/\s/g, '').replace(/,/g, '.').replace(/[−–]/g, '-');
  if (!clean) return null;
  const parts = clean.match(/[+-]?[^+-]+/g);
  if (!parts) return null;
  let sum = 0;
  for (const p of parts) { const n = Number(p); if (!Number.isFinite(n)) return null; sum += n; }
  return Math.round(sum);
}

    const keys = [['7'], ['8'], ['9'], ['⌫', 'back'], ['4'], ['5'], ['6'], ['−', 'minus'], ['1'], ['2'], ['3'], ['+', 'plus'], ['00'], ['0'], ['=', 'eq']];

    });

    note?.addEventListener('input', () => { T.note = note.value; });

      const to = T.focus === 'to' && isExchange();

      let s = to ? (T.toTouched ? T.toAmount : '') : T.amount;

      const lastNum = (s.match(/\d+$/) ?? [''])[0];
      if (/^\d$/.test(k)) { if (lastNum.length < 9) s = lastNum === '0' ? s.slice(0, -1) + k : s + k; }
      if (k === '00' && lastNum && lastNum !== '0' && lastNum.length < 8) s += '00';
      if (k === 'back') s = s.slice(0, -1);
      if (k === 'plus' || k === 'minus') { const op = k === 'plus' ? '+' : '-'; if (/\d$/.test(s)) s += op; else if (/[+-]$/.test(s)) s = s.slice(0, -1) + op; }
      if (k === 'eq') { const n = evalAmount(s); if (n > 0) s = String(n); }
      if (to) Object.assign(T, { toAmount: s, toTouched: true }); else T.amount = s;

    },

};

      '<b>Account</b>: a full-width field with the account, its bank or cash, and its balance now; it opens your accounts in the app’s dropdown (as wide as the field, one line per account) or a sheet. The last account used for this type is picked when the form opens.',

const v5go = V.go;
V.go = (id) => {
  V.fixedAcc = null;
  V.view = ['accounts', 'from-account'].includes(id) ? 'accounts' : 'transactions';
  v5go(id);
  if (id === 'old-date') { openForm('expense'); Object.assign(T, { amount: '250', cat: 'expense:Groceries', date: new Date(2026, 9, 12) }); }
  if (id === 'from-account') { V.fixedAcc = 'privat'; openForm('expense'); }
  if (id === 'to-list') { openForm('transfer'); Object.assign(T, { acc: 'mono', to: 'cash', amount: '2000', pick: 'to' }); }

  if (id === 'cat-search') { openForm('expense'); Object.assign(T, { amount: '250', pick: 'cat', q: 'sub' }); }

  if (id === 'missing') { openForm('expense'); Object.assign(T, { acc: 'privat', cat: null, catAuto: false }); T.errors = validate(); }

const v5open = V.onOpen;

  if (!T.editing && T.type !== 'transfer') Object.assign(T, { cat: lastCat(T.acc, T.type), catAuto: true });

};

      <button class="icon-btn" type="button" data-action="open-pick" data-pick="date" data-anchor="date" aria-haspopup="dialog" aria-expanded="${T.pick === 'date'}" aria-label="Pick a day in the calendar">${icon('calendar')}</button></span></div>
    <div class="v6-week" role="radiogroup" aria-labelledby="wk-h">${[0, 1, 2, 3, 4, 5, 6].map((n) => {

// ---------- Errors: the red amount is enough, its message is only read out ----------
const v5amount = V.amount;

// ---------- Category: the most used as pills; all of them, with a search, in the dropdown ----------
V.category = () => {
  const k = kind();
  const picked = T.cat ? cat(T.cat) : null;
  // The most used: 6 on the phone (3 lines), 8 from 768 px (owner, 2026-11-01). A picked one that isn't among them
  // comes first and the last drops off, so there are never more
  const most = isWide() ? 8 : 6;
  let tags = k === 'income' ? CATS.filter((c) => c.kind === 'income') : OFTEN.slice(0, most).map((n) => cat(`expense:${n}`));
  if (picked && !tags.includes(picked)) tags = [picked, ...tags.slice(0, k === 'income' ? tags.length : most - 1)];
  const err = T.errors.cat ? `<p class="field-error" id="err-cat">${icon('alert', 16)}${T.errors.cat}</p>` : '';
  const all = k === 'expense' ? `<button class="text-link" type="button" data-action="open-pick" data-pick="cat" data-anchor="cat" aria-haspopup="dialog" aria-expanded="${T.pick === 'cat'}">All categories${icon('chevDown', 16)}</button>` : '';
  return `<div class="v7-blk"><div class="blk-head"><span class="v7-lbl"><h3 id="cat-h">Category</h3>${err}</span>${all}</div>
    <div class="v1-cats${k === 'income' ? ' few' : ''}" role="radiogroup" aria-labelledby="cat-h"${T.errors.cat ? ' aria-describedby="err-cat"' : ''}>${tags.map(V.tag).join('')}</div></div>`;
};

V.form = () => {
  const word = T.editing && isExchange() ? 'exchange' : TYPE_WORD[T.type];
  const a = acc(T.acc);
  const head = T.editing
    ? `<h2 class="v1-title" id="f-title">Edit ${word}</h2><button class="icon-btn" type="button" data-action="ask-delete" aria-label="Delete this ${word}">${icon('trash')}</button>`
    : `<h2 class="sr" id="f-title">Add ${word}</h2><div class="seg" role="radiogroup" aria-label="Type">${TYPES.map((x) => `<button type="button" role="radio" data-type="${x.id}" aria-checked="${x.id === T.type}" data-action="set-type">${x.label}</button>`).join('')}</div>`;
  const note = `<div class="v7-blk"><div class="blk-head"><label class="label" for="note">Note</label></div><input class="input" id="note" value="${esc(T.note)}" maxlength="200" placeholder="${T.type === 'transfer' ? 'Cash for the market, savings' : 'Silpo, lunch with Vlad'}" autocomplete="off"></div>`;
  // Day, account (From and To for a transfer), amount, category, note (owner, 2026-11-01)
  let where;
  let what = '';
  let exchange = '';
  if (T.type === 'transfer') {
    const to = T.to ? acc(T.to) : null;
    where = `<div class="v1-route">
        <button class="route-acc v7-route" type="button" data-action="open-pick" data-pick="acc" data-anchor="acc" aria-haspopup="dialog" aria-expanded="${T.pick === 'acc'}"><small>From</small><span class="n">${esc(a.name)}</span><span class="num">${money(a.cur, a.bal)}</span>${icon('selector', 20, 'sel')}</button>
        <button class="icon-btn route-swap" type="button" data-action="swap" aria-label="Swap From and To">${icon('swap')}</button>
        <button class="route-acc v7-route" type="button" data-action="open-pick" data-pick="to" data-anchor="to" aria-haspopup="dialog" aria-expanded="${T.pick === 'to'}"${T.errors.to ? ' aria-invalid="true" aria-describedby="err-to"' : ''}><small>To</small><span class="n">${to ? esc(to.name) : 'Pick an account'}</span><span class="num">${to ? money(to.cur, to.bal) : ''}</span>${icon('selector', 20, 'sel')}</button>
      </div>${T.errors.to ? `<div class="v1-errors">${fieldError('to')}</div>` : ''}`;
    exchange = isExchange() ? V.amount('to') : '';
  } else {
    where = V.accountField();
    what = V.category();
  }
  const middle = `${saveErrorBanner()}${V.week()}${where}${V.amount('from')}${exchange}${what}`;
  const keys = [['7'], ['8'], ['9'], ['⌫', 'back'], ['4'], ['5'], ['6'], ['−', 'minus'], ['1'], ['2'], ['3'], ['+', 'plus'], ['00'], ['0'], ['=', 'eq']];
  const label = { back: 'Delete the last digit', minus: 'Minus', plus: 'Plus', eq: 'Work out the sum' };
  const hasSum = /\d[+-]\d/.test(T.focus === 'to' ? T.toAmount : T.amount);
  const keyPad = keypad() ? `<div class="v1-keys" role="group" aria-label="Amount keys">${keys.map(([k, id]) => `<button class="key" type="button" data-action="key" data-k="${id ?? k}"${id ? ` aria-label="${label[id]}"` : ''}${id === 'eq' && !hasSum ? ' disabled' : ''}>${id === 'back' ? icon('backspace', 24) : id === 'minus' ? icon('minus', 24) : id === 'plus' ? icon('plus', 24) : id === 'eq' ? icon('equal', 24) : k}</button>`).join('')}<button class="key key-save" type="button" data-action="save">Save</button></div>` : '';
  const foot = keypad() ? '' : `<div class="dlg-foot">${T.editing ? `<button class="btn btn-danger-quiet" type="button" data-action="ask-delete">${icon('trash', 16)}Delete</button>` : ''}<span class="spacer"></span><button class="btn btn-default" type="button" data-action="close-form">Cancel</button><button class="btn btn-primary" type="button" data-action="save">${T.editing ? 'Save changes' : `Save ${word}`}</button></div>`;
  // The body scrolls in the app's scroll area: its bar shows while scrolling, edges with more behind them fade (I-004)
  return `<div class="scrim" data-action="close-form"><div class="dialog form v1" role="dialog" aria-modal="true" aria-labelledby="f-title" data-stop><div class="handle"></div>
    <div class="v1-head">${head}<button class="icon-btn" type="button" data-action="close-form" aria-label="Close">${icon('x')}</button></div>
    <div class="sa v7-sa" data-sa><div class="sa-vp dlg-body v1-body">${middle}${note}</div><div class="sa-track" aria-hidden="true"><div class="sa-thumb"></div></div></div>
    ${keyPad}${foot}</div></div>`;
};

const v5after = V.afterRender;
V.afterRender = () => {
  v5after();
  if (T.open) V.justSaved = false;
  if (V.scrollTo) {
    const vp = document.querySelector('.v7-sa > .sa-vp');
    const sa = vp?.closest('.sa');
    if (vp) { vp.scrollTop = V.scrollTo; sa.update(); sa.setAttribute('data-scrolling', ''); }
    V.scrollTo = 0;
  }
};
V.afterSave = () => { V.justSaved = false; };
Object.assign(V.actions, {
  'week-step': (b) => { V.weekStart = addDays(V.weekStart, Number(b.dataset.step)); render(); document.querySelector(`[data-action="week-step"][data-step="${b.dataset.step}"]`)?.focus(); },
  // A category picked by the person stays; one picked for them follows the account
  'pick-cat': (a) => { T.catAuto = false; BASE_ACTIONS['pick-cat'](a); },
  'pick-acc': (a) => {
    const fromField = T.pick !== 'to';
    BASE_ACTIONS['pick-acc'](a);
    if (fromField && T.catAuto && !T.editing && T.type !== 'transfer') { T.cat = lastCat(T.acc, T.type); delete T.errors.cat; render(); }
  },
  nav: (a) => {
    if (['Accounts', 'Transactions'].includes(a.dataset.to)) { V.view = a.dataset.to.toLowerCase(); state.more = false; render(); document.querySelector('.main').scrollTop = 0; return; }
    BASE_ACTIONS.nav(a);
  },
  'edit-acc': () => toast('Opens the account form (F-014)'),
  'add-from': (b) => { V.fixedAcc = b.dataset.id; openForm('expense'); render(); V.focusFirst?.(); },
  'add-tx': () => { V.fixedAcc = null; BASE_ACTIONS['add-tx'](); },
  'open-tx': (a) => { V.fixedAcc = null; BASE_ACTIONS['open-tx'](a); },
  save: () => { V.justSaved = true; save(); },
});



// ---------- F-019 (final prototype) · Transfer and exchange in the quick-add form as built ----------
ICONS.swap = ['M21 17l-18 0', 'M6 10l-3 -3l3 -3', 'M3 7l18 0', 'M18 20l3 -3l-3 -3'];

Object.assign(V, {
  DIRECTION: {
    name: 'Final prototype · Transfers and currency exchange',
    thesis: 'F-018’s approved form (variant 7, as built) with its third type: Transfer. Money moves between your own accounts; between two currencies it is an exchange, with both amounts and the rate. Everything that isn’t about transfers is F-018 as built.',
    notes: [
      '<b>Type</b>: Expense, Income, Transfer in the switch on top. Changing the type keeps the day, the amount and the note (as built).',
      '<b>From and To</b> where the account field is, side by side, both with select arrows and their balance now; they open the same account list (dropdown on the desktop, sheet on the phone). The To list leaves out the From account. The last transfer’s From and To come picked; from an account card’s + that account is the From.',
      '<b>Swap</b>: the button between From and To swaps them (with the two amounts of an exchange). Picking the To account as From swaps them too.',
      '<b>Same currency</b>: one amount, in the transfer’s blue. No category.',
      '<b>Exchange</b> (From and To in different currencies): the amount From, then a second, smaller display for the amount To, suggested at the NBU rate of the picked day and changeable. The line under it says where the number comes from: “At the NBU rate of 29 Oct 2026: $1 = 45.53 ₴. Change it to what the bank gave you.” Once you type your own: “Your rate: $1 = 44.90 ₴. NBU: $1 = 45.53 ₴.” and “Use the NBU rate” to go back.',
      '<b>The rate</b> is written as the app writes rates (Accounts, F-017): one unit of the currency worth more, so selling and buying dollars both read $1 = … ₴. Amounts are whole (ADR 0018); the rate keeps two decimals.',
      '<b>On the phone</b> the keys type into the display with the ring; tap the other display to move them. The first key on a suggested amount replaces it. On the desktop the suggested amount is selected when you click it, so typing replaces it.',
      '<b>No NBU rate</b>: when the day’s rate isn’t out yet, the latest earlier one is suggested and the line says so (F-017). With no rate at all, the To amount is empty and the line asks for it; Save without it turns the display red.',
      '<b>Saved</b>: the notification counts both balances to their new values; on the Accounts page both cards light up. Delete asks first and says what both balances go back to.',
      '<b>Transactions</b>: a transfer’s row is “Transfer” (an exchange’s “Exchange”), the accounts with an arrow and the note, the amount in blue without a sign: 2 000 ₴, or $100 → 4 490 ₴.',
      '<b>Reports</b> (F-021) leave transfers out: they are neither income nor expense.',
    ],
  },
  PAGES: [
    { id: 'transfer', label: 'Transfer' },
    { id: 'to-list', label: 'To list' },
    { id: 'exchange-nbu', label: 'Exchange: NBU rate' },
    { id: 'exchange', label: 'Exchange: your rate' },
    { id: 'buy', label: 'Buying dollars' },
    { id: 'rate-earlier', label: 'Earlier rate' },
    { id: 'rate-none', label: 'No rate' },
    { id: 'missing-to', label: 'Nothing in To' },
    { id: 'accounts', label: 'Accounts page' },
    { id: 'from-account', label: 'From an account' },
    { id: 'saved', label: 'Saved' },
    { id: 'latest', label: 'Transactions' },
    { id: 'edit', label: 'Edit exchange' },
    { id: 'delete', label: 'Delete' },
  ],
  keepSaved: false,
});

const v7go = V.go;
V.go = (id) => {
  v7go(id);
  const exchange = () => { openForm('transfer'); Object.assign(T, { acc: 'mono-usd', to: 'mono', amount: '100' }); };
  if (id === 'exchange-nbu') exchange();
  if (id === 'buy') { openForm('transfer'); Object.assign(T, { acc: 'mono', to: 'mono-usd', amount: '4600', toAmount: '100', toTouched: true, note: 'For the trip' }); }
  if (id === 'rate-earlier') { RATES = 'earlier'; exchange(); }
  if (id === 'rate-none') { RATES = 'none'; exchange(); T.focus = 'to'; }
  if (id === 'missing-to') { RATES = 'none'; exchange(); T.focus = 'to'; T.errors = validate(); }
  // The card's + opens Expense with Mono dollars; switching to Transfer keeps it as the From
  if (id === 'from-account') { V.fixedAcc = 'mono-usd'; openForm('expense'); setType('transfer'); }
  // Saved from the Accounts page: both cards light up, the notification counts both balances
  if (id === 'saved') {
    V.view = 'accounts'; V.fixedAcc = 'mono-usd';
    openForm('transfer'); Object.assign(T, { to: 'mono', amount: '100', toAmount: '4490', toTouched: true, note: '' });
    V.keepSaved = true;
  }
  if (id === 'edit') openTx('t3');
  if (id === 'delete') { openTx('t3'); T.confirm = true; }
  V.weekStart = monday(T.date);
};

const v7after = V.afterRender;
V.afterRender = () => {
  v7after();
  if (V.keepSaved) V.justSaved = true;
  // On the phone the display the keys type into is scrolled into sight, with its line (the To amount sits low)
  if (keypad() && T.open && (T.focus === 'to' || T.errors.toAmount) && isExchange()) document.querySelector('.v4-display.to')?.scrollIntoView({ block: 'nearest' });
  // A suggested amount is selected on click, so typing replaces it
  const to = document.getElementById('amt-to');
  to?.addEventListener('focus', () => { if (!T.toTouched) to.select(); });
};
const v7afterSave = V.afterSave;
V.afterSave = () => { v7afterSave(); V.keepSaved = false; };

Object.assign(V.actions, {
  swap: () => {
    if (!T.to) return;
    if (isExchange()) {
      // The amounts go with their accounts: 100 USD → 4 490 ₴ becomes 4 490 ₴ → 100 USD
      const from = T.amount;
      T.amount = String(toValue() ?? '');
      if (T.toTouched) T.toAmount = from;
    }
    Object.assign(T, { acc: T.to, to: T.acc, errors: {} });
    render();
    document.querySelector('[data-action="swap"]')?.focus();
  },
  'use-nbu': () => { Object.assign(T, { toTouched: false, toAmount: '' }); delete T.errors.toAmount; render(); },
});

const PAGES = V.PAGES;
document.body.insertAdjacentHTML('afterbegin', `<div class="pv-bar"><b>F-019 · ${V.DIRECTION.name}</b>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="tablet">Tablet</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Screen</span>${PAGES.map((p) => `<button data-page-set="${p.id}">${p.label}</button>`).join('')}</div>
  ${V.BAR ?? ''}
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="notes" aria-expanded="false">About this direction</button>
  <div class="pv-notes" id="notes" hidden><b>${V.DIRECTION.name}</b><p style="margin:4px 0 0">${V.DIRECTION.thesis}</p><ul>${V.DIRECTION.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
setView(innerWidth >= 1200 ? 'desktop' : 'phone');

const BASE_ACTIONS = {
  nav: (a) => { state.more = false; render(); toast(`${a.dataset.to} isn’t part of this prototype`); },
  'add-tx': () => { state.more = false; openForm('expense'); render(); V.focusFirst?.(); },
  more: () => { state.more = !state.more; render(); },
  'close-more': () => { state.more = false; render(); },
  'flip-scheme': () => { setScheme(app.dataset.scheme === 'dark' ? 'light' : 'dark'); render(); },
  'open-tx': (a) => { openTx(a.dataset.id); render(); },
  'close-form': () => { T.open = false; state.kbd = false; render(); },
  'set-type': (a) => { setType(a.dataset.type); render(); },
  'open-pick': (a) => { const p = a.dataset.pick; T.pick = T.pick === p ? null : p; T.q = ''; T.calMonth = null; render(); (document.getElementById('pk-q') ?? document.querySelector('#pk [aria-pressed="true"], .pick-sheet [aria-pressed="true"]'))?.focus(); },
  'close-pick': () => { const p = T.pick; T.pick = null; render(); document.querySelector(`[data-anchor="${p}"]`)?.focus(); },
  'pick-acc': (a) => {
    const p = T.pick;
    // Picking the To account as From swaps the two
    if (p === 'to') T.to = a.dataset.id; else { const was = T.acc; T.acc = a.dataset.id; if (T.to === T.acc) T.to = T.type === 'transfer' ? was : null; }
    T.toTouched = false; T.toAmount = ''; T.pick = null; delete T.errors.to; render(); document.querySelector(`[data-anchor="${p}"]`)?.focus();
  },
  'pick-cat': (a) => { T.cat = a.dataset.id; T.pick = null; delete T.errors.cat; render(); V.afterPickCat?.(); },
  'pick-date': (a) => { T.date = new Date(Number(a.dataset.d)); T.pick = null; render(); document.querySelector('[data-anchor="date"]')?.focus(); },
  'cal-month': (a) => { const m = T.calMonth ?? new Date(T.date.getFullYear(), T.date.getMonth(), 1); T.calMonth = new Date(m.getFullYear(), m.getMonth() + Number(a.dataset.step), 1); render(); },
  save: () => save(),
  'save-again': () => save({ again: true }),
  'ask-delete': () => { T.confirm = true; render(); document.querySelector('[data-action="keep"].btn')?.focus(); },
  keep: () => { T.confirm = false; render(); },
  'delete-now': () => deleteTx(),
  notes: (a) => { const n = document.getElementById('notes'); n.hidden = !n.hidden; a.setAttribute('aria-expanded', String(!n.hidden)); },
};
document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-page-set]');
  if (p) { go(p.dataset.pageSet); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { setScheme(s.dataset.schemeSet); render(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (!a) { if (T.pick && isWide() && !e.target.closest('.picker')) { T.pick = null; render(); } return; }
  if (a.classList.contains('scrim') && e.target.closest('[data-stop]')) {
    if (T.pick && isWide() && !e.target.closest('.picker, [data-anchor]')) { T.pick = null; render(); }
    return;
  }
  e.preventDefault();
  ({ ...BASE_ACTIONS, ...(V.actions ?? {}) })[a.dataset.action]?.(a, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.getElementById('notes').hidden = true;
  if (T.confirm) { T.confirm = false; render(); return; }
  if (T.pick) { BASE_ACTIONS['close-pick'](); return; }
  if (V.escape?.()) return;
  if (T.open) { T.open = false; state.kbd = false; render(); return; }
  if (state.more) { state.more = false; render(); }
});
applyScheme();
go(PAGES[0].id);
</script>
</body>
</html>
