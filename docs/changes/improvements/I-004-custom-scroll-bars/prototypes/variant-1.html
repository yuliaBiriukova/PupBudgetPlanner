<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.pv-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.pv-bar button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pv-bar button:hover { background: #363c47; }
.pv-bar button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(520px, calc(100vw - 32px)); background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.pv-notes ul { margin: 6px 0 0; padding-left: 18px; }
.pv-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
/* "Short window": a low desktop window, so the sidebar has to scroll */
.stage[data-view='desktop'][data-short] .frame { height: min(470px, 100%); }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
}

/* ---------- Tokens: the app's theme (theme.ts) ---------- */
.app {
  --bg: #f5f6f7; --surface: #fcfcfd; --sidebar: #ebedf0; --text: #1c1e21; --muted: #57585b;
  --rule: #d7d8d9; --hover: #e8e9ea; --field-border: #7c828a;
  --primary: #26292e; --primary-hover: #363a40; --on-primary: #f5f6f7;
  --accent: #2a62a3; --active-bg: #e7ecf1; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --focus: #26292e; --scrim: rgba(18, 19, 21, .45);
  --shadow-float: 0 8px 24px rgba(15, 17, 20, .1);
  --font-display: 'Unbounded', system-ui, sans-serif; --font-text: 'Manrope', system-ui, sans-serif;
  --r-sm: 12px; --r-lg: 24px;
}
.app[data-scheme='dark'] {
  --bg: #121315; --surface: #1b1c1e; --sidebar: #18191b; --text: #e9eaec; --muted: #a4a5a7;
  --rule: #37383a; --hover: #26272a; --field-border: #71747b;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --active-bg: #262f37; --logo: #8ec1ec; --logo-mark: #121315;
  --focus: #e9eaec; --scrim: rgba(0, 0, 0, .6);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p, ul) { margin: 0; }
:where(.app) ul { padding: 0; list-style: none; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.muted { color: var(--muted); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.logo { width: 32px; height: 32px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.avatar { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
.toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 14px; z-index: 30; white-space: nowrap; }

/* ---------- Scroll areas: a viewport that scrolls and a track the variant may draw ---------- */
.sa { position: relative; display: flex; flex-direction: column; min-height: 0; }
.sa-vp { flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain; }
.sa-track { position: absolute; display: none; pointer-events: none; }
.sa-thumb { position: absolute; left: 0; right: 0; top: 0; }

/* ---------- App shell (F-010): top bar and tab bar on the phone, sidebar from 768 px ---------- */
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
.column { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { display: flex; flex: none; align-items: center; gap: 10px; height: 56px; padding: 0 12px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand-name { font-family: var(--font-display); font-size: 15px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
/* The page: it scrolls in its own column and keeps the browser's scroll bar */
.main { flex: 1; min-height: 0; overflow: hidden auto; }
.content { max-width: 880px; margin: 0 auto; padding: 8px 16px 32px; }
.tabs { display: flex; flex: none; align-items: center; gap: 2px; padding: 8px 8px 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.tab { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; color: var(--muted); font-size: 13px; text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab[data-active] { width: auto; padding: 0 14px 0 12px; background: var(--active-bg); color: var(--accent); font-weight: 500; }
.tab:not([data-active]) .tab-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tab-add { display: grid; place-items: center; width: 52px; height: 52px; margin-left: auto; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
@container app (min-width: 768px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); background: var(--sidebar); min-width: 0; }
  .side-head { display: flex; flex: none; align-items: center; gap: 10px; height: 44px; margin: 12px 12px 12px; padding: 0 2px; }
  .side-head .logo { margin: 0 6px; }
  .side-add { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin: 0 12px 14px; border: 0; border-radius: var(--r-sm); background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
  .side .sa { flex: 1; }
  .nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px 12px; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 12px; flex: none; height: 40px; padding: 0 14px; border-radius: var(--r-sm); color: var(--text); font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { background: var(--hover); }
  .nav-link[aria-current='page'] { font-weight: 500; }
  .nav-link[aria-current='page'] > svg { color: var(--accent); }
  .nav-link[aria-current='page']::before { content: ''; position: absolute; top: 8px; bottom: 8px; left: -12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-sep { height: 1px; flex: none; margin: 10px 14px; background: var(--rule); }
  .side-foot { display: flex; flex: none; align-items: center; gap: 12px; min-height: 56px; padding: 0 20px; border-top: 1px solid var(--rule); font-size: 14px; }
  .side-foot .avatar { width: 32px; height: 32px; }
  .top, .tabs { display: none; }
  .content { padding: 28px 40px 48px; }
  .toast { bottom: 24px; }
}

/* ---------- People page (F-028), long enough to scroll ---------- */
.page-head h1 { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; }
.lead { margin: 10px 0 18px; color: var(--muted); max-width: 560px; }
.open-btn { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 20px; margin-bottom: 20px; border-radius: 999px; border: 1px solid var(--field-border); background: var(--surface); cursor: pointer; font-weight: 500; }
.open-btn:hover { background: var(--hover); }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 2px 14px; min-height: 64px; padding: 10px 16px; border-radius: var(--r-sm); background: var(--surface); }
.row .who { min-width: 0; }
.row .who b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .who span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .date { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* ---------- Dialog: a sheet from the bottom on the phone, centered from 768 px ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: var(--scrim); }
.dialog { display: flex; flex-direction: column; width: 100%; max-height: 90%; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-float); overflow: hidden; }
.grab { flex: none; width: 36px; height: 4px; margin: 10px auto 2px; border-radius: 4px; background: var(--rule); }
.dlg-head { display: flex; flex: none; align-items: center; gap: 12px; padding: 6px 12px 8px 20px; border-bottom: 1px solid transparent; transition: border-color .15s; }
.dlg-head h2 { margin-right: auto; font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 1.3; }
.dlg-body .sa-vp { padding: 4px 16px 20px; }
@container app (min-width: 768px) {
  .scrim { align-items: center; justify-content: center; padding: 32px; }
  .dialog { width: 480px; max-height: min(720px, 100%); border-radius: var(--r-lg); }
  .grab { display: none; }
  .dlg-head { padding: 20px 16px 10px 28px; }
  .dlg-body .sa-vp { padding: 4px 24px 28px; }
}

/* Category list (the default categories, F-013) */
.grp + .grp { margin-top: 14px; }
.grp-title { padding: 8px 12px 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
.cat { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 12px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; cursor: pointer; }
.cat:hover { background: var(--hover); }
.cat[aria-pressed='true'] { background: var(--active-bg); color: var(--accent); font-weight: 500; }
.cat .ic { margin-left: auto; }

/* Long dropdown (sample) */
.dd { position: relative; max-width: 360px; }
.dd label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
.dd-btn { display: flex; align-items: center; width: 100%; height: 52px; padding: 0 12px 0 16px; border: 1px solid var(--accent); outline: 1px solid var(--accent); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; text-align: left; }
.dd-btn .ic { margin-left: auto; color: var(--muted); }
.dd-list { margin-top: 6px; height: 232px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--shadow-float); }
@container app (min-width: 768px) { .dd-list { height: 300px; } }
.dd-list .sa-vp { padding: 6px; }
.dd-list .grp + .grp { margin-top: 6px; }
.dd-list .cat { min-height: 44px; }

/* ====================================================================================================== */
/* ---------- Variant 1 · Quiet pill ---------- */
/* Every scrolling area inside the app gets the pill; the page column (.main) keeps the browser's bar */
.app .sa-vp::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
.app .sa-vp::-webkit-scrollbar-track { background: transparent; margin: 12px 0; }
.app .sa-vp::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 999px; background: var(--field-border) padding-box; min-height: 32px; }
.app .sa-vp::-webkit-scrollbar-thumb:hover { border-width: 2px; background-color: var(--muted); }
.app .sa-vp::-webkit-scrollbar-button { display: none; }
@supports not selector(::-webkit-scrollbar) {
  .app .sa-vp { scrollbar-width: thin; scrollbar-color: var(--field-border) transparent; }
}
/* A hairline under the title once the list has moved */
.dialog:has(.sa[data-top]) .dlg-head { border-bottom-color: var(--rule); }
</style>
</head>

<div class="stage" id="stage">

<script>
const DIRECTION = {
  name: 'Variant 1 · Quiet pill',
  thesis: 'The browser’s own scroll bar, only quieter: a thin grey pill that is always there when something scrolls, with no track and no arrows. CSS only, one rule for the whole app.',
  notes: [
    "Thumb: a 4 px pill in the fields’ border color (3:1 against the surface, light and dark), 6 px and darker under the mouse. No track, no arrow buttons.",
    "Always visible while there is more to scroll, so a mouse user sees at once that the dialog is longer than the screen.",
    "The bar keeps 12 px away from the top and bottom, so it never runs into the dialog’s 24 px corners.",
    "Dialog and phone sheet: the title and the close button stay put, only the list scrolls; a hairline appears under the title once the list has moved.",
    "The page behind does not move: the list keeps the scroll to itself (overscroll-behavior: contain) and Mantine locks the page.",
    "Built in the app with one global style for every scrolling element except the page column; nothing to wrap. On phones (touch) the system’s own overlay bar shows instead, as in every app.",
    "Firefox can only color the bar (thin, no rounded insets); Chrome, Edge and Safari show it as here."
  ],
};

  people: ['M6 21v-2a4 4 0 0 1 4 -4h2', 'M22 16c0 4 -2.5 6 -3.5 6s-3.5 -2 -3.5 -6c1 0 2.5 -.5 3.5 -1.5c1 1 2.5 1.5 3.5 1.5z', 'M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0'],

  check: ['M5 12l5 5l10 -10'],

const icon = (n, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n].map((d) => `<path d="${d}"/>`).join('')}</svg>`;

const PEOPLE = [

const GROUPS = [

const PAGES = [

const app = document.getElementById('app');
const stage = document.getElementById('stage');
const mq = matchMedia('(prefers-color-scheme: dark)');
const state = { page: 'page', schemePref: 'light', picked: 'Groceries' };

function applyScheme() {

mq.addEventListener('change', applyScheme);

// ---------- Pieces ----------
/** A scrolling area: the viewport scrolls; the track and thumb are drawn by the variants that need them. */
const scrollArea = (inner, cls = '', label = '') => `<div class="sa ${cls}" data-sa>

</div>`;

const NAV = [['receipt', 'Transactions'], ['wallet', 'Accounts'], ['chart', 'Reports'], ['tags', 'Categories'], ['users', 'Family'], ['settings', 'Settings']];
function shell(inner) {
  return `<div class="shell">

      <div class="side-head"><span class="logo" aria-hidden="true">${icon('stack', 20)}</span><span class="brand-name">Pup Budget</span></div>

      ${scrollArea(`<nav class="nav" aria-label="Main">
        ${NAV.map(([i, l]) => `<a class="nav-link" href="#${l.toLowerCase()}">${icon(i)}${l}</a>`).join('')}
        <div class="nav-sep" role="presentation"></div>
        <a class="nav-link" href="#people" aria-current="page">${icon('people')}People</a>
      </nav>`, 'side-scroll')}
      <div class="side-foot"><span class="avatar" aria-hidden="true">YB</span><span>Yulia Biriukova</span></div>
    </aside>
    <div class="column">
      <header class="top"><div class="brand"><span class="logo" aria-hidden="true">${icon('stack', 20)}</span><span class="brand-name">Pup Budget</span></div><span class="avatar" aria-hidden="true">YB</span></header>
      <main class="main"><div class="content">${inner}</div></main>
      <nav class="tabs" aria-label="Main">
        ${NAV.slice(0, 3).map(([i, l]) => `<a class="tab" href="#${l.toLowerCase()}">${icon(i)}<span class="tab-label">${l}</span></a>`).join('')}
        <button class="tab" type="button" data-active>${icon('dots')}<span class="tab-label">More</span></button>
        <button class="tab-add" type="button" data-action="toast" data-text="Add transaction (F-018)" aria-label="Add transaction">${icon('plus', 24)}</button>
      </nav>
    </div>
  </div>`;
}

const initials = (n) => n.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
function peoplePage() {
  return `<div class="page-head"><h1>People</h1></div>
    <p class="lead">Everyone with an account. The page scrolls with the browser’s own scroll bar; everything inside it gets Pup’s.</p>
    <button class="open-btn" type="button" data-nav="dialog">${icon('tags')}Open a long dialog</button>
    <ul class="rows">${PEOPLE.map(([n, e, d]) => `<li class="row"><span class="avatar" aria-hidden="true">${initials(n)}</span><span class="who"><b>${n}</b><span>${e}</span></span><span class="date">${d}</span></li>`).join('')}</ul>`;
}

const catList = (h = 'h3') => GROUPS.map(([g, cats], gi) => `<section class="grp" aria-labelledby="g${gi}"><${h} class="grp-title" id="g${gi}">${g}</${h}><ul>${cats.map((c) => {
  const on = gi > 0 && c === state.picked;
  return `<li><button class="cat" type="button" aria-pressed="${on}" data-action="pick" data-cat="${c}">${c}${on ? icon('check') : ''}</button></li>`;
}).join('')}</ul></section>`).join('');

function dialog() {
  return `<div class="scrim" data-action="close"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" data-stop>
    <div class="grab" aria-hidden="true"></div>
    <div class="dlg-head"><h2 id="dlg-title">Pick a category</h2><button class="icon-btn" type="button" data-action="close" aria-label="Close">${icon('x')}</button></div>
    ${scrollArea(catList(), 'dlg-body')}
  </div></div>`;
}

function dropdownPage() {
  return `<div class="page-head"><h1>Long dropdown</h1></div>
    <p class="lead">A sample, like the category field of Add expense (F-018): only the scroll bar is the point.</p>
    <div class="dd"><label id="dd-label">Category</label>
      <button class="dd-btn" type="button" aria-haspopup="listbox" aria-expanded="true" aria-labelledby="dd-label dd-value"><span id="dd-value">${state.picked}</span>${icon('chevron')}</button>
      ${scrollArea(catList('h2'), 'dd-list')}
    </div>`;
}

// ---------- Scroll areas: thumb size and place, and the edges with more content behind them ----------
function wireScrollAreas() {
  document.querySelectorAll('[data-sa]').forEach((sa) => {
    const vp = sa.querySelector('.sa-vp');
    const track = sa.querySelector('.sa-track');
    const thumb = sa.querySelector('.sa-thumb');
    let hideTimer;
    const update = () => {
      const { scrollTop, scrollHeight, clientHeight } = vp;
      const max = scrollHeight - clientHeight;
      const over = max > 1;
      sa.toggleAttribute('data-overflow', over);
      sa.toggleAttribute('data-top', scrollTop > 1);
      sa.toggleAttribute('data-bottom', over && scrollTop < max - 1);
      if (!over) return;
      const th = track.clientHeight;
      const h = Math.max(32, (th * clientHeight) / scrollHeight);
      thumb.style.height = `${h}px`;
      thumb.style.transform = `translateY(${((th - h) * scrollTop) / max}px)`;
    };
    vp.addEventListener('scroll', () => {
      update();
      sa.setAttribute('data-scrolling', '');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => sa.removeAttribute('data-scrolling'), 900);
    }, { passive: true });
    new ResizeObserver(update).observe(vp);
    // Dragging the thumb, and a click on the track pages up or down
    thumb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      thumb.setPointerCapture(e.pointerId);
      sa.setAttribute('data-dragging', '');
      const startY = e.clientY;
      const startTop = vp.scrollTop;
      const ratio = (vp.scrollHeight - vp.clientHeight) / (track.clientHeight - thumb.offsetHeight);
      const move = (ev) => { vp.scrollTop = startTop + (ev.clientY - startY) * ratio; };
      const up = () => { sa.removeAttribute('data-dragging'); thumb.removeEventListener('pointermove', move); thumb.removeEventListener('pointerup', up); };
      thumb.addEventListener('pointermove', move);
      thumb.addEventListener('pointerup', up);
    });
    track.addEventListener('pointerdown', (e) => {
      if (e.target === thumb) return;
      const down = e.clientY > thumb.getBoundingClientRect().top;
      vp.scrollBy({ top: (down ? 1 : -1) * vp.clientHeight * 0.9, behavior: 'smooth' });
    });
    update();
  });
}

// ---------- Render ----------
function render() {
  const p = state.page;
  stage.toggleAttribute('data-short', p === 'short');
  const body = p === 'dropdown' ? dropdownPage() : peoplePage();
  app.innerHTML = shell(body) + (p.startsWith('dialog') ? dialog() : '');
  wireScrollAreas();
  if (p === 'dialog-scrolled') {
    const vp = document.querySelector('.dlg-body .sa-vp');
    vp.scrollTop = (vp.scrollHeight - vp.clientHeight) * 0.45;
  }
  if (p === 'dropdown') {
    const vp = document.querySelector('.dd-list .sa-vp');
    vp.scrollTop = vp.querySelector('[aria-pressed="true"]').offsetTop - 60;
  }
  document.querySelectorAll('[data-page-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pageSet === p)));
}
function go(id) { state.page = id; render(); }
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  app.appendChild(t); setTimeout(() => t.remove(), 2200);
}

// Preview bar (review aid)
document.body.insertAdjacentHTML('afterbegin', `<div class="pv-bar"><b>I-004 · ${DIRECTION.name}</b>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Screen</span>${PAGES.map((p) => `<button data-page-set="${p.id}">${p.label}</button>`).join('')}</div>
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="notes" aria-expanded="false">About this direction</button>
  <div class="pv-notes" id="notes" hidden><b>${DIRECTION.name}</b><p style="margin:4px 0 0">${DIRECTION.thesis}</p><ul>${DIRECTION.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); render(); }

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const p = e.target.closest('[data-page-set]');
  if (p) { go(p.dataset.pageSet); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { state.schemePref = s.dataset.schemeSet; applyScheme(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  if (a.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  ({
    close: () => go('page'),
    pick: () => { state.picked = a.dataset.cat; if (state.page === 'dropdown') render(); else { go('page'); toast(`${a.dataset.cat} picked`); } },
    toast: () => toast(a.dataset.text),
    notes: () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; a.setAttribute('aria-expanded', String(!n.hidden)); },
  })[a.dataset.action]?.(a);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.getElementById('notes').hidden = true;
  if (state.page.startsWith('dialog')) go('page');
});
applyScheme();
setView(innerWidth >= 1200 ? 'desktop' : 'phone');
</script>
</body>
