<style>
/* ---------- Preview bar and frame (review aid, not part of the design) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; background: #d7dade; font-family: system-ui, sans-serif; }
.pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1e24; color: #e9ecef; font-size: 13px; position: relative; z-index: 10; }
.pv-bar b { font-weight: 600; margin-right: auto; }
.pv-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pv-group > span { color: #9aa1ab; margin-right: 2px; }
.pv-bar button { font: inherit; color: #e9ecef; background: #2c313a; border: 1px solid #3d434d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pv-bar button:hover { background: #363c47; }
.pv-bar button[aria-pressed='true'] { background: #e9ecef; color: #1b1e24; border-color: #e9ecef; }
.pv-notes { position: absolute; right: 16px; top: 100%; margin-top: 6px; width: min(480px, calc(100vw - 32px)); background: #1b1e24; color: #e9ecef; border-radius: 10px; padding: 14px 18px; line-height: 1.5; box-shadow: 0 12px 32px rgba(0,0,0,.35); }
.pv-notes ul { margin: 6px 0 0; padding-left: 18px; }
.pv-notes li + li { margin-top: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.frame { position: relative; overflow: hidden; flex: none; container: app / inline-size; }
.stage[data-view='phone'] .frame { width: 375px; height: min(812px, 100%); border: 10px solid #16181d; border-radius: 44px; }
.stage[data-view='tablet'] .frame { width: 834px; height: min(1050px, 100%); border: 12px solid #16181d; border-radius: 28px; }
.stage[data-view='desktop'] .frame { width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
@media (max-width: 600px) {
  .stage { padding: 0; }
  .stage .frame { width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; }
  .pv-view { display: none !important; }
}

/* ---------- Tokens: the app's theme (F-010, F-011, F-028) plus income / expense for balances ---------- */
.app {
  --bg: #f5f6f7; --surface: #fcfcfd; --sidebar: #ebedf0; --seg-bg: #ebedf0; --text: #1c1e21; --muted: #57585b;
  --rule: #d7d8d9; --hover: #e8e9ea; --field-border: #7c828a;
  --primary: #26292e; --primary-hover: #363a40; --on-primary: #f5f6f7;
  --accent: #2a62a3; --active-bg: #e7ecf1; --tint: #e7ecf1; --logo: #8ec1ec; --logo-mark: #1c1e21;
  --hero: #26292e; --on-hero: #f5f6f7; --hero-muted: #b4b9bf; --hero-rule: #474c54;
  --error: #b3261e; --error-bg: #fbeceb; --error-text: #8c1d18;
  --expense: #b3261e; --income: #1f7a4d; --danger: #b3261e; --danger-hover: #9a2019; --on-danger: #fcfcfd;
  --pill: #1c1e21; --on-pill: #f5f6f7; --focus: #26292e; --scrim: rgba(18, 19, 21, .45);
  --shadow-float: 0 8px 24px rgba(15, 17, 20, .1);
  --font-display: 'Unbounded', system-ui, sans-serif; --font-text: 'Manrope', system-ui, sans-serif;
  --r-sm: 12px; --r-lg: 24px;
}
.app[data-scheme='dark'] {
  --bg: #121315; --surface: #1b1c1e; --sidebar: #18191b; --seg-bg: #121315; --text: #e9eaec; --muted: #a4a5a7;
  --rule: #37383a; --hover: #26272a; --field-border: #71747b;
  --primary: #e9eaec; --primary-hover: #d3d6da; --on-primary: #121315;
  --accent: #8ec1ec; --active-bg: #262f37; --tint: #262f37; --logo: #8ec1ec; --logo-mark: #121315;
  --hero: #0b0c0d; --on-hero: #e9eaec; --hero-muted: #a4a5a7; --hero-rule: #2e3035;
  --error: #f2958c; --error-bg: #3a1d1b; --error-text: #f6b8b2;
  --expense: #f2958c; --income: #7fd1a4; --danger: #f2958c; --danger-hover: #f6b8b2; --on-danger: #121315;
  --pill: #e9eaec; --on-pill: #121315; --focus: #e9eaec; --scrim: rgba(0, 0, 0, .6);
  --shadow-float: 0 10px 28px rgba(0, 0, 0, .45);
}

/* ---------- Base ---------- */
.app { height: 100%; width: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; color-scheme: light; }
.app[data-scheme='dark'] { color-scheme: dark; }
:where(.app) :where(button, input) { font: inherit; color: inherit; }
:where(.app) :where(h1, h2, h3, p, ul, fieldset, legend) { margin: 0; }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.neg { color: var(--expense); }
.muted { color: var(--muted); }
.list { list-style: none; padding: 0; margin: 0; }

/* Buttons and fields (the F-011 set, corners from F-028: pills for text buttons, circles for icon buttons) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 15px; text-decoration: none; white-space: nowrap; background: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: var(--surface); color: var(--text); border-color: var(--field-border); }
.btn-outline:hover { background: var(--hover); }
.btn-quiet { color: var(--text); }
.btn-quiet:hover { background: var(--hover); }
.btn-danger { background: var(--danger); color: var(--on-danger); }
.btn-danger:hover { background: var(--danger-hover); }
.btn-danger[disabled] { opacity: .45; cursor: not-allowed; }
.btn-danger-quiet { color: var(--error); }
.btn-danger-quiet:hover { background: var(--error-bg); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.field label, .field legend { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; padding: 0; }
.field .hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
.field .err { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--error); font-weight: 500; }
fieldset.field { border: 0; padding: 0; min-width: 0; }
.control { position: relative; display: flex; align-items: center; height: 52px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); }
.control:focus-within { border-color: var(--accent); outline: 1px solid var(--accent); outline-offset: 0; }
/* The field draws the focus (a 2 px accent border); the input inside doesn't add a second ring */
.control input:focus-visible { outline: none; }
/* The list has its own X; the browser's clear button would be a second one */
.control input[type="search"]::-webkit-search-cancel-button { display: none; }
.control input { flex: 1; min-width: 0; height: 100%; padding: 0 16px; border: 0; background: none; color: var(--text); font-size: 16px; outline: none; border-radius: inherit; }
.control .affix { padding: 0 16px 0 0; color: var(--muted); font-size: 16px; }
.control .affix-start { padding: 0 0 0 16px; }
.control .affix-start + input { padding-left: 8px; }
.control .end-btn { margin-right: 4px; }
.field[data-invalid] .control { border-color: var(--error); outline: 1px solid var(--error); }
.control input.amount { text-align: right; font-variant-numeric: tabular-nums; }
/* Options as pills: radio buttons (bank, currency) */
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; display: inline-flex; }
.opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--field-border); border-radius: 999px; background: var(--surface); font-weight: 500; font-size: 14px; white-space: nowrap; }
.opt input:checked + span { background: var(--active-bg); border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.opt:hover input:not(:checked) + span { background: var(--hover); }
.text-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--accent); font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--pill); color: var(--on-pill); font-size: 14px; z-index: 30; white-space: nowrap; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--tint); color: var(--text); }
.banner .ic { margin-top: 2px; color: var(--accent); }
.banner-error { background: var(--error-bg); color: var(--error-text); }
.banner-error .ic { color: var(--error-text); }

/* ---------- App shell (F-010): top bar and tab bar on the phone, sidebar from 768 px ---------- */
.logo { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--logo); color: var(--logo-mark); }
.shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
.column { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.top { display: flex; flex: none; align-items: center; gap: 10px; height: 56px; padding: 0 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand .logo { width: 32px; height: 32px; }
.brand-name { font-family: var(--font-display); font-size: 15px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; }
.main { flex: 1; min-height: 0; overflow: hidden auto; position: relative; }
.content { max-width: 1040px; margin: 0 auto; padding: 8px 16px 32px; }
.tabs { display: flex; flex: none; align-items: center; gap: 2px; padding: 8px 8px 10px; border-top: 1px solid var(--rule); background: var(--bg); }
.tab { display: flex; flex: none; align-items: center; justify-content: center; gap: 8px; width: 44px; min-height: 48px; border-radius: 999px; color: var(--muted); font-size: 13px; text-decoration: none; background: none; border: 0; cursor: pointer; }
.tab[data-active] { width: auto; padding: 0 14px 0 12px; background: var(--active-bg); color: var(--accent); font-weight: 500; }
.tab:not([data-active]) .tab-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tab-add { display: grid; place-items: center; width: 52px; height: 52px; margin-left: auto; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--active-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
@container app (min-width: 768px) {
  .shell { grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-right: 1px solid var(--rule); background: var(--sidebar); min-width: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; height: 44px; margin-bottom: 12px; padding: 0 2px; }
  .side-head .logo { width: 32px; height: 32px; margin: 0 6px; }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin-bottom: 14px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 500; cursor: pointer; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 999px; color: var(--text); font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap; }
  .nav-link:hover { background: var(--hover); }
  .nav-link[aria-current='page'] { font-weight: 500; }
  .nav-link[aria-current='page'] > svg { color: var(--accent); }
  .nav-link[aria-current='page']::before { content: ''; position: absolute; top: 8px; bottom: 8px; left: -12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-sep { height: 1px; margin: 10px 14px; background: var(--rule); }
  .side-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; margin-top: auto; padding: 0 8px; font-size: 14px; }
  .top, .tabs { display: none; }
  .content { padding: 32px 40px 48px; }
  .toast { bottom: 24px; }
}

/* ---------- Page head ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 0 18px; }
.page-head h1 { font-family: var(--font-display); font-weight: 300; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; margin-right: auto; }
.page-head .new-btn { order: 3; width: 100%; min-height: 52px; }
@container app (min-width: 768px) {
  .page-head { flex-wrap: nowrap; }
  .page-head .new-btn { order: 0; width: auto; min-height: 48px; }
}

/* ---------- Dialogs: a sheet on the phone, centered from 768 px; title and buttons stay, the middle scrolls (I-004) ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: var(--scrim); }
.dialog { display: flex; flex-direction: column; width: 100%; max-height: 92%; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--surface); box-shadow: var(--shadow-float); overflow: hidden; }
.dialog > form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.dlg-head { position: relative; padding: 16px 64px 0 16px; }
.dlg-x { position: absolute; top: 8px; right: 8px; }
.dlg-head h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 28px; }
.dlg-head p { margin-top: 6px; color: var(--muted); }
.dlg-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 8px; }
.dlg-body > * + * { margin-top: 16px; }
.dlg-body p + p { margin-top: 10px; }
.dlg-foot { display: flex; flex-direction: column-reverse; gap: 8px; padding: 8px 16px 16px; }
.dlg-foot .btn { width: 100%; min-height: 48px; }
/* Three buttons on the phone: the main one on its own row, Archive and Cancel side by side under it */
@container app (max-width: 767px) {
  .dlg-foot:has(.left) { display: grid; grid-template-columns: 1fr 1fr; }
  .dlg-foot:has(.left) .btn-primary { grid-column: 1 / -1; order: -1; }
}
@container app (min-width: 768px) {
  .scrim { align-items: center; justify-content: center; }
  .dialog { width: 480px; max-height: 88%; border-radius: var(--r-lg); }
  .dlg-head { padding: 20px 68px 0 20px; }
  .dlg-x { top: 12px; right: 12px; }
  .dlg-body { padding: 20px 20px 8px; }
  .dlg-foot { flex-direction: row; justify-content: flex-end; padding: 12px 20px 20px; }
  .dlg-foot .btn { width: auto; min-height: 44px; }
  .dlg-foot .left { margin-right: auto; }
}

/* ---------- States shared by all variants ---------- */
.sk { display: block; height: 14px; border-radius: 6px; background: var(--hover); }
.state-box { max-width: 460px; padding: 32px 0 8px; }
.state-box h2 { font-family: var(--font-display); font-weight: 300; font-size: 20px; line-height: 1.3; }
.state-box p { margin-top: 8px; color: var(--muted); }
.state-box .btn { margin-top: 18px; }
/* Archived: folded under the list */
.disc { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; margin-top: 28px; padding: 0 8px; border: 0; border-radius: var(--r-sm); background: none; color: var(--text); cursor: pointer; text-align: left; }
.disc:hover { background: var(--hover); }
.disc h2 { font-family: var(--font-display); font-weight: 300; font-size: 17px; }
.disc .n { color: var(--muted); font-size: 14px; margin-right: auto; font-variant-numeric: tabular-nums; }
.chev { transition: transform 160ms; color: var(--muted); }
[aria-expanded='true'] > .chev { transform: rotate(180deg); }
.arch-list { display: grid; gap: 8px; margin-top: 6px; }
.arch-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 8px 10px 16px; border: 1px dashed var(--field-border); border-radius: var(--r-sm); }
.arch-row .what { color: var(--muted); font-size: 14px; }
.arch-row .btn { grid-column: 2; grid-row: 1 / span 2; }
/* The one moment: a new account's row is tinted for a moment while its total counts up */
@keyframes flash { from { background: var(--tint); } }
[data-new] { animation: flash 1600ms ease-out; }
@media (prefers-reduced-motion: reduce) { [data-new] { animation: none; } .chev { transition: none; } }
.arch-row .bal { color: var(--muted); }

/* ---------- Round 2: the group switch, the currency picker, sources and banks ---------- */
/* Group by: a two-way switch, the Sign in / Create account pill (F-011) */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 20px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 999px; background: var(--seg-bg); border: 0; margin: 0; min-width: 0; }
.app[data-scheme='dark'] .seg { background: #0d0e0f; }
.seg legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.seg .opt { display: block; }
.seg .opt span { justify-content: center; width: 100%; min-height: 40px; padding: 0 18px; border: 0; background: none; color: var(--muted); }
.seg .opt input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(15, 17, 20, .14); }
.app[data-scheme='dark'] .seg .opt input:checked + span { background: #2e3035; box-shadow: none; }
.seg .opt:hover input:not(:checked) + span { background: none; color: var(--text); }
.seg-label { color: var(--muted); font-size: 14px; }
.group-by { display: flex; align-items: center; gap: 10px; }
@container app (max-width: 767px) { .seg .opt span { min-height: 44px; } .group-by { width: 100%; } .group-by .seg { flex: 1; } }

/* The currency field: a button that opens a searchable list inside the dialog */
.pick-btn { display: flex; align-items: center; gap: 12px; width: 100%; height: 52px; padding: 0 12px 0 16px; border: 1px solid var(--field-border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-size: 16px; text-align: left; cursor: pointer; }
.pick-btn b { font-weight: 500; }
.pick-btn .what { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-btn[aria-expanded='true'] { border-color: var(--accent); outline: 1px solid var(--accent); }
.picker { margin-top: 8px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); }
.picker .control { margin: 8px; height: 48px; }
.picker-list { max-height: 248px; overflow: auto; padding: 0 6px 6px; }
.picker-list h3 { padding: 10px 10px 4px; color: var(--muted); font-size: 13px; font-weight: 500; }
.picker-list button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); text-align: left; cursor: pointer; }
.picker-list button:hover { background: var(--hover); }
.picker-list button b { width: 40px; flex: none; font-weight: 500; }
.picker-list button[aria-pressed='true'] { color: var(--accent); background: var(--active-bg); }
.picker-list .none { padding: 12px 10px; color: var(--muted); }
/* "New source" and "Another bank": a pill that turns into a field */
.opt-new { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 1px dashed var(--field-border); border-radius: 999px; background: none; color: var(--accent); font-weight: 500; font-size: 14px; cursor: pointer; }
.opt-new:hover { background: var(--hover); }
.new-field { margin-top: 10px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.suggest button { min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--seg-bg); color: var(--text); font-size: 14px; cursor: pointer; }
.app[data-scheme='dark'] .suggest button { background: #2e3035; }
.suggest button:hover { background: var(--hover); }
.suggest-label { margin-top: 8px; color: var(--muted); font-size: 13px; }

/* Totals by currency, when the groups don't show them (grouped by source) */
.totals { display: flex; flex-wrap: wrap; gap: 12px 32px; }
.totals .t-item { min-width: 0; }
.totals .what { display: block; color: var(--muted); font-size: 13px; }
.totals .num { display: block; font-family: var(--font-display); font-weight: 300; font-size: 22px; letter-spacing: -.01em; line-height: 1.3; }
.totals .t-item:first-child .num { font-size: 30px; }

/* Groups */
.grp + .grp { margin-top: 30px; }
.grp-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 12px; }
.grp-head h2 { font-family: var(--font-display); font-weight: 300; font-size: 18px; line-height: 1.3; }
.grp-head .n { color: var(--muted); font-size: 14px; }

/* A card: the name and what it is on top, the balance at the bottom; the balance shrinks with the card (never
   overlaps or wraps): the card is a size container */
.acard { container: acard / inline-size; position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; width: 100%; min-width: 0; min-height: 108px; padding: 16px 18px; border: 1px solid var(--card-border, var(--rule)); border-radius: var(--r-sm); background: var(--card-bg, var(--surface)); color: var(--card-text, var(--text)); text-align: left; cursor: pointer; --muted: var(--card-muted, #57585b); }
.app[data-scheme='dark'] .acard { --muted: var(--card-muted, #a4a5a7); }
.acard .a-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline; }
.acard .a-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acard .a-code { color: var(--muted); font-size: 13px; font-weight: 500; }
.acard .a-meta { grid-column: 1 / -1; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acard .a-bal { font-family: var(--font-display); font-weight: 300; font-size: min(24px, 10cqi); letter-spacing: -.01em; line-height: 1.2; white-space: nowrap; }
.acard .neg { color: var(--card-debt, var(--expense)); }
.acard[data-new] { animation: none; }
.acard[data-new]::after { content: ''; position: absolute; inset: -4px; border: 2px solid var(--accent); border-radius: 15px; animation: ring 1600ms ease-out forwards; pointer-events: none; }
@keyframes ring { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .acard[data-new]::after { display: none; } }
.acards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

/* ---------- Round 3: variant 2's card styles, picked per account ---------- */
:is(.acard, .mini)[data-style='solid'] { --card-bg: #26292e; --card-border: #26292e; --card-text: #f5f6f7; --card-muted: #b4b9bf; --card-debt: #f2958c; }
:is(.acard, .mini)[data-style='solid']:hover { --card-bg: #363a40; --card-border: #363a40; }
.app[data-scheme='dark'] :is(.acard, .mini)[data-style='solid'] { --card-bg: #e9eaec; --card-border: #e9eaec; --card-text: #1c1e21; --card-muted: #474c54; --card-debt: #a1221b; }
.app[data-scheme='dark'] :is(.acard, .mini)[data-style='solid']:hover { --card-bg: #d3d6da; --card-border: #d3d6da; }
:is(.acard, .mini)[data-style='tinted'] { --card-bg: var(--tint); --card-border: var(--tint); }
:is(.acard, .mini)[data-style='tinted']:hover { --card-border: var(--accent); }
:is(.acard, .mini)[data-style='envelope'] { border-style: dashed; --card-border: var(--field-border); }
:is(.acard, .mini)[data-style='plain']:hover, :is(.acard, .mini)[data-style='envelope']:hover { --card-border: var(--text); }
/* ====================================================================================================== */
/* ---------- Round 3 layout: variant 4's groups, group switch and ghost card, with variant 2's card styles ---------- */
.v4 { container: v4 / inline-size; }
.v4 .grp-head { justify-content: space-between; }
.v4 .grp-head .title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.v4 .grp-head .cap { color: var(--muted); font-size: 14px; }
.v4 .grp-total { margin-left: auto; font-family: var(--font-display); font-weight: 300; font-size: 22px; letter-spacing: -.01em; }
/* The ghost card: the next card in the group, still empty. Its dashes are the accent, so it isn't taken for an
   envelope card (grey dashes) */
.acard.ghost { flex-direction: row; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border: 1px dashed var(--accent); background: none; color: var(--accent); font-weight: 500; text-align: center; }
.acard.ghost:hover { background: var(--active-bg); }
.v4-totals { margin: 0 0 26px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.v4-totals .label { margin-bottom: 4px; color: var(--muted); font-size: 14px; }
@container v4 (min-width: 420px) {
  .v4 .acards { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .v4 .acard { aspect-ratio: 1.586; min-height: 0; padding: 18px 20px; }
  .acard.ghost { flex-direction: column; gap: 8px; padding: 12px 20px; }
  .v4 .grp-total { font-size: 24px; }
}
/* The card as it will look, in the form */
.preview { display: grid; place-items: center; padding: 6px 0 2px; }
.preview .acard { width: min(100%, 280px); aspect-ratio: 1.586; min-height: 0; cursor: default; }
/* A small drawing of a card style: a line for the name, a thicker one for the balance */
.mini { display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--card-border, var(--rule)); background: var(--card-bg, var(--surface)); color: var(--card-text, var(--text)); }
.mini i { display: block; width: 55%; height: 3px; border-radius: 2px; background: currentColor; opacity: .55; }
.mini i + i { width: 80%; height: 5px; opacity: 1; }
/* ---------- Variant 10 · Final: variant 9 with the style right under the preview, and the total of everything ---------- */
/* Card style: the pills sit right under the card they change */
.style-block { display: grid; gap: 12px; }
.style-block .field { margin: 0; }
/* Four equal tiles in one row, the drawing over the name, so all four stay next to the card on the phone */
.style-opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.style-opts .opt { display: block; }
.style-opts .opt > span { flex-direction: column; justify-content: center; gap: 6px; width: 100%; min-height: 64px; padding: 8px 4px; border-radius: var(--r-sm); font-size: 13px; }
.style-opts .opt span.mini { display: flex; flex-direction: column; justify-content: space-between; gap: 0; width: 28px; height: 18px; min-height: 0; padding: 4px; border: 1px solid var(--card-border, var(--rule)); border-radius: 4px; background: var(--card-bg, var(--surface)); color: var(--card-text, var(--text)); box-shadow: none; }
.style-opts .opt span.mini[data-style='envelope'] { border-style: dashed; border-color: var(--field-border); }
.style-opts .mini i { height: 2px; }
.style-opts .mini i + i { height: 3px; }
.style-block legend { width: 100%; text-align: center; }

/* In total: everything in the report currency first, then each currency on its own */
.grand .what { color: var(--muted); font-size: 14px; }
.grand .num { display: block; margin-top: 2px; font-family: var(--font-display); font-weight: 300; font-size: 34px; letter-spacing: -.02em; line-height: 1.15; }
.grand .rates { margin-top: 6px; color: var(--muted); font-size: 13px; }
.grand .rates .num { display: inline; margin: 0; font-family: var(--font-text); font-size: inherit; letter-spacing: 0; }
.grand .stale { display: inline-flex; align-items: center; gap: 6px; }
.v10-totals .totals { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
.v10-totals .totals .t-item:first-child .num, .v10-totals .totals .num { font-size: 18px; }
@container app (min-width: 768px) { .grand .num { font-size: 40px; } }

/* The card in the form: a little smaller on the phone, so the styles fit under it */
.style-block .preview .acard { width: min(100%, 230px); }
@container app (min-width: 768px) { .style-block .preview .acard { width: min(100%, 260px); } }
/* ---------- I-011: deleting an account ---------- */
.confirm-name label b { font-weight: 500; }

.arch-row .acts { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 4px; }
.arch-row .acts .btn { padding: 0 16px; }
@container app (max-width: 767px) {
  .arch-row:has(.acts) { grid-template-columns: minmax(0, 1fr); padding: 12px 8px 8px 16px; }
  .arch-row .acts { grid-column: 1; grid-row: auto; justify-content: flex-end; margin-top: 4px; }
}
/* Archive or delete: two answers to one question, as cards with a radio */
.choices { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.choices legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.choice { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 2px 12px; padding: 14px 16px; border: 1px solid var(--field-border); border-radius: var(--r-sm); cursor: pointer; }
.choice input { grid-row: 1 / span 2; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.choice b { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.choice span { color: var(--muted); font-size: 14px; }
.choice:hover { background: var(--hover); }
.choice:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--active-bg); }
.choice.danger:has(input:checked) { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); background: var(--error-bg); }
.choice.danger input { accent-color: var(--error); }
.choice.danger b { color: var(--error); }
.choice:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
</style>
</head>

const CUR = Object.fromEntries(NBU.map((c) => [c.code, c]));

// ---------- Money: "1 250.00 ₴", "$1 240.00", "€300.00", "640.00 PLN"; a true minus (DESIGN_RULES §5) ----------
const NB = ' ';
const BEFORE = { USD: '$', EUR: '€', GBP: '£' };
function money(v, code) {
  const n = Math.round(Math.abs(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NB);

// ---------- Count-up: the total of the currency that changed (the one moment that moves) ----------
function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach((el) => {
    const [from, to, cur] = [Number(el.dataset.from), Number(el.dataset.count), el.dataset.cur];
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 700); const e = 1 - (1 - k) ** 3;
      el.textContent = money(from + (to - from) * e, cur);
      if (k < 1) requestAnimationFrame(step);
    };
    el.textContent = money(from, cur);
    requestAnimationFrame(step);
  });
}

  thesis: 'One way out of the edit form, two answers: “Archive or delete” asks what should happen to the account, with Archive picked first and Delete for good as the other, red answer. You see both side by side, so nobody deletes when they meant to put an account away.',
  notes: [
    'Edit form: Archive becomes “Archive or delete”. On the phone: Save on its own row, then “Archive or delete” and Cancel.',
    'The question: two cards, Archive (picked) and Delete for good. The button under them follows the answer: “Archive”, or “Delete for good” in red.',
    'Picking Delete shows what goes with it: the money still on it; later (F-018) the transactions and transfers, and then the name has to be typed.',
    'Archived rows get Delete next to Restore too, with the same confirmation as variant 1.',
    'After deleting: the card is gone, its currency’s total counts down to the new one, a short “… deleted” notification.',
  ],
};
PAGES = [
  { id: 'accounts', label: 'List' },
  { id: 'accounts-edit', label: 'Edit' },
  { id: 'rm-archive', label: 'Question: Archive' },
  { id: 'rm-delete', label: 'Question: Delete' },
  { id: 'rm-zero', label: 'Delete: nothing on it' },
  { id: 'rm-later', label: 'Later (F-018): transactions' },
  { id: 'accounts-archived', label: 'Archived: Restore or Delete' },
  { id: 'deleted', label: 'Deleted' },
];
V.archivedActions = (a) => `<span class="acts"><button class="btn btn-quiet" type="button" data-action="restore" data-id="${a.id}" aria-label="Restore ${esc(a.name)}">${icon('restore')}Restore</button><button class="btn btn-quiet btn-danger-quiet" type="button" data-action="ask-delete" data-id="${a.id}" aria-label="Delete ${esc(a.name)}">${icon('trash')}Delete</button></span>`;
V.editLeft = () => '<button class="btn btn-quiet left" type="button" data-action="ask-remove">Archive or delete</button>';
function removeDialog() {
  const a = find(state.ask.id); const del = state.ask.choice === 'delete';
  return `<div class="scrim" data-action="cancel-delete"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" data-stop>
    <div class="dlg-head">${closeX('cancel-delete')}<h2 id="dlg-title">Archive or delete ${esc(a.name)}?</h2></div>
    <div class="dlg-body">
      <fieldset class="choices"><legend>What should happen to ${esc(a.name)}</legend>
        <label class="choice"><input type="radio" name="rm" value="archive"${del ? '' : ' checked'} data-rm><b>${icon('archive')}Archive</b><span>Hidden from the list, the totals and the pickers. Its history stays, and you can restore it any time.</span></label>
        <label class="choice danger"><input type="radio" name="rm" value="delete"${del ? ' checked' : ''} data-rm><b>${icon('trash')}Delete for good</b><span>Removed from Pup Budget with everything on it. This can’t be undone.</span></label>
      </fieldset>
      ${del ? deleteFacts(a) + typeNameField(a) : a.bal !== 0 ? `<div class="banner">${icon('info')}<p>It still has ${amount(a.bal, a.cur)}. Archived, that money is no longer in the ${a.cur} total.</p></div>` : ''}
    </div>
    <div class="dlg-foot"><button class="btn btn-quiet" type="button" data-action="cancel-delete">Cancel</button>${del ? deleteButton() : `<button class="btn btn-primary" type="button" data-action="do-archive">${icon('archive')}Archive</button>`}</div>
  </div></div>`;
}
V.dialog = () => (state.ask?.kind === 'remove' ? removeDialog() : '');
V.actions = { 'ask-remove': () => { state.ask = { kind: 'remove', id: state.form.id, choice: 'archive', typed: '', from: 'edit' }; render(); document.querySelector('[data-rm]:checked')?.focus(); } };
document.addEventListener('change', (e) => { if (e.target.matches('[data-rm]')) { state.ask.choice = e.target.value; rerender(`[data-rm][value="${e.target.value}"]`); } });
V.go = (id) => {
  const pick = { 'rm-archive': ['mono-usd', 'archive'], 'rm-delete': ['mono-usd', 'delete'], 'rm-zero': ['privat-eur', 'delete'], 'rm-later': ['mono-usd', 'delete'] }[id];
  if (pick) { state.form = formFor(find(pick[0])); state.ask = { kind: 'remove', id: pick[0], choice: pick[1], typed: '', from: 'edit' }; }
  if (id === 'rm-zero') { const e = find('privat-eur'); e.bal = 0; }
  if (id === 'rm-later') state.later = true;
};
V.afterGo = (id) => { if (id === 'deleted') doDelete('mono-usd'); };


// ---------- Render ----------
function body() {
  const p = state.page;
  if (p === 'accounts-empty') return V.empty();
  if (p === 'accounts-loading') return V.loading();
  if (p === 'accounts-error') return errorState();
  return `${pageHead()}<div class="toolbar">${groupSwitch()}</div>${V.totals()}${V.groups(groups())}${archivedBlock()}`;
}
function dialog() {
  const vd = V.dialog?.(); if (vd) return vd;
  if (state.ask?.kind === 'delete') return deleteDialog();
  if (state.page === 'accounts-archive') return archiveDialog();
  if (state.form) return accountDialog();
  if (state.more) return `<div class="scrim" data-action="close-more"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="more-title" data-stop><div class="dlg-head">${closeX('close-more')}<h2 id="more-title">More</h2></div><div class="dlg-body" style="padding-top:4px">
    <ul class="list">${[['users', 'Family'], ['settings', 'Settings'], ['people', 'People']].map(([i, l]) => `<li><a href="#${l.toLowerCase()}" data-action="close-more" style="display:flex;align-items:center;gap:14px;min-height:52px;padding:0 12px;border-radius:12px;color:var(--text);text-decoration:none">${icon(i)}${l}</a></li>`).join('')}</ul></div></div></div>`;
  return '';
}
function render() {
  const scroll = document.querySelector('.main')?.scrollTop ?? 0;
  const dlgScroll = document.querySelector('.dlg-body')?.scrollTop ?? 0;
  app.innerHTML = shell(body()) + dialog();
  document.querySelector('.main').scrollTop = scroll;
  const db = document.querySelector('.dlg-body'); if (db) db.scrollTop = dlgScroll;
  document.querySelectorAll('[data-page-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pageSet === state.page)));
}
const formFor = (a) => ({ mode: 'edit', id: a.id, name: a.name, cur: a.cur, src: a.src, bank: a.bank ?? state.banks[0], newSrc: null, newBank: null, open: String(a.open), date: a.opened, style: a.style, styleSet: true });
const blankForm = (preset = {}) => ({ mode: 'new', name: '', cur: 'UAH', src: 'bank', bank: state.banks[0], newSrc: null, newBank: null, open: '0', date: '29 Oct 2026', ...preset, style: preset.style ?? defaultStyle(preset.src ?? 'bank'), styleSet: false });
function go(id) {
  Object.assign(state, { page: id, more: false, form: null, newId: null, showArchived: false, groupBy: id === 'accounts-by-source' ? 'src' : 'cur' });
  const empty = id === 'accounts-empty';
  state.accounts = empty ? [] : START.map((a) => ({ ...a }));
  state.archived = empty ? [] : START_ARCHIVED.map((a) => ({ ...a }));
  state.sources = START_SOURCES.filter((s) => !empty || !s.own).map((s) => ({ ...s }));
  state.banks = empty ? [] : [...START_BANKS];
  if (id === 'accounts-new') state.form = blankForm();
  if (id === 'accounts-new-in-group') state.form = blankForm({ cur: 'USD' });
  if (id === 'accounts-new-currency') state.form = { ...blankForm(), name: 'Pounds for London', src: 'cash', curOpen: true, curQuery: 'pou' };
  if (id === 'accounts-new-bank') state.form = { ...blankForm(), name: 'Oschad card', newBank: 'O' };
  if (id === 'accounts-new-source') state.form = { ...blankForm(), name: 'Bitcoin', cur: 'USD', newSrc: 'Crypto wallet' };
  if (id === 'accounts-new-style') state.form = { ...blankForm({ src: 'cash' }), name: 'Wallet', open: '1200.00' };
  if (id === 'accounts-new-errors') state.form = { ...blankForm({ cur: 'USD' }), open: '1,240.5.0', newBank: '', errors: { name: 'Give the account a name.', bank: 'Pick your bank or type its name.', open: 'Enter an amount like 1240.50 or −300.' } };
  if (id === 'accounts-edit' || id === 'accounts-archive') state.form = formFor(state.accounts.find((a) => a.id === 'mono-usd'));
  if (id === 'accounts-archived') state.showArchived = true;
  if (id === 'accounts-saved') { state.accounts.push({ ...NEW_ACCOUNT }); state.newId = NEW_ACCOUNT.id; }
  state.ask = null; state.later = false; state.dropped = null;
  V.go?.(id);
  render();
  document.querySelector('.main').scrollTop = 0;
  if (id === 'accounts-saved') { countUp(); toast('Vacation envelope added'); }
  V.afterGo?.(id);
  // Screens about one part of a long form or page open scrolled to that part
  const focusOn = V.focusOn?.[id] ?? { 'accounts-new-currency': '#cur-picker', 'accounts-new-bank': '#new-bank', 'accounts-new-source': '#new-src', 'accounts-archived': '#archived', 'accounts-new-style': '#style-field' }[id];
  if (focusOn) document.querySelector(focusOn)?.scrollIntoView({ block: 'center' });
}
function toast(text) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  app.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function readForm() {
  const f = state.form;
  document.querySelectorAll('[data-form-field]').forEach((el) => {
    const k = el.dataset.formField;
    if (el.type === 'radio') { if (el.checked) f[k] = el.value; } else f[k] = el.value;
  });
}
/** Re-draws the dialog and puts the focus back where it was (or on the given selector). */
function rerender(focusSel) {
  const id = document.activeElement?.id;
  render();
  const el = (focusSel && document.querySelector(focusSel)) || (id && document.getElementById(id));
  el?.focus();
}

// Preview bar (review aid)
document.body.insertAdjacentHTML('afterbegin', `<div class="pv-bar"><b>I-011 · ${DIRECTION.name}</b>
  <div class="pv-group pv-view"><span>View</span><button data-view="phone">Phone</button><button data-view="tablet">Tablet</button><button data-view="desktop">Desktop</button></div>
  <div class="pv-group"><span>Screen</span>${PAGES.map((p) => `<button data-page-set="${p.id}">${p.label}</button>`).join('')}</div>
  <div class="pv-group"><span>Theme</span><button data-scheme-set="light">Light</button><button data-scheme-set="dark">Dark</button><button data-scheme-set="system">System</button></div>
  <button data-action="notes" aria-expanded="false">About this direction</button>
  <div class="pv-notes" id="notes" hidden><b>${DIRECTION.name}</b><p style="margin:4px 0 0">${DIRECTION.thesis}</p><ul>${DIRECTION.notes.map((n) => `<li>${n}</li>`).join('')}</ul></div></div>`);
function setView(v) { stage.dataset.view = v; document.querySelectorAll('button[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
setView(innerWidth >= 1200 ? 'desktop' : 'phone');

document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-page-set]');
  if (p) { go(p.dataset.pageSet); return; }
  const s = e.target.closest('[data-scheme-set]');
  if (s) { state.schemePref = s.dataset.schemeSet; applyScheme(); return; }
  const v = e.target.closest('button[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  if (a.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  e.preventDefault();
  if (state.form && a.closest('form')) readForm();
  ({
    new: () => {
      const preset = {};
      if (a.dataset.cur) preset.cur = a.dataset.cur;
      if (a.dataset.src) preset.src = a.dataset.src;
      if (a.dataset.bank) preset.bank = a.dataset.bank;
      state.form = blankForm(preset); render(); document.getElementById('acc-name')?.focus();
    },
    edit: () => { state.form = formFor(find(a.dataset.id)); render(); },
    'close-dialog': () => { state.form = null; state.ask = null; if (state.page === 'accounts-archive') state.page = 'accounts'; render(); },
    'cur-toggle': () => { state.form.curOpen = !state.form.curOpen; state.form.curQuery = ''; rerender(state.form.curOpen ? '#cur-search' : '#cur-btn'); },
    'cur-pick': () => { Object.assign(state.form, { cur: a.dataset.code, curOpen: false, curQuery: '' }); rerender('#cur-btn'); },
    'src-new': () => { state.form.newSrc = ''; rerender('#new-src'); },
    'src-cancel': () => { state.form.newSrc = null; rerender('input[name="src"]:checked'); },
    'bank-new': () => { state.form.newBank = ''; rerender('#new-bank'); },
    'bank-cancel': () => { state.form.newBank = null; rerender('input[name="bank"]:checked'); },
    'bank-suggest': () => { state.form.newBank = a.dataset.bank; rerender('#new-bank'); },
    'ask-archive': () => { state.page = 'accounts-archive'; render(); },
    'do-archive': () => {
      const acc = state.accounts.find((x) => x.id === state.form.id);
      state.accounts = state.accounts.filter((x) => x !== acc);
      state.archived.unshift({ ...acc, archived: '29 Oct 2026' });
      state.form = null; state.page = 'accounts'; render(); toast(`${acc.name} archived`);
    },
    restore: () => {
      const acc = state.archived.find((x) => x.id === a.dataset.id);
      state.archived = state.archived.filter((x) => x !== acc);
      state.accounts.push(acc); state.newId = acc.id; render(); toast(`${acc.name} is back`);
    },
    'toggle-archived': () => { state.showArchived = !state.showArchived; render(); document.querySelector('[data-action="toggle-archived"]')?.focus(); },
    retry: () => go('accounts'),
    'add-tx': () => toast('Add transaction (F-018)'),
    toast: () => toast(a.dataset.text),
    more: () => { state.more = !state.more; render(); },
    'close-more': () => { state.more = false; render(); },
    'ask-delete': () => { readFormSafe(); state.ask = { kind: 'delete', id: a.dataset.id ?? state.form?.id, typed: '', from: state.form ? 'edit' : 'list' }; render(); document.querySelector('[data-confirm-name]')?.focus(); },
    'cancel-delete': () => { const back = state.ask?.from === 'edit'; state.ask = null; if (!back) state.form = null; render(); },
    'do-delete': () => doDelete(state.ask.id),
    ...(V.actions ?? {}),
    notes: () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; a.setAttribute('aria-expanded', String(!n.hidden)); },
  })[a.dataset.action]?.(a);
});
document.addEventListener('change', (e) => {
  if (e.target.matches('[data-group-by]')) { state.groupBy = e.target.value; state.newId = null; rerender(`input[name="group-by"][value="${e.target.value}"]`); return; }
  if (!state.form || !e.target.matches('[data-form-field]')) return;
  readForm();
  if (e.target.type === 'radio') {
    if (e.target.name === 'src') { state.form.newSrc = null; if (!state.form.styleSet) state.form.style = defaultStyle(state.form.src); }
    if (e.target.name === 'style') state.form.styleSet = true;
    if (e.target.name === 'bank') state.form.newBank = null;
    rerender(`input[name="${e.target.name}"][value="${e.target.value}"]`);
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-confirm-name]')) { state.ask.typed = e.target.value; const ok = nameMatches(); document.querySelector('[data-action="do-delete"]').disabled = !ok; return; }
  if (e.target.matches('[data-cur-search]')) { state.form.curQuery = e.target.value; document.getElementById('cur-list').innerHTML = pickerList(state.form); return; }
  if (!state.form || !e.target.matches('[data-form-field]')) return;
  readForm();
  if (e.target.id === 'new-bank') {
    const q = state.form.newBank.trim().toLowerCase();
    document.getElementById('bank-suggest').innerHTML = bankSuggest(SUGGESTED_BANKS.filter((b) => !state.banks.includes(b) && (!q || b.toLowerCase().includes(q)) && b.toLowerCase() !== q).slice(0, 6));
  }
  V.onInput?.();
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  readForm();
  const f = state.form;
  const errors = {};
  if (!f.name.trim()) errors.name = 'Give the account a name.';
  if (f.newSrc != null && !f.newSrc.trim()) errors.newSrc = 'Name the new source.';
  if (f.newSrc == null && f.src === 'bank' && (f.newBank != null ? !f.newBank.trim() : !f.bank)) errors.bank = 'Pick your bank or type its name.';
  if (!/^[−-]?\d[\d\s]*([.,]\d{1,2})?$/.test(f.open.trim())) errors.open = 'Enter an amount like 1240.50 or −300.';
  if (Object.keys(errors).length) { f.errors = errors; render(); return; }
  if (f.newSrc != null) { const id = `own-${Date.now()}`; state.sources.push({ id, name: f.newSrc.trim(), own: true }); f.src = id; }
  if (f.src === 'bank' && f.newBank != null) { f.bank = f.newBank.trim(); if (!state.banks.includes(f.bank)) state.banks.push(f.bank); }
  const open = Number(f.open.replace(/\s/g, '').replace(',', '.').replace('−', '-'));
  const fields = { name: f.name.trim(), src: f.src, bank: f.src === 'bank' ? f.bank : undefined, cur: f.cur, open, opened: f.date, style: f.style };
  if (f.mode === 'edit') {
    const acc = find(f.id);
    Object.assign(acc, fields, { bal: acc.bal + (open - acc.open) });
    state.form = null; state.newId = null; render(); toast('Saved');
  } else {
    const acc = { id: `a${Date.now()}`, ...fields, bal: open };
    state.accounts.push(acc); state.form = null; state.newId = acc.id; state.page = 'accounts';
    render(); countUp(); toast(`${acc.name} added`);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.getElementById('notes').hidden = true;
  if (state.form?.curOpen) { state.form.curOpen = false; rerender('#cur-btn'); return; }
  if (state.ask) { state.ask = null; render(); return; }
  if (state.form || state.more) { state.form = null; state.more = false; if (state.page === 'accounts-archive') state.page = 'accounts'; render(); }
});
applyScheme();
go('accounts');

</script>
</body>
</html>
